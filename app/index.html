function abrirCard(fi, key, label, a, b, dec, sufixo){
  const fx = FIXTURES[fi];
  // cards nascem da visão "Todos" (o modo clube único não tem linha clicável)
  const rxH = computeRx(fx.homeId, fx.ligaId, state.rxJanela, state.rxEscopo, null);
  const rxA = computeRx(fx.awayId, fx.ligaId, state.rxJanela, state.rxEscopo, null);
  const ehContinental = ehContinentalLiga(fx.ligaId);
  let contexto = `média dos últimos ${Math.max(rxH?.jogos||0, rxA?.jogos||0)} jogos`;
  if (state.rxEscopo === "comp") contexto += ehContinental ? " · copas continentais" : ` · ${fx.competicao}`;
  if (rxH?.inclui2025 || rxA?.inclui2025) contexto += " · inclui temporada 2025";
  // extrato jogo a jogo da estatística clicada (pro card detalhado)
  const sel = STAT_SEL[key];
  const extrato = tid => sel
    ? getJogosRx(tid, fx.ligaId, state.rxJanela, state.rxEscopo, null)
        .map(j => ({ v: sel(j), adv: j.advNome || j.ts?.slice(5).split("-").reverse().join("/") || "?" }))
        .filter(e => e.v != null)
    : [];
  state.card = { fx, key, label, a, b, dec, sufixo, contexto,
    extratoH: extrato(fx.homeId), extratoA: extrato(fx.awayId), formato: "sticker" };
  montarCardModal();
}
/* Atalho do seletor de estatística: escolhe no dropdown → abre o card na hora */
const STAT_META = {
  gols: ["Gols marcados", 1, ""], fin: ["Finalizações", 1, ""], chutesGol: ["Chutes a gol", 1, ""],
  cantos: ["Escanteios", 1, ""], golsSof: ["Gols sofridos", 1, ""], finSof: ["Finalizações sofridas", 1, ""],
  cantosSof: ["Escanteios cedidos", 1, ""], defesas: ["Defesas de goleiro", 1, ""],
  faltas: ["Faltas cometidas", 1, ""], amarelos: ["Cartões amarelos", 1, ""], vermelhos: ["Cartões vermelhos", 2, ""],
  posse: ["Posse de bola", 0, "%"], laterais: ["Arremessos laterais", 1, ""], tiroMeta: ["Tiros de meta", 1, ""],
};
function irEstatistica(fi, sel){
  const key = sel.value;
  sel.selectedIndex = 0; // volta pro placeholder (permite repetir a escolha)
  if (!key || !STAT_META[key]) return;
  const fx = FIXTURES[fi];
  const rxH = computeRx(fx.homeId, fx.ligaId, state.rxJanela, state.rxEscopo, null);
  const rxA = computeRx(fx.awayId, fx.ligaId, state.rxJanela, state.rxEscopo, null);
  const [label, dec, sufixo] = STAT_META[key];
  if (!rxH || !rxA || rxH[key] == null || rxA[key] == null) return;
  abrirCard(fi, key, label, rxH[key], rxA[key], dec, sufixo);
}

  const { fi, side, idx } = state.j2 || {};
  const fx = FIXTURES[fi]; if (!fx) return;
  const tid = side === "home" ? fx.homeId : fx.awayId;
  const tname = side === "home" ? fx.home : fx.away;
  const j = (ELENCOS[String(tid)] || [])[idx]; if (!j) return;
  const janela = state.jgJanela || 10, escopo = state.jgEscopo || "geral";
  const hist = getHistJogador(tid, j.name, janela, escopo, fx.ligaId);
  if (!hist.length) return;
  const key = PJ_CARD_META[statKey] ? statKey : "f";
  const meta = PJ_CARD_META[key];
  const pts = [...hist].reverse().map(g => ({ v: g[key], adv: g.a || "", ts: g.t || "" })).filter(p => p.v != null);
  if (!pts.length) return;
  const ehContinental = ehContinentalLiga(fx.ligaId);
  const escLabel = escopo === "comp" ? (ehContinental ? "copas continentais" : fx.competicao) : "todas as competições";
  state.card = { tipo: "grafico", formato: "sticker", fx,
                 jog: { nome: j.name, time: tname, pos: j.pos || "" },
                 label: meta[0], dec: meta[1], sufixo: key === "m" ? "'" : "",
                 contexto: `últimos ${pts.length} jogos · ${escLabel}`,
                 series: [{ nome: j.name, cor: "#FE2C55", pts, media: pts.reduce((a,p)=>a+p.v,0)/pts.length }] };
  montarCardModal();
}

/* Card-gráfico: as barras jogo a jogo dos dois times numa arte postável */
function abrirCardGrafico(fi, key, label, dec, sufixo){
  const fx = FIXTURES[fi];
  const sel = STAT_SEL[key]; if (!sel) return;
  const serie = (tid, nome, cor) => {
    const js = [...getJogosRx(tid, fx.ligaId, state.rxJanela, state.rxEscopo, null)].reverse();
    const pts = js.map(j => ({ v: sel(j), adv: j.advNome || "", ts: j.ts || "" })).filter(p => p.v != null);
    if (!pts.length) return null;
    return { nome, cor, pts, media: pts.reduce((a2,p)=>a2+p.v,0)/pts.length };
  };
  const s1 = serie(fx.homeId, fx.home, "#2AE8E0"), s2 = serie(fx.awayId, fx.away, "#FE2C55");
  if (!s1 && !s2) return;
  const ehContinental = ehContinentalLiga(fx.ligaId);
  let contexto = `últimos ${Math.max(s1?.pts.length||0, s2?.pts.length||0)} jogos`;
  if (state.rxEscopo === "comp") contexto += ehContinental ? " · copas continentais" : ` · ${fx.competicao}`;
  state.card = { tipo: "grafico", formato: "sticker", fx, key, label, dec, sufixo,
                 contexto, series: [s1, s2].filter(Boolean) };
  montarCardModal();
}

async function desenharGrafico(){
  const c = state.card;
  const UI = "'TikTok Sans', -apple-system, 'Segoe UI', Roboto, sans-serif";
  const MONO = "'TikTok Sans', -apple-system, 'Segoe UI', Roboto, sans-serif";
  const W = 1080, cx = W / 2;
  const chartH = 200, blocoH = 46 + chartH + 64;
  // no card de jogador o header tem linha extra (time · posição): desce o resto
  const oHeader = 88, oSub = c.jog ? 200 : 166, oCtx = c.jog ? 238 : 206, g0 = c.jog ? 282 : 252;
  const oFooter = g0 + c.series.length * blocoH + 4, panelH = oFooter + 44;

  const sticker = c.formato === "sticker";
  const H = sticker ? panelH + 48 : (c.formato === "story" ? 1920 : 1350);
  const cv = document.getElementById("cardCanvas");
  if (!cv) return;
  cv.width = W; cv.height = H;
  const x = cv.getContext("2d");
  x.clearRect(0, 0, W, H);

  if (!sticker){
    const g = x.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#0D0D10"); g.addColorStop(0.5, "#08080A"); g.addColorStop(1, "#060608");
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    const glow = x.createRadialGradient(W/2, H*0.3, 60, W/2, H*0.3, W*0.8);
    glow.addColorStop(0, "rgba(42,232,224,0.12)"); glow.addColorStop(1, "rgba(42,232,224,0)");
    x.fillStyle = glow; x.fillRect(0, 0, W, H);
  }

  const px = 24, pw = W - 48;
  const py = sticker ? 24 : Math.max(24, Math.round((H - panelH) / 2));
  x.fillStyle = "rgba(7,7,9,0.92)";
  x.beginPath(); x.roundRect(px, py, pw, panelH, 44); x.fill();
  x.strokeStyle = "rgba(42,232,224,0.4)"; x.lineWidth = 3;
  x.beginPath(); x.roundRect(px, py, pw, panelH, 44); x.stroke();
  const Y = o => py + o;
  x.textAlign = "center"; x.textBaseline = "middle";

  // header: jogador (foto + nome) OU os dois times (escudos + nomes)
  if (c.jog){
    const foto = await carregaImg(window.SC_ASSETS?.fotos?.[c.jog.nome]);
    const yT = Y(oHeader), sz = 76;
    let size = 42;
    while (size > 28){
      x.font = `800 ${size}px ${UI}`;
      if (x.measureText(c.jog.nome).width <= pw - 220) break;
      size -= 2;
    }
    const nomeW = x.measureText(c.jog.nome).width;
    let cur = cx - (sz + 18 + nomeW) / 2;
    x.save(); x.beginPath(); x.roundRect(cur, yT - sz/2, sz, sz, 18); x.clip();
    if (foto) x.drawImage(foto, cur, yT - sz/2, sz, sz);
    else { x.fillStyle = "#1F1F26"; x.fillRect(cur, yT - sz/2, sz, sz); }
    x.restore();
    x.textAlign = "left"; x.fillStyle = "#F5F5F7"; x.fillText(c.jog.nome, cur + sz + 18, yT);
    x.textAlign = "center"; x.font = `500 22px ${MONO}`; x.fillStyle = "#9A9AA5";
    x.fillText(`${c.jog.time}${c.jog.pos ? " · " + c.jog.pos : ""}`, cx, yT + sz/2 + 24);
  } else if (c.time){
    // card de TIME único: escudo + nome
    const im = await carregaImg(SC_ASSETS.escudos?.[c.time.nome]);
    const yT = Y(oHeader), cr = 68;
    let size = 42;
    while (size > 28){
      x.font = `800 ${size}px ${UI}`;
      if (x.measureText(c.time.nome).width <= pw - 220) break;
      size -= 2;
    }
    const nomeW = x.measureText(c.time.nome).width;
    let cur = cx - (cr + 16 + nomeW) / 2;
    x.save(); x.beginPath(); x.roundRect(cur, yT - cr/2, cr, cr, 16); x.clip();
    if (im) x.drawImage(im, cur, yT - cr/2, cr, cr);
    else { x.fillStyle = "#1F1F26"; x.fillRect(cur, yT - cr/2, cr, cr); }
    x.restore();
    x.textAlign = "left"; x.fillStyle = "#F5F5F7"; x.fillText(c.time.nome, cur + cr + 16, yT);
    x.textAlign = "center";
  } else {
    const [imH, imA] = await Promise.all([
      carregaImg(SC_ASSETS.escudos?.[c.fx.home]), carregaImg(SC_ASSETS.escudos?.[c.fx.away]),
    ]);
    const yT = Y(oHeader);
    x.font = `800 40px ${UI}`;
    const nHW = x.measureText(c.fx.home).width, nAW = x.measureText(c.fx.away).width;
    const cr = 64, gap = 14, meio = 56;
    let cur = cx - (cr + gap + nHW + meio + nAW + gap + cr) / 2;
    const crest = (img, nome, x0) => {
      x.save(); x.beginPath(); x.roundRect(x0, yT - cr/2, cr, cr, 15); x.clip();
      if (img) x.drawImage(img, x0, yT - cr/2, cr, cr);
      else { x.fillStyle = "#1F1F26"; x.fillRect(x0, yT - cr/2, cr, cr); }
      x.restore();
    };
    crest(imH, c.fx.home, cur); cur += cr + gap;
    x.textAlign = "left"; x.font = `800 40px ${UI}`; x.fillStyle = "#F5F5F7";
    x.fillText(c.fx.home, cur, yT); cur += nHW;
    x.textAlign = "center"; x.fillStyle = "#6B6B76"; x.font = `600 32px ${UI}`;
    x.fillText("×", cur + meio/2, yT); cur += meio;
    x.textAlign = "left"; x.fillStyle = "#F5F5F7"; x.font = `800 40px ${UI}`;
    x.fillText(c.fx.away, cur, yT); cur += nAW + gap;
    crest(imA, c.fx.away, cur);
    x.textAlign = "center";
  }
  x.font = `700 26px ${MONO}`; x.fillStyle = "#2AE8E0";
  x.fillText(`${c.label.toUpperCase()} · JOGO A JOGO`, cx, Y(oSub));
  x.font = `500 22px ${MONO}`; x.fillStyle = "#9A9AA5";
  x.fillText(c.contexto, cx, Y(oCtx));

  // um bloco de gráfico por time
  c.series.forEach((s, idx) => {
    const yB = Y(g0 + idx * blocoH);
    const ax0 = px + 44, aw = pw - 88;
    if (!c.jog){ // no card de jogador o nome já está no topo
      x.textAlign = "left"; x.font = `800 30px ${UI}`; x.fillStyle = s.cor;
      x.fillText(s.nome, ax0, yB + 10);
    }
    const top = yB + 44, bottom = top + chartH - 56;
    const n = s.pts.length, slot = aw / n, barW = Math.min(56, slot * 0.62);
    const vals = s.pts.map(p => p.v);
    // escala inclui a linha de mercado (cards de tendência), pra ela sempre caber
    const max = Math.max(...vals, c.linha ?? 0, 0.001);
    const ref = c.linha != null ? c.linha : s.media;
    const yMed = bottom - (ref / max) * (bottom - top - 26);
    x.setLineDash([7, 7]); x.strokeStyle = "rgba(255,255,255,0.4)"; x.lineWidth = 2;
    x.beginPath(); x.moveTo(ax0, yMed); x.lineTo(ax0 + aw, yMed); x.stroke();
    x.setLineDash([]);
    // barras
    s.pts.forEach((p, i) => {
      const bx = ax0 + slot * i + slot / 2;
      const apagada = p.hit !== undefined ? !p.hit : !p.v; // tendência: colore só quem bateu a linha
      const bh = Math.max(8, (p.v / max) * (bottom - top - 26));
      const by = bottom - bh;
      x.fillStyle = apagada ? "rgba(255,255,255,0.10)" : s.cor;
      x.beginPath(); x.roundRect(bx - barW/2, by, barW, bh, 6); x.fill();
      x.textAlign = "center"; x.font = `800 24px ${UI}`;
      x.fillStyle = apagada ? "#6B6B76" : s.cor;
      x.fillText(String(Number.isInteger(p.v) ? p.v : fmt(p.v, c.dec)) + (c.sufixo || ""), bx, by - 17);
      let adv = p.adv;
      x.font = `500 16px ${MONO}`;
      while (x.measureText(adv).width > slot - 8 && adv.length > 4) adv = adv.slice(0, -1);
      x.fillStyle = "#9A9AA5";
      x.fillText(adv === p.adv ? adv : adv + "…", bx, bottom + 20);
      x.fillStyle = "#6B6B76"; x.font = `500 15px ${MONO}`;
      x.fillText(p.ts.slice(5).split("-").reverse().join("/"), bx, bottom + 42);
    });
    // rótulo da referência por cima, com fundinho, ABAIXO da linha (não cobre valor de barra)
    x.font = `600 18px ${MONO}`;
    const mTxt = c.linha != null ? `linha ${String(c.linha).replace(".", ",")}` : `média ${fmt(s.media, c.dec)}`;
    const mW = x.measureText(mTxt).width;
    x.fillStyle = "rgba(7,7,9,0.9)";
    x.beginPath(); x.roundRect(ax0 + aw - mW - 14, yMed + 5, mW + 14, 24, 6); x.fill();
    x.textAlign = "right"; x.fillStyle = "#9A9AA5";
    x.fillText(mTxt, ax0 + aw - 7, yMed + 17);
    x.textAlign = "center";
  });

  // rodapé
  const yRod = Y(oFooter);
  x.textAlign = "right"; x.font = `800 26px ${UI}`;
  const wEx = x.measureText("!").width;
  x.fillStyle = "#2AE8E0"; x.fillText("!", px+pw-40, yRod);
  x.fillStyle = "#FFFFFF"; x.fillText("APITOU", px+pw-40-wEx, yRod);
  x.textAlign = "left"; x.font = `500 22px ${MONO}`; x.fillStyle = "#9A9AA5";
  x.fillText("os números falam · jogo a jogo", px+40, yRod);
  x.textAlign = "center";
}

function abrirCardSolo(fi, key){

function abrirCardH2HStat(fi, key, label, a, b, dec, sufixo){

  const extrato = (s, foiCasa) => sel

    extratoH: extrato(sel.a, j => j.mandoA), extratoA: extrato(sel.b, j => !j.mandoA) };

}

function carregaImg(src){
  return new Promise(res => {
    if (!src) return res(null);
    const img = new Image();
    img.crossOrigin = "anonymous"; // no app nativo as imagens vêm de apitou.com.br (outra origem): sem isso o canvas trava
    img.onload = () => res(img);
    img.onerror = () => res(null);
    img.src = src;
  });
}
/* ---------- ícones vetoriais dos cards ----------
   O canvas mede errado a largura de emojis (sequências compostas), o que
   desalinha texto centralizado — e emoji é estética de teclado, não da marca.
   Ícones desenhados: largura exata + identidade própria. */
function icoCartao(x, x0, cy, h, cor, tilt){
  // cartão de arbitragem, levemente inclinado
  const w = h * 0.72;
  x.save(); x.translate(x0 + w/2 + 2, cy); x.rotate(tilt ?? -0.12);
  x.fillStyle = cor;
  x.beginPath(); x.roundRect(-w/2, -h/2, w, h, h * 0.14); x.fill();
  x.restore();
  return w + 4;
}
function icoCartaoDuplo(x, x0, cy, h){
  // leque do árbitro: vermelho atrás, amarelo na frente
  icoCartao(x, x0 + h*0.30, cy - 1, h, "#E4574D", 0.16);
  icoCartao(x, x0, cy + 1, h, "#F5C542", -0.14);
  return h * 1.06;
}
function icoApito(x, x0, cy, h, cor){
  // apito da marca em miniatura: câmara + bocal curto e grosso, inclinado
  const r = h * 0.42;
  x.save(); x.translate(x0 + r + 1, cy - r*0.15); x.rotate(0.28);
  x.fillStyle = cor;
  x.beginPath(); x.roundRect(-r*0.2, -r*0.62, h*0.78, r*1.24, r*0.32); x.fill();
  x.beginPath(); x.arc(0, 0, r, 0, Math.PI*2); x.fill();
  x.fillStyle = "#0B0B0E";
  x.beginPath(); x.arc(-r*0.02, r*0.08, r*0.36, 0, Math.PI*2); x.fill();
  x.restore();
  return h * 1.1;
}
function icoFogo(x, x0, cy, h, cor){
  // chama: ponta inclinada pra direita + recorte interno
  const w = h * 0.82;
  x.save(); x.translate(x0 + w/2, cy);
  x.fillStyle = cor;
  x.beginPath();
  x.moveTo(w*0.28, -h*0.50);
  x.bezierCurveTo(w*0.30, -h*0.16, w*0.52, -h*0.10, w*0.50, h*0.12);
  x.arc(0, h*0.12, w*0.50, 0, Math.PI, false);
  x.bezierCurveTo(-w*0.54, -h*0.02, -w*0.10, -h*0.14, w*0.28, -h*0.50);
  x.fill();
  x.fillStyle = "#0B0B0E";
  x.beginPath();
  x.moveTo(w*0.02, h*0.02);
  x.bezierCurveTo(w*0.24, h*0.16, w*0.20, h*0.34, 0, h*0.42);
  x.bezierCurveTo(-w*0.20, h*0.34, -w*0.24, h*0.16, w*0.02, h*0.02);
  x.fill();
  x.restore();
  return w;
}
function icoBola(x, x0, cy, h){
  // bola: círculo claro + pentágono e gomos
  const r = h * 0.46;
  x.save(); x.translate(x0 + r, cy);
  x.fillStyle = "#F5F5F7";
  x.beginPath(); x.arc(0, 0, r, 0, Math.PI*2); x.fill();
  x.fillStyle = "#0B0B0E";
  x.beginPath();
  for (let i = 0; i < 5; i++){
    const a = -Math.PI/2 + i * 2*Math.PI/5;
    i ? x.lineTo(Math.cos(a)*r*0.42, Math.sin(a)*r*0.42)
      : x.moveTo(Math.cos(a)*r*0.42, Math.sin(a)*r*0.42);
  }
  x.closePath(); x.fill();
  x.strokeStyle = "#0B0B0E"; x.lineWidth = Math.max(1.5, h*0.06);
  for (let i = 0; i < 5; i++){
    const a = -Math.PI/2 + i * 2*Math.PI/5;
    x.beginPath();
    x.moveTo(Math.cos(a)*r*0.42, Math.sin(a)*r*0.42);
    x.lineTo(Math.cos(a)*r*0.95, Math.sin(a)*r*0.95);
    x.stroke();
  }
  x.restore();
  return r*2;
}
function icoEscudo(x, x0, cy, h, cor){
  // escudo de defesa
  const w = h * 0.82;
  x.save(); x.translate(x0 + w/2, cy - h*0.5);
  x.fillStyle = cor;
  x.beginPath();
  x.moveTo(-w/2, h*0.06);
  x.quadraticCurveTo(0, h*0.16, w/2, h*0.06);
  x.lineTo(w/2, h*0.55);
  x.quadraticCurveTo(w/2, h*0.84, 0, h*0.98);
  x.quadraticCurveTo(-w/2, h*0.84, -w/2, h*0.55);
  x.closePath(); x.fill();
  x.restore();
  return w;
}
function icoFloco(x, x0, cy, h, cor){
  // floco de neve: 6 hastes com galhos
  const r = h * 0.46;
  x.save(); x.translate(x0 + r, cy);
  x.strokeStyle = cor; x.lineWidth = Math.max(2, h*0.09); x.lineCap = "round";
  for (let i = 0; i < 6; i++){
    const a = i * Math.PI / 3;
    x.beginPath(); x.moveTo(0, 0); x.lineTo(Math.cos(a)*r, Math.sin(a)*r); x.stroke();
    const bx = Math.cos(a)*r*0.6, by = Math.sin(a)*r*0.6;
    for (const s of [-1, 1]){
      const a2 = a + s * Math.PI/3;
      x.beginPath(); x.moveTo(bx, by);
      x.lineTo(bx + Math.cos(a2)*r*0.30, by + Math.sin(a2)*r*0.30); x.stroke();
    }
  }
  x.restore();
  return r*2;
}
function icoSeq(x, icon, x0, cy, h){
  // mapeia o ícone semântico das sequências pro desenho vetorial
  if (icon === "chama") return icoFogo(x, x0, cy, h, "#FF8A3D");
  if (icon === "bola") return icoBola(x, x0, cy, h);
  if (icon === "escudo") return icoEscudo(x, x0, cy, h, "#2AE8E0");
  if (icon === "floco") return icoFloco(x, x0, cy, h, "#7FB8E8");
  return 0;
}
function tituloIco(x, texto, cx, y, icoW, gap, desenha){
  // centraliza o grupo [ícone + texto] medindo só o texto (medição confiável)
  const wT = x.measureText(texto).width;
  const x0 = cx - (icoW + gap + wT) / 2;
  const fs = x.fillStyle, ta = x.textAlign;
  desenha(x0);
  x.fillStyle = fs; x.textAlign = "left";
  x.fillText(texto, x0 + icoW + gap, y);
  x.textAlign = ta;
}

/* Sticker compacto pra sobrepor em vídeo — fundo transparente fora do painel.
   Com extrato jogo a jogo da estatística (pedido do Pedro: "quantas finalizações
   foram contra cada time"). */
async function desenharSticker(){
  const c = state.card;
  const MAXROWS = 15; // mostra todos os jogos do filtro (últimos 5/10/15), sem cortar
  const nRows = Math.min(Math.max(c.extratoH?.length || 0, c.extratoA?.length || 0), MAXROWS);
  const W = 1080, H = 640 + (nRows ? nRows * 44 + 40 : 0);
  const cv = document.getElementById("cardCanvas");
  if (!cv) return;
  cv.width = W; cv.height = H;
  const x = cv.getContext("2d");
  x.clearRect(0, 0, W, H);

  const UI = "'TikTok Sans', -apple-system, 'Segoe UI', Roboto, sans-serif";
  const MONO = "'TikTok Sans', -apple-system, 'Segoe UI', Roboto, sans-serif";
  const cx = W / 2;

  // painel arredondado semi-transparente
  const px = 24, py = 24, pw = W - 48, ph = H - 48, rad = 44;
  x.fillStyle = "rgba(7,7,9,0.92)";
  x.beginPath(); x.roundRect(px, py, pw, ph, rad); x.fill();
  x.strokeStyle = "rgba(42,232,224,0.4)"; x.lineWidth = 3;
  x.beginPath(); x.roundRect(px, py, pw, ph, rad); x.stroke();

  x.textAlign = "center"; x.textBaseline = "middle";

  // linha 1: escudos + nomes
  const yT = py + 88;
  const [imH, imA] = await Promise.all([
    carregaImg(SC_ASSETS.escudos?.[c.fx.home]),
    carregaImg(SC_ASSETS.escudos?.[c.fx.away]),
  ]);
  x.font = `800 42px ${UI}`;
  const nomeHW = x.measureText(c.fx.home).width, nomeAW = x.measureText(c.fx.away).width;
  const crest = 76, gap = 16, meio = 70;
  const total = crest + gap + nomeHW + meio + nomeAW + gap + crest;
  let cur = cx - total / 2;
  const desenhaCrest = (img, nome, cxc) => {
    x.save();
    x.beginPath(); x.roundRect(cxc, yT - crest/2, crest, crest, 18); x.clip();
    if (img) x.drawImage(img, cxc, yT - crest/2, crest, crest);
    else { x.fillStyle = "#1F1F26"; x.fillRect(cxc, yT - crest/2, crest, crest);
           x.fillStyle = "#F5F5F7"; x.font = `800 30px ${UI}`; x.fillText(initials(nome), cxc + crest/2, yT); }
    x.restore();
  };
  desenhaCrest(imH, c.fx.home, cur); cur += crest + gap;
  x.font = `800 42px ${UI}`; x.fillStyle = "#F5F5F7"; x.textAlign = "left";
  x.fillText(c.fx.home, cur, yT); cur += nomeHW;
  x.textAlign = "center"; x.fillStyle = "#6B6B76"; x.font = `600 36px ${UI}`;
  x.fillText("×", cur + meio/2, yT); cur += meio;
  x.textAlign = "left"; x.fillStyle = "#F5F5F7"; x.font = `800 42px ${UI}`;
  x.fillText(c.fx.away, cur, yT); cur += nomeAW + gap;
  desenhaCrest(imA, c.fx.away, cur);
  x.textAlign = "center";

  // linha 2: título da estatística
  x.font = `700 30px ${MONO}`; x.fillStyle = "#2AE8E0";
  x.fillText(c.label.toUpperCase() + " · POR JOGO", cx, yT + 88);

  // linha 3: números + barras
  const yNum = yT + 210, off = 240;
  const valH = fmt(c.a, c.dec) + c.sufixo, valA = fmt(c.b, c.dec) + c.sufixo;
  x.font = `800 128px ${UI}`;
  x.fillStyle = c.a >= c.b ? "#2AE8E0" : "#F5F5F7"; x.fillText(valH, cx - off, yNum);
  x.fillStyle = c.b > c.a ? "#FE2C55" : "#F5F5F7"; x.fillText(valA, cx + off, yNum);
  const barW = 280, barH = 14, yBar = yNum + 92, max = Math.max(c.a, c.b, 0.001);
  x.fillStyle = "rgba(255,255,255,0.10)";
  x.beginPath(); x.roundRect(cx - off - barW/2, yBar, barW, barH, 7); x.fill();
  x.beginPath(); x.roundRect(cx + off - barW/2, yBar, barW, barH, 7); x.fill();
  x.fillStyle = "#2AE8E0";
  x.beginPath(); x.roundRect(cx - off - barW/2, yBar, barW * (c.a/max), barH, 7); x.fill();
  x.fillStyle = "#FE2C55";
  x.beginPath(); x.roundRect(cx + off - barW/2, yBar, barW * (c.b/max), barH, 7); x.fill();

  // extrato jogo a jogo ("quantas foram contra cada time")
  if (nRows){
    const yEx0 = yBar + 74;
    const trunca = (s, n=17) => s.length > n ? s.slice(0, n-1) + "…" : s;
    // linha divisória sutil
    x.strokeStyle = "rgba(255,255,255,0.08)"; x.lineWidth = 2;
    x.beginPath(); x.moveTo(px + 60, yEx0 - 36); x.lineTo(px + pw - 60, yEx0 - 36); x.stroke();
    const fmtV = v => (Number.isInteger(v) ? String(v) : fmt(v, c.dec)) + c.sufixo;
    const NUMF = `800 30px ${UI}`, NOMEF = `500 26px ${UI}`, gapNN = 12;
    // cada linha "N × Adversário" é centralizada embaixo do número grande da coluna
    const desenhaLinha = (e, colCx, cor, y) => {
      const numTxt = fmtV(e.v), nomeTxt = "× " + trunca(e.adv);
      x.font = NUMF; const wNum = x.measureText(numTxt).width;
      x.font = NOMEF; const wNome = x.measureText(nomeTxt).width;
      const x0 = colCx - (wNum + gapNN + wNome) / 2;
      x.textAlign = "left";
      x.font = NUMF; x.fillStyle = cor; x.fillText(numTxt, x0, y);
      x.font = NOMEF; x.fillStyle = "#9A9AA5"; x.fillText(nomeTxt, x0 + wNum + gapNN, y);
    };
    for (let i = 0; i < nRows; i++){
      const y = yEx0 + i * 44;
      const eH = c.extratoH[i], eA = c.extratoA[i];
      if (eH) desenhaLinha(eH, cx - off, "#2AE8E0", y);
      if (eA) desenhaLinha(eA, cx + off, "#FE2C55", y);
    }
    x.textAlign = "center";
    const sobraH = (c.extratoH?.length || 0) - nRows, sobraA = (c.extratoA?.length || 0) - nRows;
    if (sobraH > 0 || sobraA > 0){
      x.font = `500 22px ${MONO}`; x.fillStyle = "#6B6B76";
      x.fillText(`+ ${Math.max(sobraH, sobraA)} jogos na amostra`, cx, yEx0 + nRows * 44 + 6);
    }
  }

  // rodapé: contexto à esquerda, marca à direita
  const yRod = py + ph - 44;
  x.textAlign = "left"; x.font = `500 22px ${MONO}`; x.fillStyle = "#9A9AA5";
  x.fillText(c.contexto, px + 36, yRod);
  x.textAlign = "right"; x.font = `800 26px ${UI}`;
  const wEx = x.measureText("!").width;
  x.fillStyle = "#2AE8E0"; x.fillText("!", px + pw - 36, yRod);
  x.fillStyle = "#FFFFFF"; x.fillText("APITOU", px + pw - 36 - wEx, yRod);
  x.textAlign = "center";
}

      x.textAlign = "left"; x.font = `600 30px ${UI}`; x.fillStyle = "#F5F5F7"; x.fillText(t.txt, px+60, y);
      x.textAlign = "right"; x.font = `800 30px ${MONO}`; x.fillStyle = "#2AE8E0"; x.fillText(`${t.hit}/${t.n}`, px+pw-60, y);
    });
    x.textAlign = "center";
  }

  // últimos confrontos (escudo + placar)
  if (nRes){
    x.strokeStyle = "rgba(255,255,255,0.08)"; x.lineWidth = 2;
    x.beginPath(); x.moveTo(px+60, Y(oResTitle)-28); x.lineTo(px+pw-60, Y(oResTitle)-28); x.stroke();
    x.textAlign = "left"; x.font = `700 22px ${MONO}`; x.fillStyle = "#9A9AA5";
    x.fillText("ÚLTIMOS CONFRONTOS", px+60, Y(oResTitle));
    const dataBR = ts => { const [yy,m,d] = ts.split("-"); return `${d}/${m}/${yy.slice(2)}`; };
    for (let i = 0; i < nRes; i++){
      const r = c.results[i], y = Y(resRow0 + i*resStep);
      const hostImg = r.hostEhA ? imH : imA, visImg = r.hostEhA ? imA : imH;
      const hostNm = r.hostEhA ? c.fx.home : c.fx.away, visNm = r.hostEhA ? c.fx.away : c.fx.home;
      x.textAlign = "left"; x.font = `500 22px ${MONO}`; x.fillStyle = "#6B6B76"; x.fillText(dataBR(r.ts), px+60, y);
      const sc = 34, scoreTxt = `${r.hostGols}   ×   ${r.visGols}`;
      x.textAlign = "center"; x.font = `800 34px ${MONO}`;
      const wNum = x.measureText(scoreTxt).width;
      const winCol = r.hostGols > r.visGols ? (r.hostEhA ? "#2AE8E0" : "#FE2C55")
                   : r.visGols > r.hostGols ? (r.hostEhA ? "#FE2C55" : "#2AE8E0") : "#F5F5F7";
      drawCrest(hostImg, hostNm, cx - wNum/2 - 18 - sc, y, sc);
      x.textAlign = "center"; x.font = `800 34px ${MONO}`; x.fillStyle = winCol; x.fillText(scoreTxt, cx, y);
      drawCrest(visImg, visNm, cx + wNum/2 + 18, y, sc);
    }
    x.textAlign = "center";
  }

  // rodapé
  const yRod = Y(oFooter);
  x.textAlign = "right"; x.font = `800 26px ${UI}`;
  const wEx = x.measureText("!").width;
  x.fillStyle = "#2AE8E0"; x.fillText("!", px+pw-40, yRod);
  x.fillStyle = "#FFFFFF"; x.fillText("APITOU", px+pw-40-wEx, yRod);
  x.textAlign = "left"; x.font = `500 22px ${MONO}`; x.fillStyle = "#9A9AA5";
  x.fillText("os números falam · estatística real", px+40, yRod);
  x.textAlign = "center";
}

async function desenharQuentes(){
  const c = state.card;
  const UI = "'TikTok Sans', -apple-system, 'Segoe UI', Roboto, sans-serif";
  const MONO = "'TikTok Sans', -apple-system, 'Segoe UI', Roboto, sans-serif";
  const W = 1080, cx = W / 2;
  const fH = c.fH, fA = c.fA;
  const nSeq = Math.max(fH?.seqs.length || 0, fA?.seqs.length || 0);
  const nTend = Math.max(fH?.tend.length || 0, fA?.tend.length || 0);

  // offsets relativos ao topo do painel (colunas alinhadas pela linha)
  const oHeader = 84, oSubtitle = 156, oContext = 196;
  const oColName = 262, oBoxes = 318;
  const seq0 = 392, seqStep = 52;
  const tend0 = seq0 + nSeq * seqStep + 16, tendStep = 52;
  const oFooter = tend0 + nTend * tendStep + 24, panelH = oFooter + 42;

  const sticker = c.formato === "sticker";
  const H = sticker ? panelH + 48 : (c.formato === "story" ? 1920 : 1350);
  const cv = document.getElementById("cardCanvas");
  if (!cv) return;
  cv.width = W; cv.height = H;
  const x = cv.getContext("2d");
  x.clearRect(0, 0, W, H);

  if (!sticker){
    const g = x.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#0D0D10"); g.addColorStop(0.5, "#08080A"); g.addColorStop(1, "#060608");
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    const glow = x.createRadialGradient(W/2, H*0.32, 60, W/2, H*0.32, W*0.8);
    glow.addColorStop(0, "rgba(42,232,224,0.12)"); glow.addColorStop(1, "rgba(42,232,224,0)");
    x.fillStyle = glow; x.fillRect(0, 0, W, H);
  }

  const px = 24, pw = W - 48;
  const py = sticker ? 24 : Math.max(24, Math.round((H - panelH) / 2));
  x.fillStyle = "rgba(7,7,9,0.92)";
  x.beginPath(); x.roundRect(px, py, pw, panelH, 44); x.fill();
  x.strokeStyle = "rgba(42,232,224,0.4)"; x.lineWidth = 3;
  x.beginPath(); x.roundRect(px, py, pw, panelH, 44); x.stroke();
  const Y = o => py + o;
  x.textAlign = "center"; x.textBaseline = "middle";

  const [imH, imA] = await Promise.all([
    carregaImg(SC_ASSETS.escudos?.[c.fx.home]),
    carregaImg(SC_ASSETS.escudos?.[c.fx.away]),
  ]);
  const drawCrest = (img, nome, cxc, cy, sz) => {
    x.save();
    x.beginPath(); x.roundRect(cxc, cy - sz/2, sz, sz, sz*0.24); x.clip();
    if (img) x.drawImage(img, cxc, cy - sz/2, sz, sz);
    else { x.fillStyle = "#1F1F26"; x.fillRect(cxc, cy - sz/2, sz, sz);
           x.fillStyle = "#F5F5F7"; x.font = `800 ${Math.round(sz*0.4)}px ${UI}`; x.textAlign = "center";
           x.fillText(initials(nome), cxc + sz/2, cy); }
    x.restore();
  };

  // header: escudos + nomes
  {
    const yT = Y(oHeader);
    x.font = `800 40px ${UI}`;
    const nHW = x.measureText(c.fx.home).width, nAW = x.measureText(c.fx.away).width;
    const cr = 68, gap = 15, meio = 60;
    const total = cr + gap + nHW + meio + nAW + gap + cr;
    let cur = cx - total / 2;
    drawCrest(imH, c.fx.home, cur, yT, cr); cur += cr + gap;
    x.font = `800 40px ${UI}`; x.fillStyle = "#F5F5F7"; x.textAlign = "left";
    x.fillText(c.fx.home, cur, yT); cur += nHW;
    x.textAlign = "center"; x.fillStyle = "#6B6B76"; x.font = `600 34px ${UI}`;
    x.fillText("×", cur + meio/2, yT); cur += meio;
    x.textAlign = "left"; x.fillStyle = "#F5F5F7"; x.font = `800 40px ${UI}`;
    x.fillText(c.fx.away, cur, yT); cur += nAW + gap;
    drawCrest(imA, c.fx.away, cur, yT, cr);
    x.textAlign = "center";
  }

  x.font = `700 26px ${MONO}`; x.fillStyle = "#2AE8E0";
  tituloIco(x, "QUENTES · FORMA RECENTE", cx, Y(oSubtitle), 24, 12,
            x0 => icoFogo(x, x0, Y(oSubtitle), 30, "#2AE8E0"));
  x.font = `500 22px ${MONO}`; x.fillStyle = "#9A9AA5";
  x.fillText(c.contexto, cx, Y(oContext));

  // divisória vertical entre as colunas
  x.strokeStyle = "rgba(255,255,255,0.08)"; x.lineWidth = 2;
  x.beginPath(); x.moveTo(cx, Y(oColName) - 24); x.lineTo(cx, Y(oFooter) - 40); x.stroke();

  // uma coluna por time
  const desenhaColuna = (f, nome, colCx, x0, x1, cor) => {
    // nome do time
    x.textAlign = "center"; x.font = `800 30px ${UI}`; x.fillStyle = cor;
    let nm = nome; x.font = `800 30px ${UI}`;
    while (x.measureText(nm).width > (x1 - x0) && nm.length > 4) nm = nm.slice(0, -1);
    x.fillText(nm === nome ? nm : nm + "…", colCx, Y(oColName));
    if (!f){
      x.font = `500 24px ${MONO}`; x.fillStyle = "#6B6B76";
      x.fillText("sem jogos no filtro", colCx, Y(oBoxes));
      return;
    }
    // caixinhas V/E/D (mais antigo → mais recente)
    const seq = [...f.res].reverse();
    const bs = 34, bg = 8, totalW = seq.length * bs + (seq.length - 1) * bg;
    let bx = colCx - totalW / 2;
    seq.forEach(r => {
      x.fillStyle = r === "v" ? "rgba(42,232,224,0.18)" : r === "d" ? "rgba(224,90,78,0.18)" : "rgba(255,255,255,0.06)";
      x.beginPath(); x.roundRect(bx, Y(oBoxes) - bs/2, bs, bs, 8); x.fill();
      x.font = `800 17px ${MONO}`;
      x.fillStyle = r === "v" ? "#2AE8E0" : r === "d" ? "#E05A4E" : "#9A9AA5";
      x.fillText(r.toUpperCase(), bx + bs/2, Y(oBoxes) + 1);
      bx += bs + bg;
    });
    // frases de sequência
    x.textAlign = "left";
    f.seqs.forEach((s, i) => {
      const y = Y(seq0 + i * seqStep);
      const wI = icoSeq(x, s.icon, x0, y, 28);
      x.font = `700 26px ${UI}`; x.fillStyle = "#F5F5F7";
      x.fillText(s.txt, x0 + wI + 12, y);
    });
    // tendências (70%+ em verde)
    f.tend.forEach((t, i) => {
      const y = Y(tend0 + i * tendStep);
      const hot = t.pct >= 70;
      x.textAlign = "left"; x.font = `${hot ? 700 : 500} 24px ${UI}`; x.fillStyle = hot ? "#F5F5F7" : "#9A9AA5";
      let tt = t.txt.replace(" na partida", ""); // no card o contexto já é a partida
      x.font = `${hot ? 700 : 500} 24px ${UI}`;
      while (x.measureText(tt).width > (x1 - x0 - 92) && tt.length > 6) tt = tt.slice(0, -1);
      x.fillText(tt === t.txt ? tt : tt + "…", x0, y);
      x.textAlign = "right"; x.font = `800 24px ${MONO}`; x.fillStyle = hot ? "#2AE8E0" : "#6B6B76";
      x.fillText(`${t.hit}/${t.n}`, x1, y);
    });
    x.textAlign = "center";
  };
  desenhaColuna(fH, c.fx.home, cx - 264, px + 46, cx - 34, "#2AE8E0");
  desenhaColuna(fA, c.fx.away, cx + 264, cx + 34, px + pw - 46, "#FE2C55");

  // rodapé
  const yRod = Y(oFooter);
  x.textAlign = "right"; x.font = `800 26px ${UI}`;
  const wEx = x.measureText("!").width;
  x.fillStyle = "#2AE8E0"; x.fillText("!", px+pw-40, yRod);
  x.fillStyle = "#FFFFFF"; x.fillText("APITOU", px+pw-40-wEx, yRod);
  x.textAlign = "left"; x.font = `500 22px ${MONO}`; x.fillStyle = "#9A9AA5";
  x.fillText("os números falam · estatística real", px+40, yRod);
  x.textAlign = "center";
}

async function desenharJogador(){
  const c = state.card;
  const UI = "'TikTok Sans', -apple-system, 'Segoe UI', Roboto, sans-serif";
  const MONO = "'TikTok Sans', -apple-system, 'Segoe UI', Roboto, sans-serif";
  const W = 1080, cx = W / 2;
  const n = c.hist.length;

  // card por mercado (statMode) é monotemático: sem faixa de médias gerais, layout mais curto
  const statMode = c.statKey && c.statKey !== "f";
  const selB = statMode ? (g => g[c.statKey] ?? 0) : (g => g.f);
  const oHeader = 92, oSub = 220, oNum = 352, oLbl = 428, oMed2 = 486;
  const oBoxLbl = statMode ? 500 : 556, oBoxes = statMode ? 552 : 608;
  const ex0 = statMode ? 640 : 696, exStep = 46;
  const oFooter = ex0 + n * exStep + 16, panelH = oFooter + 42;

  const sticker = c.formato === "sticker";
  const H = sticker ? panelH + 48 : (c.formato === "story" ? 1920 : 1350);
  const cv = document.getElementById("cardCanvas");
  if (!cv) return;
  cv.width = W; cv.height = H;
  const x = cv.getContext("2d");
  x.clearRect(0, 0, W, H);

  if (!sticker){
    const g = x.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#0D0D10"); g.addColorStop(0.5, "#08080A"); g.addColorStop(1, "#060608");
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    const glow = x.createRadialGradient(W/2, H*0.3, 60, W/2, H*0.3, W*0.8);
    glow.addColorStop(0, "rgba(42,232,224,0.12)"); glow.addColorStop(1, "rgba(42,232,224,0)");
    x.fillStyle = glow; x.fillRect(0, 0, W, H);
  }

  const px = 24, pw = W - 48;
  const py = sticker ? 24 : Math.max(24, Math.round((H - panelH) / 2));
  x.fillStyle = "rgba(7,7,9,0.92)";
  x.beginPath(); x.roundRect(px, py, pw, panelH, 44); x.fill();
  x.strokeStyle = "rgba(42,232,224,0.4)"; x.lineWidth = 3;
  x.beginPath(); x.roundRect(px, py, pw, panelH, 44); x.stroke();
  const Y = o => py + o;
  x.textAlign = "center"; x.textBaseline = "middle";

  // header: foto + nome (+ time · posição embaixo)
  const foto = await carregaImg(window.SC_ASSETS?.fotos?.[c.nome]);
  {
    const yT = Y(oHeader), sz = 88;
    x.font = `800 46px ${UI}`;
    const nomeW = x.measureText(c.nome).width;
    const total = sz + 20 + nomeW;
    let cur = cx - total / 2;
    x.save();
    x.beginPath(); x.roundRect(cur, yT - sz/2, sz, sz, 22); x.clip();
    if (foto) x.drawImage(foto, cur, yT - sz/2, sz, sz);
    else { x.fillStyle = "#1F1F26"; x.fillRect(cur, yT - sz/2, sz, sz);
           x.fillStyle = "#F5F5F7"; x.font = `800 34px ${UI}`; x.fillText(initials(c.nome), cur + sz/2, yT); }
    x.restore();
    x.textAlign = "left"; x.font = `800 46px ${UI}`; x.fillStyle = "#F5F5F7";
    x.fillText(c.nome, cur + sz + 20, yT);
    x.textAlign = "center"; x.font = `500 24px ${MONO}`; x.fillStyle = "#9A9AA5";
    x.fillText(`${c.time}${c.pos ? " · " + c.pos : ""}`, cx, yT + sz/2 + 30);
  }

  x.font = `700 26px ${MONO}`; x.fillStyle = "#2AE8E0";
  x.fillText("FORMA RECENTE · POR JOGO", cx, Y(oSub));

  // números grandes: padrão = finalizações + chutes a gol; com statKey = a estatística escolhida
  if (statMode){
    x.font = `800 120px ${UI}`; x.fillStyle = "#FE2C55";
    x.fillText((c.statDec === 0 ? String(Math.round(c.statMed)) : fmt(c.statMed)) + (c.statKey === "m" ? "'" : ""), cx, Y(oNum));
    x.font = `700 22px ${MONO}`; x.fillStyle = "#9A9AA5";
    x.fillText(c.statLabel.toUpperCase() + " / JOGO", cx, Y(oLbl));
  } else {
    const off = 250;
    x.font = `800 110px ${UI}`;
    x.fillStyle = "#FE2C55"; x.fillText(fmt(c.medF), cx - off, Y(oNum));
    x.fillStyle = "#2AE8E0"; x.fillText(fmt(c.medO), cx + off, Y(oNum));
    x.font = `700 22px ${MONO}`; x.fillStyle = "#9A9AA5";
    x.fillText("FINALIZAÇÕES", cx - off, Y(oLbl));
    x.fillText("CHUTES A GOL", cx + off, Y(oLbl));
  }

  // faixa de médias secundárias — só no card GERAL (finalizações); card de mercado é monotemático
  if (!statMode){
    const yM = Y(oMed2);
    const seg = [];
    if (c.medDs != null) seg.push([fmt(c.medDs), " desarmes"]);
    if (c.medPs != null) seg.push([fmt(c.medPs, 0), " passes"]);
    if (c.medFs != null) seg.push([fmt(c.medFs), " faltas sofridas"]);
    if (c.medMin != null) seg.push([c.medMin + "'", " em campo"]);
    if (seg.length){
      x.font = `800 28px ${UI}`; const wV = seg.map(s => x.measureText(s[0]).width);
      x.font = `500 24px ${UI}`; const wL = seg.map(s => x.measureText(s[1]).width);
      const sep = "   ·   ", sepW = x.measureText(sep).width;
      const total = wV.reduce((a,b)=>a+b,0) + wL.reduce((a,b)=>a+b,0) + sepW * (seg.length - 1);
      let cur = cx - total / 2;
      x.textAlign = "left";
      seg.forEach((s, i) => {
        x.font = `800 28px ${UI}`; x.fillStyle = "#F5F5F7"; x.fillText(s[0], cur, yM); cur += wV[i];
        x.font = `500 24px ${UI}`; x.fillStyle = "#9A9AA5"; x.fillText(s[1], cur, yM); cur += wL[i];
        if (i < seg.length - 1){ x.font = `500 24px ${UI}`; x.fillStyle = "#6B6B76"; x.fillText(sep, cur, yM); cur += sepW; }
      });
      x.textAlign = "center";
    }
  }

  // caixinhas (estatística ativa, mais antigo → mais recente)
  x.font = `500 22px ${MONO}`; x.fillStyle = "#6B6B76";
  x.fillText(`${statMode ? c.statLabel : "finalizações"} jogo a jogo · esquerda = mais antigo`, cx, Y(oBoxLbl));
  {
    const seq = [...c.hist].reverse();
    const bs = 52, bg = 12, totalW = seq.length * bs + (seq.length - 1) * bg;
    let bx = cx - totalW / 2;
    seq.forEach((g, i) => {
      const v = selB(g);
      const last = i === seq.length - 1;
      x.fillStyle = v > 0 ? "rgba(254,44,85,0.16)" : "rgba(255,255,255,0.06)";
      x.beginPath(); x.roundRect(bx, Y(oBoxes) - bs/2, bs, bs, 10); x.fill();
      if (last){ x.strokeStyle = "#FE2C55"; x.lineWidth = 2.5;
        x.beginPath(); x.roundRect(bx, Y(oBoxes) - bs/2, bs, bs, 10); x.stroke(); }
      x.font = `800 26px ${MONO}`; x.fillStyle = v > 0 ? "#FE2C55" : "#6B6B76";
      x.fillText(String(v), bx + bs/2, Y(oBoxes) + 1);
      bx += bs + bg;
    });
  }

  // extrato: valor × adversário · data
  const dataBR = t => { const [y,m,d] = t.split("-"); return `${d}/${m}/${y.slice(2)}`; };
  c.hist.forEach((g, i) => {
    const y = Y(ex0 + i * exStep);
    const numTxt = String(selB(g)), meio = ` × ${g.a}`, fim = ` · ${dataBR(g.t)}`;
    x.font = `800 30px ${UI}`; const wN = x.measureText(numTxt).width;
    x.font = `500 26px ${UI}`; const wM = x.measureText(meio).width;
    x.font = `500 24px ${MONO}`; const wF = x.measureText(fim).width;
    let cur = cx - (wN + wM + wF) / 2;
    x.textAlign = "left";
    x.font = `800 30px ${UI}`; x.fillStyle = "#FE2C55"; x.fillText(numTxt, cur, y); cur += wN;
    x.font = `500 26px ${UI}`; x.fillStyle = "#9A9AA5"; x.fillText(meio, cur, y); cur += wM;
    x.font = `500 24px ${MONO}`; x.fillStyle = "#6B6B76"; x.fillText(fim, cur, y);
    x.textAlign = "center";
  });

  // rodapé
  const yRod = Y(oFooter);
  x.textAlign = "right"; x.font = `800 26px ${UI}`;
  const wEx = x.measureText("!").width;
  x.fillStyle = "#2AE8E0"; x.fillText("!", px+pw-40, yRod);
  x.fillStyle = "#FFFFFF"; x.fillText("APITOU", px+pw-40-wEx, yRod);
  x.textAlign = "left"; x.font = `500 22px ${MONO}`; x.fillStyle = "#9A9AA5";
  x.fillText(c.contexto, px+40, yRod);
  x.textAlign = "center";
}

    while (size > 26){
      x.font = `800 ${size}px ${UI}`;
      if (x.measureText(c.nome).width <= pw - 220) break;
      size -= 2;
    }
    const wN = x.measureText(c.nome).width, cr = 68, gap = 16;
    const x0 = cx - (cr + gap + wN) / 2;
    x.save();
    x.beginPath(); x.roundRect(x0, yT - cr/2, cr, cr, 16); x.clip();
    if (im) x.drawImage(im, x0, yT - cr/2, cr, cr);
    else { x.fillStyle = "#1F1F26"; x.fillRect(x0, yT - cr/2, cr, cr); }
    x.restore();
    x.fillStyle = "#F5F5F7"; x.textAlign = "left";
    x.fillText(c.nome, x0 + cr + gap, yT);
    x.textAlign = "center";
  }
  x.font = `700 26px ${MONO}`; x.fillStyle = cor;
  x.fillText(c.rotulo || (c.emCasa ? "SÓ JOGOS EM CASA" : "SÓ JOGOS FORA DE CASA"), cx, Y(oSub));
  x.font = `500 22px ${MONO}`; x.fillStyle = "#9A9AA5";
  x.fillText(c.contexto, cx, Y(oCtx));

  // número gigante + rótulo
  x.font = `800 150px ${UI}`; x.fillStyle = cor;
  x.fillText(fmt(c.valor, c.dec) + c.sufixo, cx, Y(oNum));
  x.font = `700 24px ${MONO}`; x.fillStyle = "#9A9AA5";
  x.fillText(`${c.label.toUpperCase()} / JOGO`, cx, Y(oLbl));

  // extrato: valor × adversário
  c.extrato.slice(0, 15).forEach((e, i) => {
    const y = Y(ex0 + i * exStep);
    const vTxt = fmt(e.v, Number.isInteger(e.v) ? 0 : c.dec) + c.sufixo;
    let adv = ` × ${e.adv}`;
    x.font = `500 25px ${UI}`;
    while (x.measureText(adv).width > 560 && adv.length > 8) adv = adv.slice(0, -1);
    x.font = `800 27px ${UI}`; const wV = x.measureText(vTxt).width;
    x.font = `500 25px ${UI}`; const wA = x.measureText(adv).width;
    let cur = cx - (wV + wA) / 2;
    x.textAlign = "left";
    x.font = `800 27px ${UI}`; x.fillStyle = cor; x.fillText(vTxt, cur, y); cur += wV;
    x.font = `500 25px ${UI}`; x.fillStyle = "#F5F5F7"; x.fillText(adv, cur, y);
    x.textAlign = "center";
  });

  // rodapé
  const yRod = Y(oFooter);
  x.textAlign = "right"; x.font = `800 26px ${UI}`;
  const wEx = x.measureText("!").width;
  x.fillStyle = "#2AE8E0"; x.fillText("!", px+pw-40, yRod);
  x.fillStyle = "#FFFFFF"; x.fillText("APITOU", px+pw-40-wEx, yRod);
  x.textAlign = "left"; x.font = `500 22px ${MONO}`; x.fillStyle = "#9A9AA5";
  x.fillText("os números falam · mando de campo", px+40, yRod);
  x.textAlign = "center";
}

async function desenharArbitro(){
  const c = state.card;
  const UI = "'TikTok Sans', -apple-system, 'Segoe UI', Roboto, sans-serif";
  const MONO = "'TikTok Sans', -apple-system, 'Segoe UI', Roboto, sans-serif";
  const W = 1080, cx = W / 2;
  const n = c.jogos.length;
  const temSplit = c.amarelosCasa != null && c.amarelosFora != null;

  const oHeader = 96, oSub = 200, oCtx = 242, oNum = 372, oLbl = 448;
  const oSplitLbl = temSplit ? 520 : 0, oSplit = temSplit ? 566 : 0;
  const ex0 = (temSplit ? 650 : 530), exStep = 46;
  const oFooter = ex0 + n * exStep + (n ? 14 : -20), panelH = oFooter + 42;

  const sticker = c.formato === "sticker";
  const H = sticker ? panelH + 48 : (c.formato === "story" ? 1920 : 1350);
  const cv = document.getElementById("cardCanvas");
  if (!cv) return;
  cv.width = W; cv.height = H;
  const x = cv.getContext("2d");
  x.clearRect(0, 0, W, H);

  if (!sticker){
    const g = x.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#0D0D10"); g.addColorStop(0.5, "#08080A"); g.addColorStop(1, "#060608");
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    const glow = x.createRadialGradient(W/2, H*0.3, 60, W/2, H*0.3, W*0.8);
    glow.addColorStop(0, "rgba(254,44,85,0.12)"); glow.addColorStop(1, "rgba(254,44,85,0)");
    x.fillStyle = glow; x.fillRect(0, 0, W, H);
  }

  const px = 24, pw = W - 48;
  const py = sticker ? 24 : Math.max(24, Math.round((H - panelH) / 2));
  x.fillStyle = "rgba(7,7,9,0.92)";
  x.beginPath(); x.roundRect(px, py, pw, panelH, 44); x.fill();
  x.strokeStyle = "rgba(254,44,85,0.45)"; x.lineWidth = 3;
  x.beginPath(); x.roundRect(px, py, pw, panelH, 44); x.stroke();
  const Y = o => py + o;
  x.textAlign = "center"; x.textBaseline = "middle";

  // header: nome centralizado com fonte que encolhe até caber
  // (emoji fora da medição — o canvas mede errado sequências como 👨‍⚖️)
  {
    const yT = Y(oHeader);
    let size = 44;
    while (size > 26){
      x.font = `800 ${size}px ${UI}`;
      if (x.measureText(c.nome).width <= pw - 90) break;
      size -= 2;
    }
    let nome = c.nome;
    while (x.measureText(nome).width > pw - 90 && nome.length > 6) nome = nome.slice(0, -1);
    x.fillStyle = "#F5F5F7";
    x.fillText(nome === c.nome ? nome : nome + "…", cx, yT);
  }
  x.font = `700 26px ${MONO}`; x.fillStyle = "#FE2C55";
  tituloIco(x, "PERFIL DO ÁRBITRO", cx, Y(oSub), 30, 12,
            x0 => icoCartaoDuplo(x, x0, Y(oSub), 28));
  x.font = `500 22px ${MONO}`; x.fillStyle = "#9A9AA5";
  x.fillText(c.contexto, cx, Y(oCtx));

  // números grandes: amarelos (âmbar) | faltas (verde)
  const off = 250;
  x.font = `800 116px ${UI}`;
  x.fillStyle = "#F5C542"; x.fillText(fmt(c.amarelos), cx - off, Y(oNum));
  x.fillStyle = "#2AE8E0"; x.fillText(fmt(c.faltas), cx + off, Y(oNum));
  x.font = `700 22px ${MONO}`; x.fillStyle = "#9A9AA5";
  tituloIco(x, "AMARELOS / JOGO", cx - off, Y(oLbl), 18, 10,
            x0 => icoCartao(x, x0, Y(oLbl), 24, "#F5C542"));
  tituloIco(x, "FALTAS / JOGO", cx + off, Y(oLbl), 30, 10,
            x0 => icoApito(x, x0, Y(oLbl), 26, "#9A9AA5"));

  // split casa × fora
  if (temSplit){
    x.font = `500 22px ${MONO}`; x.fillStyle = "#6B6B76";
    x.fillText("amarelos: mandante × visitante", cx, Y(oSplitLbl));
    const bw = 300, bh = 16, max = Math.max(c.amarelosCasa, c.amarelosFora, 0.001);
    x.fillStyle = "rgba(255,255,255,0.10)";
    x.beginPath(); x.roundRect(cx - 40 - bw, Y(oSplit) - bh/2, bw, bh, 8); x.fill();
    x.beginPath(); x.roundRect(cx + 40, Y(oSplit) - bh/2, bw, bh, 8); x.fill();
    x.fillStyle = "#2AE8E0";
    const wC = bw * (c.amarelosCasa / max);
    x.beginPath(); x.roundRect(cx - 40 - wC, Y(oSplit) - bh/2, wC, bh, 8); x.fill();
    x.fillStyle = "#FE2C55";
    x.beginPath(); x.roundRect(cx + 40, Y(oSplit) - bh/2, bw * (c.amarelosFora / max), bh, 8); x.fill();
    x.font = `800 28px ${MONO}`;
    x.fillStyle = "#2AE8E0"; x.textAlign = "right"; x.fillText(fmt(c.amarelosCasa), cx - 52 - bw, Y(oSplit));
    x.fillStyle = "#FE2C55"; x.textAlign = "left"; x.fillText(fmt(c.amarelosFora), cx + 52 + bw, Y(oSplit));
    x.textAlign = "center";
  }

  // extrato: N + cartão desenhado · jogo · data
  const dataBR = ts => { const [y,m,d] = ts.split("-"); return `${d}/${m}`; };
  const chIco = 24, gIco = 5, cw = chIco * 0.72 + 4;
  c.jogos.forEach((g, i) => {
    const y = Y(ex0 + i * exStep);
    let jogo = g.jogo;
    x.font = `500 25px ${UI}`;
    while (x.measureText(jogo).width > 560 && jogo.length > 10) jogo = jogo.slice(0, -1);
    const meio = `  ${jogo === g.jogo ? jogo : jogo + "…"}`;
    const fim = `  · ${dataBR(g.ts)} · ${g.faltas} faltas`;
    x.font = `800 27px ${UI}`;
    const wAm = x.measureText(String(g.am)).width;
    const wVm = g.vm ? x.measureText(String(g.vm)).width : 0;
    const wN = wAm + gIco + cw + (g.vm ? 12 + wVm + gIco + cw : 0);
    x.font = `500 25px ${UI}`; const wM = x.measureText(meio).width;
    x.font = `500 21px ${MONO}`; const wF = x.measureText(fim).width;
    let cur = cx - (wN + wM + wF) / 2;
    x.textAlign = "left";
    x.font = `800 27px ${UI}`; x.fillStyle = "#FE2C55";
    x.fillText(String(g.am), cur, y); cur += wAm + gIco;
    icoCartao(x, cur, y, chIco, "#F5C542", -0.10); cur += cw;
    if (g.vm){
      cur += 12;
      x.fillStyle = "#E4574D"; x.fillText(String(g.vm), cur, y); cur += wVm + gIco;
      icoCartao(x, cur, y, chIco, "#E4574D", -0.10); cur += cw;
    }
    x.font = `500 25px ${UI}`; x.fillStyle = "#F5F5F7"; x.fillText(meio, cur, y); cur += wM;
    x.font = `500 21px ${MONO}`; x.fillStyle = "#6B6B76"; x.fillText(fim, cur, y);
    x.textAlign = "center";
  });

  // rodapé
  const yRod = Y(oFooter);
  x.textAlign = "right"; x.font = `800 26px ${UI}`;
  const wEx = x.measureText("!").width;
  x.fillStyle = "#2AE8E0"; x.fillText("!", px+pw-40, yRod);
  x.fillStyle = "#FFFFFF"; x.fillText("APITOU", px+pw-40-wEx, yRod);
  x.textAlign = "left"; x.font = `500 22px ${MONO}`; x.fillStyle = "#9A9AA5";
  x.fillText("os números falam · mercado de cartões", px+40, yRod);
  x.textAlign = "center";
}

function baixarCard(){
  const cv = document.getElementById("cardCanvas");
  const c = state.card;
  const nome = ((c.tipo === "jogador" || c.tipo === "arbitro" || c.tipo === "timeSolo")
    ? `apitou-${c.nome}-${c.label}`
    : `apitou-${c.fx.home}-x-${c.fx.away}-${c.label}`).toLowerCase().replace(/[^a-z0-9]+/g, "-");
  cv.toBlob(blob => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `${nome}.png`;
    a.click();
    URL.revokeObjectURL(a.href);
  }, "image/png");
}

/* ---------- JOGADOR — perfil de estatística (conceito simplificado) ---------- */
function abrirJogador(fi, side, idx){
  state.j2 = { fi, side, idx };
  state.jgJanela = 10; state.jgEscopo = "geral"; state.jgStat = "f"; // padrão: últimos 10, todos os jogos, finalizações
  go('jogador');
}
function setJgJanela(n){ state.jgJanela = n; render(); }
function setJgEscopo(e){ state.jgEscopo = e; render(); }
function setJgStat(k){ state.jgStat = k; render(); }
function renderJogadorSimples(){
  const { fi, side, idx } = state.j2 || {};
  const fx = FIXTURES[fi];
  if (!fx) { go('oportunidades'); return; }
  const tid = side === "home" ? fx.homeId : fx.awayId;
  const tname = side === "home" ? fx.home : fx.away;
  const adv = side === "home" ? fx.away : fx.home;
  const j = (ELENCOS[String(tid)] || [])[idx];
  if (!j) { go('jogo', null, null, null, fi); return; }

  // projeção discreta: média × defesa do adversário × mando (sem linguagem de aposta)
  const ref = fx.players.find(p => p.isHome === (side === "home"));
  const multAdv = ref ? ref.multAdversario : 1;
  const lambda = j.media * multAdv * (side === "home" ? 1.12 : 0.93);
  const goleiro = (j.pos === "Goleiro");

  const tile = (k, v, cls="") => `<div class="tile ${cls}"><div class="k">${k}</div><div class="big tnum" style="font-size:32px">${v}</div></div>`;

  // ----- histórico jogo a jogo sob o filtro ativo -----
  const janela = state.jgJanela || 10, escopo = state.jgEscopo || "geral";
  const hist = goleiro ? [] : getHistJogador(tid, j.name, janela, escopo, fx.ligaId);
  const ehContinental = ehContinentalLiga(fx.ligaId);
  const labelComp = ehContinental ? "Só continentais" : `Só ${fx.competicao}`;
  const chipJg = n => `<button class="chip ${janela===n?'on':''}" onclick="setJgJanela(${n})">Últimos ${n}</button>`;
  const chipEs = (e, label) => `<button class="chip ${escopo===e?'on':''}" onclick="setJgEscopo('${e}')">${label}</button>`;
  const filtros = goleiro ? "" : `
    <div class="jogo-filtros" style="margin-top:18px">
      <div class="qlabel">Quantos jogos contar?</div>
      <div class="filters">${chipJg(5)}${chipJg(10)}</div>
      <div class="qlabel">Quais jogos?</div>
      <div class="filters">${chipEs("comp", labelComp)}${chipEs("geral", "Todos os jogos")}</div>
    </div>`;

  let corpo = "";
  if (hist.length){
    const med = sel => hist.reduce((a, g) => a + sel(g), 0) / hist.length;
    const dataBR = t => { const [y,m,d] = t.split("-"); return `${d}/${m}/${y.slice(2)}`; };

    // caixinhas estilo bet365 (mais antigo → mais recente; último em destaque; hover = adversário)
    const boxes = sel => [...hist].reverse().map((g, i, arr) =>
      `<span class="bx ${i === arr.length-1 ? "last" : ""} ${sel(g) > 0 ? "hit" : ""}" data-tip="× ${g.a} · ${dataBR(g.t)}">${sel(g)}</span>`).join("");

    // tendências no formato do apostador (linha X+ · acertos/N) — 70%+ em verde
    const ladder = (sel, linhas, label) => linhas.map(L => {
      const hit = hist.filter(g => sel(g) >= L).length;
      const pct = Math.round(hit / hist.length * 100);
      return `<div class="tend-row ${pct >= 70 ? "hot" : ""}">
        <span class="tend-ico">${label.icon}</span>
        <span class="tend-txt">${L}+ ${label.txt}</span>
        <span class="tend-bar"><span style="width:${pct}%"></span></span>
        <span class="tend-hit">${hit} de ${hist.length}</span>
      </div>`;
    }).join("");
    const tendencias =
      ladder(g => g.f, [1, 2, 3], { icon: svgIco("alvo"), txt: "finalizações" }) +
      ladder(g => g.o, [1, 2], { icon: svgIco("bola"), txt: "chutes a gol" }) +
      ladder(g => g.fs, [2], { icon: svgIco("impacto"), txt: "faltas sofridas" }) +
      (hist.some(g => g.ds != null) ? ladder(g => g.ds ?? 0, [1, 2, 3], { icon: svgIco("escudo"), txt: "desarmes" }) : "") +
      (hist.some(g => g.ps != null) ? ladder(g => g.ps ?? 0, [20, 30, 40], { icon: svgIco("passe"), txt: "passes" }) : "") +
      ladder(g => g.m, [60], { icon: svgIco("relogio"), txt: "minutos em campo" });

    const extrato = hist.map(g => `
      <div class="jg-game">
        <span class="jg-date">${dataBR(g.t)}</span>
        <span class="jg-adv">× ${g.a}</span>
        <span class="jg-min tnum">${g.m}'</span>
        <span class="jg-vals"><b class="amber tnum">${g.f}</b> fin · <b class="acc tnum">${g.o}</b> a gol${g.ds != null ? ` · <b class="tnum">${g.ds}</b> des` : ""}${g.ps != null ? ` · <b class="tnum">${g.ps}</b> passes` : ""}${g.g ? ` · <b class="tnum">${g.g}</b> gol${g.g>1?"s":""} ${svgIco("bola")}` : ""}</span>
      </div>`).join("");

    // ---- estilo PropsCash: abas de estatística + gráfico de barras jogo a jogo ----
    const PJ_ROWS = [["f","Finalizações",1],["o","Chutes a gol",1],["g","Gols",1],
                     ["fs","Faltas sofridas",1],["fc","Faltas cometidas",1],
                     ["ds","Desarmes",1],["ps","Passes",0],["am","Cartões",2],["m","Minutos",0]];
    const statSel = state.jgStat && PJ_ROWS.some(r => r[0] === state.jgStat) ? state.jgStat : "f";
    const metaSel = PJ_ROWS.find(r => r[0] === statSel);
    // mesmo padrão de abas do raio-x do jogo (faixa FlashScore) — pedido do Pedro 07/08
    const tabsStat = `<div class="jogo-tabs" style="margin-top:18px">${PJ_ROWS
      .filter(([k]) => hist.some(g => g[k] != null))
      .map(([k, lbl]) => `<button class="jogo-tab ${statSel===k?'on':''}" onclick="setJgStat('${k}')">${lbl}</button>`).join("")}</div>`;
    const vsChart = [...hist].reverse();  // esquerda = mais antigo
    const valsC = vsChart.map(g => g[statSel]).filter(v => v != null);
    const maxC = Math.max(...valsC, 0.001);
    const mediaC = valsC.length ? valsC.reduce((a,b)=>a+b,0)/valsC.length : 0;
    const chartH = 150, rodapeH = 36;
    const grafico = `
      <div style="position:relative; margin-top:14px">
        <div style="position:absolute; left:0; right:0; bottom:${rodapeH + mediaC/maxC*chartH}px; border-top:1.5px dashed rgba(255,255,255,0.4); z-index:2; pointer-events:none"></div>
        <div class="tnum" style="position:absolute; right:2px; bottom:${rodapeH + mediaC/maxC*chartH + 4}px; font-size:10.5px; color:var(--txt3); z-index:2; pointer-events:none">média ${metaSel[2] ? fmt(mediaC) : Math.round(mediaC)}</div>
        <div style="display:flex; align-items:flex-end; gap:6px; height:${chartH + rodapeH + 22}px">
          ${vsChart.map(g => {
            const v = g[statSel];
            const zero = !v;
            const h = v == null ? 4 : Math.max(6, v/maxC*chartH);
            return `<div style="flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%">
              <div class="tnum" style="font-size:12px; font-weight:800; color:${zero ? "var(--txt3)" : "var(--acc)"}; margin-bottom:3px">${v == null ? "–" : v}</div>
              <div style="width:100%; max-width:46px; height:${h}px; border-radius:5px 5px 0 0; background:${zero ? "rgba(255,255,255,0.10)" : "var(--acc)"}"></div>
              <div style="height:${rodapeH}px; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; padding-top:5px; width:100%">
                <span style="font-size:9.5px; color:var(--txt3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%">${g.a}</span>
                <span class="tnum" style="font-size:9.5px; color:var(--txt3)">${g.t.slice(5).split("-").reverse().join("/")}</span>
              </div>
            </div>`;
          }).join("")}
        </div>
      </div>`;

    corpo = `
      <div class="tiles" style="margin-top:16px">
        ${tile("Finalizações / jogo", fmt(med(g=>g.f)), "hero-a")}
        ${tile("Chutes a gol / jogo", fmt(med(g=>g.o)), "hero-b")}
        ${tile("Minutos / jogo", Math.round(med(g=>g.m)))}
        ${tile("Gols no período", hist.reduce((a,g)=>a+g.g,0))}
      </div>
      <div class="rx-sample" style="margin-top:10px">amostra: ${hist.length} jogo${hist.length===1?"":"s"}${escopo==="comp" ? (ehContinental ? " em copas continentais" : ` (só ${fx.competicao})`) : ""} · caixinhas: da esquerda (mais antigo) pra direita (mais recente)</div>
      ${tabsStat}
      ${grafico}
      <div style="display:flex; gap:10px; margin-top:12px; flex-wrap:wrap">
        <button class="h2h-cardbtn" style="flex:1; min-width:180px; margin:0" onclick="abrirCardGraficoJogador('${statSel}')">
          ${svgIco("grafico")} Gerar card · gráfico
        </button>
        <button class="h2h-cardbtn" style="flex:1; min-width:180px; margin:0" onclick="abrirCardJogador('${statSel}')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4M8 11l4 4 4-4M12 15V3"/></svg>
          Gerar card · números
        </button>
      </div>
      <div class="tend-box" style="margin-top:14px">${tendencias}</div>
      <div class="section-h" style="margin-top:8px"><span class="lbl">Jogo a jogo</span><span class="count tnum">${hist.length} jogos</span></div>
      <div class="jg-list">${extrato}</div>`;
  } else {
    // sem jogo a jogo (goleiro, reserva sem minutos, ou filtro estreito): médias da temporada
    corpo = `
      <div class="tiles" style="margin-top:16px">
        ${goleiro
          ? tile("Defesas / jogo", fmt(j.defesas ?? 0), "hero-b") + tile("Jogos na temporada", j.apps)
          : tile("Finalizações / jogo", fmt(j.media), "hero-a") + tile("Chutes a gol / jogo", j.mediaOn != null ? fmt(j.mediaOn) : "—", "hero-b")}
        ${tile("Faltas cometidas / jogo", j.faltasCom != null ? fmt(j.faltasCom) : "—")}
        ${tile("Faltas sofridas / jogo", j.faltasSof != null ? fmt(j.faltasSof) : "—")}
      </div>
      ${goleiro ? "" : `<div class="empty-box" style="margin-top:14px">Sem jogo a jogo disponível ${escopo==="comp" ? 'neste filtro — em "Quais jogos?", troque pra "Todos os jogos"' : "pra este jogador (pode não ter entrado em campo nos jogos recentes)"} · médias da temporada acima.</div>`}`;

/* Card do jogador (forma recente estilo props) — statKey escolhe a estatística do card */
const PJ_CARD_META = { f: ["finalizações", 1], o: ["chutes a gol", 1], g: ["gols", 1],
                       fs: ["faltas sofridas", 1], fc: ["faltas cometidas", 1],
                       ds: ["desarmes", 1], ps: ["passes", 0], am: ["cartões amarelos", 2], m: ["minutos em campo", 0] };
function abrirCardJogador(statKey){
  const { fi, side, idx } = state.j2 || {};
  const fx = FIXTURES[fi]; if (!fx) return;
  const tid = side === "home" ? fx.homeId : fx.awayId;
  const tname = side === "home" ? fx.home : fx.away;
  const j = (ELENCOS[String(tid)] || [])[idx]; if (!j) return;
  const janela = state.jgJanela || 10, escopo = state.jgEscopo || "geral";
  const hist = getHistJogador(tid, j.name, janela, escopo, fx.ligaId);
  if (!hist.length) return;
  const ehContinental = ehContinentalLiga(fx.ligaId);
  const escLabel = escopo === "comp" ? (ehContinental ? "copas continentais" : fx.competicao) : "todas as competições";
  const med2 = sel => { const v = hist.map(sel).filter(x => x != null); return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null; };
  if (!PJ_CARD_META[statKey]) statKey = null;
  state.card = { tipo: "jogador", formato: "sticker", label: statKey ? PJ_CARD_META[statKey][0] : "forma",
    nome: j.name, time: tname, pos: j.pos || "",
    fx, contexto: `últimos ${hist.length} jogos · ${escLabel}`,
    medF: hist.reduce((a,g)=>a+g.f,0)/hist.length, medO: hist.reduce((a,g)=>a+g.o,0)/hist.length,
    medDs: med2(g => g.ds), medPs: med2(g => g.ps),
    medFs: med2(g => g.fs), medMin: (m => m != null ? Math.round(m) : null)(med2(g => g.m)),
    statKey, statLabel: statKey ? PJ_CARD_META[statKey][0] : null,
    statDec: statKey ? PJ_CARD_META[statKey][1] : 1,
    statMed: statKey ? med2(g => g[statKey]) : null,
    hist };
  montarCardModal();
}

/* ---------- MÚLTIPLAS — montagem de aposta combinada + link de afiliado ---------- */
function todasAsPernas(){
  // Múltiplas só trabalham com jogadores que já têm linha aberta (odds).
  const pernas = [];
  FIXTURES.forEach((fx, fi) => {
    fx.players.forEach((p, pi) => {
      const analise = analisarJogador(p, fx.sedeNeutra);
      if (analise.destaque) pernas.push({ fi, pi, fx, p, ...analise });
    });
  });
  return pernas;
}
function defaultLegs(){
  // Sugestão automática: melhor Valor de cada jogo com odds, evitando correlação por padrão.
  const pernas = todasAsPernas();
  const fis = [...new Set(pernas.map(l => l.fi))];
  return fis.map(fi => {
    const doJogo = pernas.filter(l => l.fi === fi).sort((a,b) => b.destaque.valor - a.destaque.valor);
    return { fi, pi: doJogo[0].pi };
  });
}
function toggleLeg(fi, pi){
  if (!state.multiplaLegs) state.multiplaLegs = defaultLegs();
  const idx = state.multiplaLegs.findIndex(l => l.fi===fi && l.pi===pi);
  if (idx >= 0) state.multiplaLegs.splice(idx, 1);
  else state.multiplaLegs.push({ fi, pi });
  render();
}
function setOddAlvo(v){
  state.oddAlvo = v;
  render();
}
function usarMultipla(){
  state.multiplaUsada = true;
  render();
}
function renderMultiplas(){
  if (!state.multiplaLegs) state.multiplaLegs = defaultLegs();
  const pernas = todasAsPernas();
  const selecionadas = state.multiplaLegs
    .map(l => pernas.find(p => p.fi===l.fi && p.pi===l.pi))
    .filter(Boolean);

  const oddCombinada = selecionadas.reduce((acc, l) => acc * l.destaque.price, 1);
  const valorMedio = selecionadas.length ? selecionadas.reduce((a,l)=>a+l.destaque.valor,0)/selecionadas.length : 0;
  const confMinima = selecionadas.length ? Math.min(...selecionadas.map(l=>l.destaque.confianca)) : 0;

  const fixturesComDuplicidade = {};
  selecionadas.forEach(l => { fixturesComDuplicidade[l.fi] = (fixturesComDuplicidade[l.fi]||0) + 1; });
  const temCorrelacao = Object.values(fixturesComDuplicidade).some(n => n > 1);

  const oddAlvo = state.oddAlvo;
  let targetNote = "";
  if (oddAlvo && oddAlvo > 0){
    if (oddCombinada >= oddAlvo) targetNote = `<span class="target-note">Sua múltipla já paga <b>${fmt(oddCombinada,2)}</b> — bateu a odd alvo de ${fmt(oddAlvo,2)}.</span>`;
    else targetNote = `<span class="target-note">Faltam <b>${fmt(oddAlvo/oddCombinada,2)}x</b> pra chegar na odd alvo de ${fmt(oddAlvo,2)} — adicione outra seleção.</span>`;
  }

  const grupos = FIXTURES.map((fx, fi) => {
    const linhas = fx.players.map((p, pi) => {
      const l = pernas.find(x => x.fi===fi && x.pi===pi);
      if (!l) return "";  // jogador ainda sem linha aberta não entra em múltipla
      const sel = state.multiplaLegs.some(x => x.fi===fi && x.pi===pi);
      return `
        <div class="leg-row ${sel?'selected':''}" onclick="toggleLeg(${fi},${pi})">
          <div class="leg-check">${sel ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>' : ''}</div>
          <div class="avatar" style="width:34px;height:34px;border-radius:9px;font-size:12px;${avatarStyle(p.name.length*7)}">${fotoOuIniciais(p.name)}</div>
          <div class="leg-info">
            <div class="nm">${p.name}</div>
            <div class="mk">${linhaMais(l.destaque.line)} finalizações <span class="book-tag">${p.bookmaker} · ${fmt(l.destaque.price,2)}</span></div>
          </div>
          <div class="leg-scores">
            <span class="mini" style="color:${l.destaque.qi>=70?'var(--acc)':l.destaque.qi>=45?'var(--amber)':'var(--text-dim)'}">QI ${Math.round(l.destaque.qi)}</span>
            <span class="mini" style="color:${l.destaque.valor>=70?'var(--acc)':l.destaque.valor>=45?'var(--amber)':'var(--text-dim)'}">V ${Math.round(l.destaque.valor)}</span>
          </div>
        </div>`;
    }).join("");
    if (!linhas) return "";  // jogo inteiro sem odds ainda: fora da tela de múltiplas
    return `<div class="fixture-group">
      <div class="fixture-group-h">${fx.home} x ${fx.away} · ${fx.competicao}</div>
      ${linhas}
    </div>`;
  }).join("");

  el.innerHTML = `
    <p class="eyebrow">Múltiplas · sugestão automática</p>
    <h1 class="page">Monte sua combinada</h1>
    <p class="sub">O Motor QI já sugeriu a melhor seleção de cada jogo. Marque ou desmarque jogadores pra ajustar.</p>

    <div class="target-row">
      <label>Odd alvo (opcional)</label>
      <input class="target-input tnum" type="number" step="0.1" min="1" placeholder="ex: 5.0" value="${oddAlvo||''}" oninput="setOddAlvo(parseFloat(this.value)||null)">
      ${targetNote}
    </div>

    ${temCorrelacao ? `<div class="corr-warning">${svgIco("alerta")} Duas seleções do mesmo jogo — os resultados são correlacionados, o risco real é maior do que a odd multiplicada sugere.</div>` : ""}

    ${grupos}

    <div class="mult-summary">
      <div class="mult-summary-top">
        <div class="mult-odd">
          <div class="k">Odd estimada da múltipla</div>
          <div class="v tnum">${selecionadas.length ? fmt(oddCombinada,2) : "—"}</div>
        </div>
        <div class="mult-scores">
          <div class="score-pill ${scoreClass(valorMedio)}"><div class="n tnum">${Math.round(valorMedio)}</div><div class="l">Valor médio</div></div>
          <div class="score-pill ${scoreClass(confMinima)}"><div class="n tnum">${Math.round(confMinima)}</div><div class="l">Confiança mín.</div></div>
        </div>
        <button class="use-btn" ${selecionadas.length===0?'disabled':''} onclick="usarMultipla()">Usar essa múltipla</button>
      </div>
      ${state.multiplaUsada ? `<div class="use-confirm"><span class="live"></span> Protótipo — em produção isso abriria a aposta direto na casa parceira, via link de afiliado rastreado.</div>` : ""}
    </div>
    ${sourceNoteQI()}
  `;
}

/* Confronto direto: retrospecto + lista, orientados ao jogo atual (mandante à esquerda).
   Respeita o escopo: "comp" filtra os confrontos que foram na mesma competição. */
function confrontosDoJogo(fx, escopo){
  let lista = H2H[String(fx.id)] || [];
  if (escopo === "comp"){
    const ehContinental = ehContinentalLiga(fx.ligaId);
    const alvos = ehContinental
      ? ligasIrmas(fx.ligaId).map(l => ligaInfo(l).nome || (l === 11 ? "Sul-Americana" : "Libertadores"))
      : [fx.competicao];
    lista = lista.filter(c => alvos.includes(c.comp));
  }
  // teto de 10 confrontos na tela: percentual legível ("7 de 10") — a base guarda mais
  return lista.slice(0, 10);
}
function computaH2H(fx, escopo){
  const lista = confrontosDoJogo(fx, escopo);
  const jogos = lista.map(c => {
    const mandoA = c.idH === fx.homeId;          // o mandante atual (A = fx.home) foi o anfitrião?
    const golsA = mandoA ? c.gH : c.gA;          // gols do time A neste confronto
    const golsB = mandoA ? c.gA : c.gH;          // gols do time B
    const res = golsA > golsB ? "v" : golsA < golsB ? "d" : "e";
    return {
      ts: c.ts, comp: c.comp, mandoA, res, golsA, golsB,
      hostNome: mandoA ? fx.home : fx.away, visNome: mandoA ? fx.away : fx.home,
      hostGols: c.gH, visGols: c.gA, hostEhA: mandoA,
      totGols: c.gH + c.gA, ambas: c.gH > 0 && c.gA > 0, ca: c.ca, ct: c.ct, df: c.df,
      statsA: (mandoA ? c.sH : c.sA) || {},   // estatística do time A (fx.home) neste confronto
      statsB: (mandoA ? c.sA : c.sH) || {},
    };
  });
  return { jogos, n: jogos.length };
}
/* linhas de mercado do resumo de confronto (fácil de ajustar) */
const H2H_LINHAS = { gols: 2.5, cartoes: 3.5, escanteios: 8.5, defesas: 5.5 };
function setH2hSub(s){ state.h2hSub = s; render(); }
/* Dados de uma visão do confronto direto (sub-aba + escopo) — usado na tela e no card */
function h2hView(fx, escopo, sub){
  const { jogos: todos } = computaH2H(fx, escopo);
  const jogos = sub === "casaA" ? todos.filter(j => j.mandoA)
              : sub === "casaB" ? todos.filter(j => !j.mandoA)
              : todos;
  let vA = 0, e = 0, vB = 0, gA = 0, gB = 0;
  jogos.forEach(j => { gA += j.golsA; gB += j.golsB; if (j.res === "v") vA++; else if (j.res === "d") vB++; else e++; });
  // tendência de linha (mais/menos de X) — direção dominante
  const mk = (getter, linha, label, icon) => {
    const vals = jogos.map(getter).filter(x => x != null);
    if (!vals.length) return null;
    const over = vals.filter(x => x > linha).length, under = vals.length - over;
    const mais = over >= under, hit = mais ? over : under;
    return { icon, txt: `${mais?"Mais":"Menos"} de ${String(linha).replace(".",",")} ${label}`, hit, n: vals.length, pct: Math.round(hit / vals.length * 100) };
  };
  // tendência sim/não (ex.: ambas marcam) — direção dominante
  const mkBool = (pred, txtSim, txtNao, icon) => {
    const vals = jogos.filter(j => pred(j) != null);
    if (!vals.length) return null;
    const sim = vals.filter(pred).length, nao = vals.length - sim;
    const ehSim = sim >= nao, hit = ehSim ? sim : nao;
    return { icon, txt: ehSim ? txtSim : txtNao, hit, n: vals.length, pct: Math.round(hit / vals.length * 100) };
  };
  const tend = [
    mk(j => j.totGols, H2H_LINHAS.gols, "gols", svgIco("bola")),
    mkBool(j => j.ambas, "Ambas marcam", "Ambas NÃO marcam", svgIco("aperto")),
    mk(j => j.ct, H2H_LINHAS.cartoes, "cartões", svgIco("cartaoAm")),
    mk(j => j.ca, H2H_LINHAS.escanteios, "escanteios", svgIco("bandeirinha")),
    mk(j => j.df, H2H_LINHAS.defesas, "defesas de goleiro", svgIco("luva")),
  ].filter(Boolean);
  const ehContinental = ehContinentalLiga(fx.ligaId);
  const escLabel = escopo === "comp" ? (ehContinental ? "copas continentais" : fx.competicao) : "todas as competições";
  const subLabel = sub === "casaA" ? "Casa do " + fx.home : sub === "casaB" ? "Casa do " + fx.away : `últimos ${jogos.length}`;
  return { jogos, vA, e, vB, gA, gB, tend, contexto: `${subLabel} · ${escLabel}` };
}
/* Miolo do confronto direto (sem wrapper: entra no rx-card compartilhado com o raio-x) */
function h2hCorpo(fx, escopo, fi){

  const linhaH = (key, label, a, b, dec=1, sufixo="") => {

      <div class="rx-side away"><div class="rx-bar"><div class="rx-fill away" style="width:${b/max*100}%"></div></div><span class="rx-val tnum">${fmt(b,dec)}${sufixo}</span></div>

  const linhasMedias =
