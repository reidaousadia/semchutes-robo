    linhaH("defesas", "Defesas de goleiro", med(j=>j.statsA.defesas ?? null), med(j=>j.statsB.defesas ?? null)) +
    linhaH("faltas", "Faltas cometidas", med(j=>j.statsA.faltas ?? null), med(j=>j.statsB.faltas ?? null)) +
    linhaH("amarelos", "Cartões amarelos", med(j=>j.statsA.amarelos ?? null), med(j=>j.statsB.amarelos ?? null)) +
    linhaH("vermelhos", "Cartões vermelhos", med(j=>j.statsA.vermelhos ?? null), med(j=>j.statsB.vermelhos ?? null), 2) +
    linhaH("posse", "Posse de bola", med(j=>j.statsA.posse ?? null), med(j=>j.statsB.posse ?? null), 0, "%") +
    linhaH("laterais", "Arremessos laterais", med(j=>j.statsA.laterais ?? null), med(j=>j.statsB.laterais ?? null)) +
    linhaH("tiroMeta", "Tiros de meta", med(j=>j.statsA.tiroMeta ?? null), med(j=>j.statsB.tiroMeta ?? null));
  const mediasBloco = linhasMedias.trim()
    ? `<div class="rx-group" style="margin-bottom:16px"><div class="rx-group-t">Médias por jogo · só nestes confrontos</div>${linhasMedias}</div>`
    : "";

  const tendHTML = v.tend.map(t => `<div class="tend-row">
      <span class="tend-ico">${t.icon}</span>
      <span class="tend-txt">${t.txt}</span>
      <span class="tend-bar"><span style="width:${t.pct}%"></span></span>
      <span class="tend-hit">${t.hit} de ${t.n}</span>
    </div>`).join("");
  const tendBloco = tendHTML ? `<div class="tend-box">${tendHTML}</div>` : "";

  const dataBR = ts => { const [y,m,d] = ts.split("-"); return `${d}/${m}/${y.slice(2)}`; };
  const crest = nome => `<span class="h2h-crest">${escudoOuIniciais(nome)}</span>`;
  const rows = jogos.map(j => {
    const hostWin = j.hostGols > j.visGols, visWin = j.visGols > j.hostGols;
    const hostCor = j.hostEhA ? "a" : "b", visCor = j.hostEhA ? "b" : "a";
    return `<div class="h2h-game">
      <div class="h2h-when">${dataBR(j.ts)} · ${j.comp}</div>
      <div class="h2h-vs">
        <span class="h2h-team ${hostWin?"win "+hostCor:""}">${crest(j.hostNome)}<span class="nm">${j.hostNome}</span></span>
        <span class="h2h-pts"><b class="${hostWin?hostCor:""}">${j.hostGols}</b><i>×</i><b class="${visWin?visCor:""}">${j.visGols}</b></span>
        <span class="h2h-team right ${visWin?"win "+visCor:""}"><span class="nm">${j.visNome}</span>${crest(j.visNome)}</span>
      </div>
    </div>`;
  }).join("");

  const mediaGols = ((v.gA + v.gB) / jogos.length).toFixed(1).replace(".", ",");
  return `
      <div class="h2h-tally">
        <div class="h2h-col home"><div class="n">${v.vA}</div><div class="l">vitórias<br>${fx.home}</div></div>
        <div class="h2h-col"><div class="n">${v.e}</div><div class="l">empates</div></div>
        <div class="h2h-col away"><div class="n">${v.vB}</div><div class="l">vitórias<br>${fx.away}</div></div>
      </div>
      <div class="rx-sample">${jogos.length} confronto${jogos.length===1?"":"s"} · ${v.gA}–${v.gB} no placar agregado · ${mediaGols} gols por jogo</div>
      ${subtabs}
      ${mediasBloco}
      ${tendBloco}
      <button class="h2h-cardbtn" onclick="abrirCardH2H(${fi})">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4M8 11l4 4 4-4M12 15V3"/></svg>
        Gerar card
      </button>
      <div class="h2h-list">${rows}</div>`;
}

/* ---------- QUENTES: forma recente de cada time (últimos 10, escopo do filtro) ---------- */
const QT_JANELA = 10;
function formaTime(tid, ligaId, escopo){
  const jogos = getJogosRx(tid, ligaId, QT_JANELA, escopo); // mais recente primeiro
  if (!jogos.length) return null;
  const res = jogos.map(j => j.gols > j.golsSof ? "v" : j.gols < j.golsSof ? "d" : "e");
  // sequências (a partir do jogo mais recente)
  let sV = 0; while (sV < res.length && res[sV] === "v") sV++;
  let sInv = 0; while (sInv < res.length && res[sInv] !== "d") sInv++;
  let sSemV = 0; while (sSemV < res.length && res[sSemV] !== "v") sSemV++;
  let sMarca = 0; while (sMarca < jogos.length && jogos[sMarca].gols > 0) sMarca++;
  const seqs = [];
  if (sV >= 2) seqs.push({ icon: "chama", txt: `Venceu os últimos ${sV}` });
  else if (sInv >= 3) seqs.push({ icon: "escudo", txt: `Não perde há ${sInv} jogos` });
  else if (sSemV >= 3) seqs.push({ icon: "floco", txt: `Não vence há ${sSemV} jogos` });
  if (sMarca >= 3) seqs.push({ icon: "bola", txt: `Marcou gol nos últimos ${sMarca}` });
  // tendências (direção dominante, com aproveitamento)
  const mk = (getter, linha, label) => {
    const vals = jogos.map(getter).filter(x => x != null);
    if (!vals.length) return null;
    const over = vals.filter(x => x > linha).length, under = vals.length - over;
    const mais = over >= under, hit = mais ? over : under;
    return { txt: `${mais?"Mais":"Menos"} de ${String(linha).replace(".",",")} ${label}`, hit, n: vals.length, pct: Math.round(hit/vals.length*100) };
  };
  const mkBool = (pred, txtSim, txtNao) => {
    const sim = jogos.filter(pred).length, nao = jogos.length - sim;
    const ehSim = sim >= nao, hit = ehSim ? sim : nao;
    return { txt: ehSim ? txtSim : txtNao, hit, n: jogos.length, pct: Math.round(hit/jogos.length*100) };
  };
  const tend = [
    mk(j => j.gols + j.golsSof, H2H_LINHAS.gols, "gols na partida"),
    mkBool(j => j.gols > 0 && j.golsSof > 0, "Ambas marcam", "Ambas NÃO marcam"),
    mkBool(j => j.golsSof === 0, "Não sofreu gol", "Sofreu gol"),
    mk(j => (j.own.cantos ?? null) != null && (j.adv.cantos ?? null) != null ? j.own.cantos + j.adv.cantos : null, H2H_LINHAS.escanteios, "escanteios na partida"),
    mk(j => (j.own.amarelos ?? null) != null && (j.adv.amarelos ?? null) != null ? (j.own.amarelos||0)+(j.own.vermelhos||0)+(j.adv.amarelos||0)+(j.adv.vermelhos||0) : null, H2H_LINHAS.cartoes, "cartões na partida"),
  ].filter(Boolean);
  return { n: jogos.length, res, seqs, tend };
}
function quentesCorpo(fx, escopo, fi){
  const fH = formaTime(fx.homeId, fx.ligaId, escopo);
  const fA = formaTime(fx.awayId, fx.ligaId, escopo);
  if (!fH && !fA) return `<div class="empty-box" style="margin-top:6px">Sem jogos registrados pra calcular a forma — em "Quais jogos?", troque pra "Todos os jogos".</div>`;
  const painel = (f, nome, side) => {
    if (!f) return `<div class="qt-panel"><div class="qt-head">${teamCrest(nome)}<span class="nm">${nome}</span></div><div class="empty-box">Sem jogos no filtro atual.</div></div>`;
    // sequência V/E/D: mais antigo → mais recente (padrão de leitura)
    const boxes = [...f.res].reverse().map(r => `<span class="qt-box ${r}">${r==="v"?"V":r==="d"?"D":"E"}</span>`).join("");
    const seqHTML = f.seqs.map(s => `<div class="qt-seqline"><span class="ico">${svgIco(s.icon)}</span>${s.txt}</div>`).join("");
    const tendHTML = f.tend.map(t => `<div class="qt-row ${t.pct>=70?"hot":""}">
        <span class="txt">${t.txt}</span><span class="hit">${t.hit}/${t.n}</span>
      </div>`).join("");
    return `<div class="qt-panel ${side}">
      <div class="qt-head">${teamCrest(nome)}<span class="nm">${nome}</span></div>
      <div class="qt-sub">últimos ${f.n} jogos</div>
      <div class="qt-seq">${boxes}</div>
      ${seqHTML}
      <div class="qt-list">${tendHTML}</div>
    </div>`;
  };
  return `
    <div class="rx-sample" style="margin:2px 0 12px">forma recente · sequências e tendências que ajudam na leitura do jogo · 70%+ marcadas em verde</div>
    <button class="h2h-cardbtn" onclick="abrirCardQuentes(${fi})">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4M8 11l4 4 4-4M12 15V3"/></svg>
      Gerar card
    </button>
    <div class="qt-grid">
      ${painel(fH, fx.home, "home")}
      ${painel(fA, fx.away, "away")}
    </div>`;
}

/* ---------- ESCALAÇÕES: campinho (provável = último XI + desfalques oficiais) ---------- */
function normNome(s){ return (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim(); }
/* ----- aba Classificação: tabela da liga com os dois clubes do jogo destacados ----- */
function classifCorpo(fx){
  const bruto = (SEM.classificacao || {})[String(fx.ligaId)];
  if (!bruto || !bruto.length) return `<div class="empty-box" style="margin-top:14px">Sem tabela de classificação nesta competição.</div>`;
  // ligas com múltiplas fases/grupos (Apertura/Clausura, zonas): cada (fase, grupo)
  // é uma tabela — mostra a que contém os clubes do jogo; empate → fase mais recente
  const parts = new Map();
  for (const r of bruto){
    const k = `${r.st || 0}:${r.g || 0}`;
    if (!parts.has(k)) parts.set(k, []);
    parts.get(k).push(r);
  }
  let tab = null, melhor = -1;
  for (const arr of parts.values()){
    const temJogo = arr.some(r => r.tid === fx.homeId || r.tid === fx.awayId) ? 1 : 0;
    const score = temJogo * 1e15 + (arr[0].st || 0) * 10 + arr.length / 1000;
    if (score > melhor){ melhor = score; tab = arr; }
  }
  tab = [...tab].sort((a, b) => (a.pos || 999) - (b.pos || 999));
  // estilo FlashScore: tudo numa tela só — no mobile V/E/D somem e sobra espaço pro nome
  const linhas = tab.map(r => {
    const hl = r.tid === fx.homeId ? "home" : r.tid === fx.awayId ? "away" : "";
    return `<tr class="${hl ? "cl-hl cl-hl-" + hl : ""}">
      <td class="cl-pos tnum">${r.pos ?? "–"}</td>
      <td class="cl-time">${teamCrest(r.nome)}<span class="cl-nm">${r.nome}</span>${hl ? `<span class="rx-dot ${hl}" style="margin-left:6px"></span>` : ""}</td>
      <td class="tnum">${r.j ?? "–"}</td>
      <td class="tnum cl-md">${r.v ?? "–"}</td>
      <td class="tnum cl-md">${r.e ?? "–"}</td>
      <td class="tnum cl-md">${r.d ?? "–"}</td>
      <td class="tnum cl-gols">${r.gp ?? "–"}:${r.gc ?? "–"}</td>
      <td class="tnum cl-sg">${r.sg == null ? "–" : r.sg > 0 ? "+" + r.sg : r.sg}</td>
      <td class="cl-pts tnum">${r.pts ?? "–"}</td>
    </tr>`;
  }).join("");
  return `<div class="classif-wrap">
    <table class="classif-table">
      <thead><tr><th>#</th><th style="text-align:left">Time</th><th>J</th><th class="cl-md">V</th><th class="cl-md">E</th><th class="cl-md">D</th><th>Gols</th><th>SG</th><th>P</th></tr></thead>
      <tbody>${linhas}</tbody>
    </table>
    <div class="rx-sample" style="margin-top:10px">${fx.competicao} · tabela atualizada na última coleta</div>
  </div>`;
}
function escalacoesCorpo(fx, fi){
  const dataBR = ts => { const [y,m,d] = (ts||"").split("-"); return d ? `${d}/${m}/${y.slice(2)}` : ""; };
  const desfalques = (SEM.escalacoes?.desfalques || {})[String(fx.id)] || [];

  const painel = (tid, nome, side) => {
    const e = (SEM.escalacoes?.ultimas || {})[String(tid)];
    const desfTime = desfalques.filter(x => x.tid === tid);
    const desfNorm = desfTime.map(x => normNome(x.nome));
    if (!e || !e.xi?.length) return `<div class="qt-panel ${side}">
      <div class="qt-head">${teamCrest(nome)}<span class="nm">${nome}</span></div>
      <div class="empty-box" style="margin-top:10px">Sem escalação registrada do último jogo deste time.</div></div>`;

    // liga o nome da escalação ao elenco (pra abrir o perfil ao clicar)
    const elenco = ELENCOS[String(tid)] || [];
    const achaIdx = nomeEsc => {
      const n = normNome(nomeEsc);
      let i = elenco.findIndex(j => normNome(j.name) === n);
      if (i >= 0) return i;
      // "M. Cassierra" → inicial + sobrenome
      const m = n.match(/^(\w)\.\s*(.+)$/);
      if (m){
        const cands = elenco.map((j, k) => [j, k]).filter(([j]) => {
          const nj = normNome(j.name);
          return nj.endsWith(m[2]) && nj.startsWith(m[1]);
        });
        if (cands.length === 1) return cands[0][1];
      }
      // sobrenome único
      const sobren = n.split(" ").pop();
      const c2 = elenco.map((j, k) => [j, k]).filter(([j]) => normNome(j.name).split(" ").includes(sobren));
      return c2.length === 1 ? c2[0][1] : -1;
    };

    const temGrid = e.xi.some(p => p.grid);
    const linhas = {};
    e.xi.forEach(p => {
      const r = temGrid
        ? (parseInt((p.grid || "0:0").split(":")[0]) || 0)
        : ({ G: 1, D: 2, M: 3, F: 4 }[p.pos] ?? 3);
      (linhas[r] = linhas[r] || []).push(p);
    });
    const ordens = Object.keys(linhas).map(Number).sort((a, b) => b - a); // ataque no topo, goleiro embaixo
    const rowsHTML = ordens.map(r => `<div class="esc-row">${linhas[r]
      .sort((a, b) => (parseInt((a.grid||"0:0").split(":")[1])||0) - (parseInt((b.grid||"0:0").split(":")[1])||0))
      .map(p => {
        const foto = window.SC_ASSETS?.fotos?.[p.nome];
        const idx = achaIdx(p.nome);
        const fora = desfNorm.some(dn => dn === normNome(p.nome) || (normNome(p.nome).match(/^\w\./) && dn.endsWith(normNome(p.nome).split(" ").pop())));
        const clique = idx >= 0 ? `onclick="abrirJogador(${fi}, '${side}', ${idx})"` : "";
        const sobrenome = p.nome.split(" ").length > 1 && p.nome.length > 13 ? p.nome.split(" ").slice(-1)[0] : p.nome;
        return `<button class="esc-p ${idx>=0?"click":""} ${fora?"out":""}" ${clique} title="${p.nome}${fora?" · FORA":""}">
          <div class="esc-dot">${foto ? `<img src="${foto}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'${p.num ?? ""}'}))">` : `<span>${p.num ?? ""}</span>`}${fora?'<span class="esc-x">✕</span>':""}</div>
          <div class="esc-nm"><b>${p.num ?? ""}</b> ${sobrenome}</div>
        </button>`;
      }).join("")}</div>`).join("");

    const desfHTML = desfTime.length ? `<div class="esc-desf">${svgIco("bloqueio")} <b>Fora:</b> ${desfTime.map(x => `${x.nome} <span>(${x.motivo})</span>`).join(" · ")}</div>` : "";
    return `<div class="qt-panel ${side}">
      <div class="qt-head">${teamCrest(nome)}<span class="nm">${nome}</span></div>
      <div class="qt-sub">${e.formacao || "formação —"}${e.tecnico ? ` · téc. ${e.tecnico}` : ""} · base: × ${e.adv} (${dataBR(e.ts)})</div>
      <div class="esc-pitch ${side}"><div class="esc-marks"></div>${rowsHTML}</div>
      ${desfHTML}
    </div>`;
  };

  const notaDesf = desfalques.length
    ? `desfalques oficiais marcados com ✕`
    : `sem dados de desfalque pra este jogo (a fonte não cobre todas as competições)`;
  return `
    <div class="rx-sample" style="margin:2px 0 12px">escalação <b>provável</b> — base: último jogo · ${notaDesf} · confirmada sai ~1h antes no <a href="https://t.me/apitoualertas" target="_blank" rel="noopener" style="color:var(--acc); font-weight:700">t.me/apitoualertas</a> ${svgIco("sino")}</div>
    <div class="qt-grid">
      ${painel(fx.homeId, fx.home, "home")}
      ${painel(fx.awayId, fx.away, "away")}
    </div>`;
}

/* ---------- PERFIL DO ÁRBITRO (mercado de cartões) ---------- */
function setArbJanela(n){ state.arbJanela = n; render(); }
function setArbEscopo(e){ state.arbEscopo = e; render(); }
/* métricas do árbitro sob ESCOPO (geral/casa/fora/confronto) + JANELA (5/10/15/30/base) */
function arbView(arb, fx){
  const jan = state.arbJanela ?? 10;
  const esc = state.arbEscopo || "geral";
  const todos = arb.ultimos || [];
  const filtro = esc === "casa" ? (g => g.jogo.includes(fx.home))
               : esc === "fora" ? (g => g.jogo.includes(fx.away))
               : esc === "confronto" ? (g => g.jogo.includes(fx.home) && g.jogo.includes(fx.away))
               : (() => true);
  const escLabel = esc === "casa" ? `com o ${fx.home}` : esc === "fora" ? `com o ${fx.away}`
                 : esc === "confronto" ? `no confronto ${fx.home} x ${fx.away}` : "geral";
  const subset = todos.filter(filtro);

  // GERAL + base completa = agregado de carreira (tem pênaltis/VAR)
  if (esc === "geral" && jan === "base"){
    return { esc, escLabel, janela: `base completa (${arb.jogos || "?"} jogos)`, n: arb.jogos,
             jogos: todos.slice(0, 10), vazio: false,
             amarelos: arb.amarelos, faltas: arb.faltas, vermelhos: arb.vermelhos,
             amarelosCasa: arb.amarelosCasa, amarelosFora: arb.amarelosFora,
             penaltis: arb.penaltis, varm: arb.var };
  }
  const jogos = jan === "base" ? subset : subset.slice(0, jan);
  if (!jogos.length){
    return { esc, escLabel, janela: "sem jogos", n: 0, jogos: [], vazio: true };
  }
  const med = sel => Math.round(jogos.reduce((a, g) => a + sel(g), 0) / jogos.length * 100) / 100;
  const janLabel = jan === "base" ? `todos os ${jogos.length} da base recente` : `últimos ${jogos.length}`;
  return { esc, escLabel, janela: `${janLabel} · ${escLabel}`, n: jogos.length, jogos, vazio: false,
           amarelos: med(g => g.am), faltas: med(g => g.faltas), vermelhos: med(g => g.vm),
           amarelosCasa: med(g => g.amC), amarelosFora: med(g => g.amF),
           penaltis: null, varm: null };
}
function renderArbitro(){
  const fi = state.jogoAberto ?? 0;
  const fx = FIXTURES[fi];
  const arb = fx ? (SEM.arbitros || {})[String(fx.id)] : null;
  if (!arb){ go('jogo', null, null, null, fi); return; }
  const v = arbView(arb, fx);
  const nb = x => x != null ? String(x).replace(".", ",") : "—";
  const tile = (k, val, cls="") => `<div class="tile ${cls}"><div class="k">${k}</div><div class="big tnum" style="font-size:34px">${val}</div></div>`;
  const jan = state.arbJanela ?? 10;
  const esc = state.arbEscopo || "geral";
  const temUlt = (arb.ultimos || []).length >= 3;

  // ----- FILTRO 1: escopo (Geral · mandante · visitante · Confronto) -----
  const chipE = (e, txt) => `<button class="chip ${esc===e?'on':''}" onclick="setArbEscopo('${e}')">${txt}</button>`;
  const chipJ = (n, txt) => `<button class="chip ${jan===n?'on':''}" onclick="setArbJanela(${typeof n==='string'?`'${n}'`:n})">${txt}</button>`;
  const filtros = temUlt ? `
    <div class="jogo-filtros" style="margin-top:16px">
      <div class="qlabel">Quais jogos do árbitro?</div>

      <div class="qlabel">Quantos jogos contar?</div>
      <div class="filters">${chipJ(5,"Últimos 5")}${chipJ(10,"Últimos 10")}${chipJ(15,"Últimos 15")}${chipJ(30,"Últimos 30")}${chipJ("base","Base completa")}</div>
    </div>` : "";

  // ----- corpo (tudo reage a escopo + janela) -----
  let corpo;
  if (v.vazio){
    corpo = `<div class="empty-box" style="margin-top:16px">Sem jogos do ${arb.nome.split(" ")[0]} ${v.escLabel} nos últimos 12 meses da base — troque o filtro acima (ex.: "Geral").</div>`;
  } else {
    let splitHTML = "";
    if (v.amarelosCasa != null && v.amarelosFora != null){
      const c = v.amarelosCasa, f = v.amarelosFora, max = Math.max(c, f, 0.001);
      const vies = f > c * 1.15 ? "tende a dar MAIS cartão pro visitante" : c > f * 1.15 ? "tende a dar MAIS cartão pro mandante" : "equilibrado entre mandante e visitante";
      splitHTML = `
        <div class="rx-card" style="margin-top:18px">
          <div class="rx-group-t">Amarelos por jogo · mandante × visitante</div>
          <div class="rx-row">
            <div class="rx-side"><span class="rx-val tnum">${nb(c)}</span><div class="rx-bar"><div class="rx-fill home" style="width:${c/max*100}%"></div></div></div>
            <div class="rx-label">${svgIco("cartaoAm")} amarelos</div>
            <div class="rx-side away"><div class="rx-bar"><div class="rx-fill away" style="width:${f/max*100}%"></div></div><span class="rx-val tnum">${nb(f)}</span></div>
          </div>
          <div class="rx-sample" style="margin-top:8px">esquerda = pro time da CASA · direita = pro VISITANTE · leitura: ${vies}</div>
        </div>`;
    }
    const dataBR = ts => { const [y,m,d] = ts.split("-"); return `${d}/${m}/${y.slice(2)}`; };
    const extrato = v.jogos.length ? `
      <div class="section-h" style="margin-top:24px"><span class="lbl">Jogo a jogo · ${v.escLabel}</span><span class="count tnum">${v.jogos.length} jogos</span></div>
      <div class="jg-list">${v.jogos.map(g => `
        <div class="jg-game" style="grid-template-columns:66px 1fr auto">
          <span class="jg-date">${dataBR(g.ts)}</span>
          <span class="jg-adv">${g.jogo}</span>
          <span class="jg-vals"><b class="amber tnum">${g.am}</b> ${svgIco("cartaoAm")}${g.vm ? ` · <b class="tnum" style="color:#E05A4E">${g.vm}</b> ${svgIco("cartaoVm")}` : ""} · <b class="tnum">${g.faltas}</b> faltas</span>
        </div>`).join("")}</div>` : "";
    corpo = `
      <div class="tiles" style="margin-top:16px">
        ${tile(`${svgIco("cartaoAm")} Amarelos / jogo`, nb(v.amarelos), "hero-a")}
        ${tile("Faltas / jogo", nb(v.faltas), "hero-b")}
        ${tile(`${svgIco("cartaoVm")} Vermelhos / jogo`, nb(v.vermelhos))}
        ${v.penaltis != null ? tile("Pênaltis / jogo", nb(v.penaltis)) : tile("Jogos na amostra", v.n ?? "—")}
      </div>
      ${splitHTML}
      <button class="h2h-cardbtn" onclick="abrirCardArbitro()" style="margin-top:16px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4M8 11l4 4 4-4M12 15V3"/></svg>
        Gerar card
      </button>
      ${extrato}
      <div class="dna-panel">
        ${v.varm != null ? `<div class="dna-row"><span class="k">Intervenções de VAR por jogo</span><span class="v flat tnum">${nb(v.varm)}</span></div>` : ""}
        <div class="dna-row"><span class="k">Amostra ativa: ${v.janela}</span><span class="v flat tnum">${svgIco("cartaoDuplo")}</span></div>
      </div>`;
  }

  el.innerHTML = `
    <button class="back" onclick="go('jogo', null, null, null, ${fi})"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg> ${fx.home} x ${fx.away}</button>
    <div class="phead">
      <div class="avatar" style="${avatarStyle(arb.nome.length*7)}; color:#FE2C55">${svgIco("apito", 30)}</div>
      <div style="flex:1; min-width:200px">
        <h1>${arb.nome}</h1>
        <div class="pmeta">Árbitro <span class="dot"></span> <span class="badge">apita ${fx.home} x ${fx.away}</span></div>
      </div>
    </div>
    ${filtros}
    ${corpo}
    ${sourceNoteQI()}
  `;
}

/* Card do árbitro (respeita escopo + janela ativos) */
function abrirCardArbitro(){
  const fi = state.jogoAberto ?? 0;
  const fx = FIXTURES[fi];
  const arb = fx ? (SEM.arbitros || {})[String(fx.id)] : null;
  if (!arb) return;
  const v = arbView(arb, fx);
  if (v.vazio) return;
  state.card = { tipo: "arbitro", formato: "sticker", label: "arbitro",
    nome: arb.nome, fx, contexto: `${v.janela} · apita ${fx.home} x ${fx.away}`,
    amarelos: v.amarelos, faltas: v.faltas, vermelhos: v.vermelhos,
    amarelosCasa: v.amarelosCasa, amarelosFora: v.amarelosFora,
    jogos: (v.jogos || []).slice(0, 8) };
  montarCardModal();
}

function renderJogo(){
  const fi = state.jogoAberto ?? 0;
  const fx = FIXTURES[fi];

  const ehLiga = ehLigaRegular(fx.ligaId);  // liga regular: janela de até 30 jogos
  const ehContinental = ehContinentalLiga(fx.ligaId);
  const tab = state.jogoTab || "stats";

  // ----- Abas grandes: a pergunta que o usuário tem na cabeça -----
  const tabBtn = (k, txt) => `<button class="jogo-tab ${tab===k?'on':''}" onclick="setJogoTab('${k}')">${txt}</button>`;
  const temClassif = !!(SEM.classificacao || {})[String(fx.ligaId)];
  // estilo FlashScore: texto maiúsculo puro, ativa em ciano — ícone aqui só poluía
  const tabsRow = `<div class="jogo-tabs">${tabBtn("stats", "Números")}${tabBtn("h2h", "Confronto")}${tabBtn("quentes", "Quentes")}${temClassif ? tabBtn("classif", "Classificação") : ""}${tabBtn("esc", "Escalações")}</div>`;

  // ----- Filtros com rótulo-pergunta (só os que fazem sentido na aba) -----
  const labelComp = ehContinental ? "Só continentais" : `Só ${fx.competicao}`;
  const chipJ = n => `<button class="chip ${state.rxJanela===n?'on':''}" onclick="setRxJanela(${n})">Últimos ${n}</button>`;
  const chipE = (e, label) => `<button class="chip ${state.rxEscopo===e?'on':''}" onclick="setRxEscopo('${e}')">${label}</button>`;
  const grupoJanela = `<div class="qlabel">Quantos jogos contar?</div>
    <div class="filters">${chipJ(5)}${chipJ(10)}${chipJ(15)}${ehLiga ? chipJ(30) : ""}</div>`;
  const grupoEscopo = `<div class="qlabel">Quais jogos?</div>
    <div class="filters">${chipE("comp", labelComp)}${chipE("geral", "Todos os jogos")}</div>`;
  // mando de campo (só na aba Números; só quando o dado tem a flag)
  const temMando = (RAIOX_RAW[String(fx.homeId)]?.geral || []).some(j => j.casa != null);
  const mandoSel = state.rxMando || "todos";
  const chipM = (m, txt) => `<button class="chip ${mandoSel===m?'on':''}" onclick="setRxMando('${m}')">${txt}</button>`;
  const grupoMando = temMando ? `<div class="qlabel">Mando de campo?</div>
    <div class="filters">${chipM("todos", "Todos")}${chipM("casaH", `${fx.home} · casa`)}${chipM("foraA", `${fx.away} · fora`)}</div>` : "";
  // atalho estilo Excel: escolhe a estatística → cai direto no card postável
  const grupoStat = `<div class="qlabel">Ir direto pra uma estatística?</div>
    <div class="filters"><select class="stat-sel" onchange="irEstatistica(${fi}, this)">
      <option value="">Escolher estatística…</option>
      <optgroup label="Ataque"><option value="gols">Gols marcados</option><option value="fin">Finalizações</option><option value="chutesGol">Chutes a gol</option><option value="cantos">Escanteios</option></optgroup>
      <optgroup label="Defesa"><option value="golsSof">Gols sofridos</option><option value="finSof">Finalizações sofridas</option><option value="cantosSof">Escanteios cedidos</option><option value="defesas">Defesas de goleiro</option></optgroup>
      <optgroup label="Disciplina"><option value="faltas">Faltas cometidas</option><option value="amarelos">Cartões amarelos</option><option value="vermelhos">Cartões vermelhos</option></optgroup>
      <optgroup label="Controle"><option value="posse">Posse de bola</option><option value="laterais">Arremessos laterais</option><option value="tiroMeta">Tiros de meta</option></optgroup>
    </select></div>`;
  const filtrosRow = (tab === "esc" || tab === "classif") ? "" : `<div class="jogo-filtros">${tab === "stats" ? grupoJanela : ""}${grupoEscopo}${tab === "stats" ? grupoMando : ""}${tab === "stats" ? grupoStat : ""}</div>`;

  // no modo clube único (mando), o cabeçalho mostra SÓ o clube filtrado — os dois
  // escudos juntos faziam a coluna esquerda parecer do mandante
  const soloHead = tab === "stats" && (state.rxMando === "casaH" || state.rxMando === "foraA");
  const teamsHead = soloHead ? (() => {
    const ehCasa = state.rxMando === "casaH";
    const nomeS = ehCasa ? fx.home : fx.away;
    return `
    <div class="rx-teams-head" style="justify-content:center; gap:12px">
      <div class="rx-team">${teamCrest(nomeS)}<span class="tn">${nomeS}</span><span class="rx-dot ${ehCasa ? "home" : "away"}"></span></div>
      <span class="rx-vs">só jogos ${ehCasa ? "em casa" : "fora de casa"}</span>
    </div>`;
  })() : `
    <div class="rx-teams-head">
      <div class="rx-team">${teamCrest(fx.home)}<span class="tn">${fx.home}</span><span class="rx-dot home"></span></div>
      <span class="rx-vs">${tab === "h2h" ? "confronto direto" : tab === "quentes" ? "forma recente" : tab === "esc" ? "escalações" : tab === "classif" ? "classificação" : "média por jogo"}</span>
      <div class="rx-team away"><span class="rx-dot away"></span><span class="tn">${fx.away}</span>${teamCrest(fx.away)}</div>
    </div>`;

  // ----- Corpo do card: confronto direto OU quentes OU escalações OU médias -----
  let corpo;
  if (tab === "h2h"){
    corpo = h2hCorpo(fx, state.rxEscopo, fi);
  } else if (tab === "quentes"){
    corpo = quentesCorpo(fx, state.rxEscopo, fi);
  } else if (tab === "esc"){
    corpo = escalacoesCorpo(fx, fi);
  } else if (tab === "classif"){
    corpo = classifCorpo(fx);
  } else {
    // mando estilo FlashScore: Todos | {mandante} · casa | {visitante} · fora
    // modo clube único: só os números DAQUELE clube, comparados com a média geral dele
    const solo = mandoSel === "casaH" ? "H" : mandoSel === "foraA" ? "A" : null;
    if (solo){
      const tidS = solo === "H" ? fx.homeId : fx.awayId;
      const nomeS = solo === "H" ? fx.home : fx.away;
      const emCasa = solo === "H";
      const rot = emCasa ? "em casa" : "fora de casa";
      const rxSel = computeRx(tidS, fx.ligaId, state.rxJanela, state.rxEscopo, emCasa);
      if (rxSel && rxSel.jogos){
        const icoUp = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:.55; vertical-align:-1px"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v13"/></svg>`;
        // sparkline jogo a jogo: preenche a linha com o dado real (constância × picos)
        const jogosSel = getJogosRx(tidS, fx.ligaId, state.rxJanela, state.rxEscopo, emCasa);
        const corSel = emCasa ? "var(--acc)" : "#FE2C55";
        const dataBR2 = ts => ts ? ts.slice(5).split("-").reverse().join("/") : "";
        const spark = key => {
          const sel = STAT_SEL[key]; if (!sel) return `<span class="spark"></span>`;
          const js = [...jogosSel].reverse();
          const vs = js.map(j => { const v = sel(j); return v == null ? null : v; });
          const nums = vs.filter(v => v != null);
          if (!nums.length) return `<span class="spark"></span>`;
          const max = Math.max(...nums, 0.001);
          return `<span class="spark">${vs.map((v, i) => {
            const tip = `${v == null ? "sem dado" : v} × ${js[i].advNome || "?"} · ${dataBR2(js[i].ts)}`;
            return v == null
              ? `<i data-tip="${tip}" style="height:8%; background:#3A3A44"></i>`
              : `<i data-tip="${tip}" style="height:${Math.max(10, v/max*100)}%; background:${corSel}"></i>`;
          }).join("")}</span>`;
        };
        const linhaS = (key, label, a, dec=1, sufixo="") => {
          if (a == null) return "";
          return `<div class="solo-row" title="Gerar card pra postar" onclick="abrirCardSolo(${fi}, '${key}')">
            <span class="val tnum" style="color:${corSel}">${fmt(a,dec)}${sufixo}</span>
            ${spark(key)}
            <span class="lbl">${label} ${icoUp}</span>
          </div>`;
        };
        const grupoS = (titulo, linhas) => linhas.trim() ? `<div class="rx-group"><div class="rx-group-t">${titulo}</div>${linhas}</div>` : "";
        corpo = `
          <div class="rx-sample">amostra: ${rxSel.jogos} jogo${rxSel.jogos===1?"":"s"} ${rot}${rxSel.inclui2025 ? " · inclui temporada 2025" : ""} · toque numa linha pra gerar o card</div>
          ${grupoS("Ataque", linhaS("gols", "Gols marcados", rxSel.gols) + linhaS("fin", "Finalizações", rxSel.fin) + linhaS("chutesGol", "Chutes a gol", rxSel.chutesGol) + linhaS("cantos", "Escanteios", rxSel.cantos))}
          ${grupoS("Defesa", linhaS("golsSof", "Gols sofridos", rxSel.golsSof) + linhaS("finSof", "Finalizações sofridas", rxSel.finSof) + linhaS("cantosSof", "Escanteios cedidos", rxSel.cantosSof) + linhaS("defesas", "Defesas de goleiro", rxSel.defesas))}
          ${grupoS("Disciplina", linhaS("faltas", "Faltas cometidas", rxSel.faltas) + linhaS("amarelos", "Cartões amarelos", rxSel.amarelos) + linhaS("vermelhos", "Cartões vermelhos", rxSel.vermelhos, 2))}
          ${grupoS("Controle", linhaS("posse", "Posse de bola", rxSel.posse, 0, "%") + linhaS("laterais", "Arremessos laterais", rxSel.laterais) + linhaS("tiroMeta", "Tiros de meta", rxSel.tiroMeta))}`;
      } else {
        corpo = `<div class="empty-box" style="margin-top:6px">O ${nomeS} ainda não tem jogos ${rot} na amostra atual — aumente a janela ou volte pra "Todos".</div>`;
      }
    } else {
    const rxH = computeRx(fx.homeId, fx.ligaId, state.rxJanela, state.rxEscopo, null);
    const rxA = computeRx(fx.awayId, fx.ligaId, state.rxJanela, state.rxEscopo, null);
    if (rxH && rxA){
      // medidor de confronto: chama = adversário cede muito desta estatística; floco = cede pouco
      const NOME_DVP = { gols: "gols", fin: "finalizações", chutesGol: "chutes a gol", cantos: "escanteios" };
      const badge = (stat, cedKey, advRx, advNome) => {
        const v = advRx?.[cedKey];
        const pct = dvpPercentil(stat, v);
        if (pct == null) return "";
        if (pct >= 70) return `<span class="mchip" data-tip="matchup quente: ${advNome} cede ${fmt(v)} ${NOME_DVP[stat]}/jogo — mais que ${pct}% dos times">${svgIco("chama")}</span>`;
        if (pct <= 30) return `<span class="mchip" data-tip="matchup frio: ${advNome} cede só ${fmt(v)} ${NOME_DVP[stat]}/jogo — menos que ${100-pct}% dos times">${svgIco("floco")}</span>`;
        return "";
      };
      // gráfico expansível da estatística (estilo perfil do jogador): os dois times, jogo a jogo
      const chartPanel = (key, label, a, b, dec, sufixo) => {
        if (state.rxChart !== key) return "";
        const sel = STAT_SEL[key]; if (!sel) return "";
        const bloco = (tid, nome, cor) => {
          const js = [...getJogosRx(tid, fx.ligaId, state.rxJanela, state.rxEscopo, null)].reverse();
          const vals = js.map(j => { const v = sel(j); return v == null ? null : v; });
          const nums = vals.filter(v => v != null);
          if (!nums.length) return "";
          const max = Math.max(...nums, 0.001);
          const media = nums.reduce((x,y)=>x+y,0) / nums.length;
          const chartH = 105, rodape = 34;
          return `<div style="margin:12px 0 2px; font-weight:800; font-size:12.5px; color:${cor}">${nome}</div>
            <div style="position:relative">
              <div style="position:absolute; left:0; right:0; bottom:${rodape + media/max*chartH}px; border-top:1.5px dashed rgba(255,255,255,0.35); pointer-events:none; z-index:2"></div>
              <div class="tnum" style="position:absolute; right:2px; bottom:${rodape + media/max*chartH + 3}px; font-size:10px; color:var(--txt3); z-index:2; pointer-events:none">média ${fmt(media)}</div>
              <div style="display:flex; align-items:flex-end; gap:5px; height:${chartH + rodape + 18}px">
              ${js.map((j, i) => { const v = vals[i]; const zero = !v; const h = v == null ? 4 : Math.max(6, v/max*chartH);
                return `<div style="flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%">
                  <div class="tnum" style="font-size:11px; font-weight:800; color:${zero ? "var(--txt3)" : cor}">${v == null ? "–" : v}</div>
                  <div style="width:100%; max-width:40px; height:${h}px; border-radius:4px 4px 0 0; background:${zero ? "rgba(255,255,255,0.10)" : cor}; margin-top:2px"></div>
                  <div style="height:${rodape}px; display:flex; flex-direction:column; align-items:center; padding-top:4px; width:100%">
                    <span style="font-size:9px; color:var(--txt3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%">${j.advNome || ""}</span>
                    <span class="tnum" style="font-size:9px; color:var(--txt3)">${(j.ts || "").slice(5).split("-").reverse().join("/")}</span>
                  </div></div>`; }).join("")}
              </div></div>`;
        };
        return `<div style="padding:2px 2px 14px; border-bottom:1px solid rgba(255,255,255,0.05)">
          <div style="margin-top:12px; font-weight:800; font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--txt3); display:flex; align-items:center; gap:8px">${svgIco("grafico")} ${label} · jogo a jogo</div>
          ${bloco(fx.homeId, fx.home, "var(--acc)")}${bloco(fx.awayId, fx.away, "#FE2C55")}
          <div style="display:flex; gap:10px; margin-top:14px; flex-wrap:wrap">
            <button class="h2h-cardbtn" style="flex:1; min-width:180px; margin:0" onclick="abrirCardGrafico(${fi}, '${key}', '${escapeHtml(label)}', ${dec}, '${sufixo}')">
              ${svgIco("grafico")} Gerar card · gráfico
            </button>
            <button class="h2h-cardbtn" style="flex:1; min-width:180px; margin:0" onclick="abrirCard(${fi}, '${key}', '${escapeHtml(label)}', ${a}, ${b}, ${dec}, '${sufixo}')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4M8 11l4 4 4-4M12 15V3"/></svg>
              Gerar card · números
            </button>
          </div>
        </div>`;
      };
      // toque na LINHA = abre/fecha o gráfico jogo a jogo; a setinha = gera o card
      const linha = (key, label, a, b, dec=1, sufixo="", bH="", bA="") => {
        if (a == null || b == null) return "";
        const max = Math.max(a, b, 0.001);
        const aberto = state.rxChart === key;
        return `<div class="rx-row rx-click ${aberto ? "rx-open" : ""}" title="Ver jogo a jogo" onclick="setRxChart('${key}')">
          <div class="rx-side"><span class="rx-val tnum">${fmt(a,dec)}${sufixo}</span>${bH}<div class="rx-bar"><div class="rx-fill home" style="width:${a/max*100}%"></div></div></div>
          <div class="rx-label">${label} <span class="card-tgl" title="Gerar card pra postar" onclick="event.stopPropagation(); abrirCard(${fi}, '${key}', '${escapeHtml(label)}', ${a}, ${b}, ${dec}, '${sufixo}')"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v13"/></svg></span><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="opacity:.5; margin-left:5px; transform:rotate(${aberto ? 180 : 0}deg); transition:transform .15s"><path d="M6 9l6 6 6-6"/></svg></div>
          <div class="rx-side away"><div class="rx-bar"><div class="rx-fill away" style="width:${b/max*100}%"></div></div>${bA}<span class="rx-val tnum">${fmt(b,dec)}${sufixo}</span></div>
        </div>${chartPanel(key, label, a, b, dec, sufixo)}`;
      };
      const grupo = (titulo, linhas) => linhas.trim() ? `<div class="rx-group"><div class="rx-group-t">${titulo}</div>${linhas}</div>` : "";
      corpo = `
        <div class="rx-sample">amostra: ${rxH.jogos} jogo${rxH.jogos===1?"":"s"} do ${fx.home} · ${rxA.jogos} jogo${rxA.jogos===1?"":"s"} do ${fx.away}${state.rxEscopo==="comp" ? (ehContinental ? " em copas continentais" : ` (só ${fx.competicao})`) : ""}${(rxH.jogos < state.rxJanela || rxA.jogos < state.rxJanela) ? " (todos os disponíveis)" : ""}${(rxH.inclui2025 || rxA.inclui2025) ? " · inclui temporada 2025" : ""} · toque numa estatística pra abrir o jogo a jogo</div>
        ${grupo("Ataque",
          linha("gols", "Gols marcados", rxH.gols, rxA.gols, 1, "", badge("gols","golsSof",rxA,fx.away), badge("gols","golsSof",rxH,fx.home)) +
          linha("fin", "Finalizações", rxH.fin, rxA.fin, 1, "", badge("fin","finSof",rxA,fx.away), badge("fin","finSof",rxH,fx.home)) +
          linha("chutesGol", "Chutes a gol", rxH.chutesGol, rxA.chutesGol, 1, "", badge("chutesGol","chutesGolSof",rxA,fx.away), badge("chutesGol","chutesGolSof",rxH,fx.home)) +
          linha("cantos", "Escanteios", rxH.cantos, rxA.cantos, 1, "", badge("cantos","cantosSof",rxA,fx.away), badge("cantos","cantosSof",rxH,fx.home)))}
        ${grupo("Defesa", linha("golsSof", "Gols sofridos", rxH.golsSof, rxA.golsSof) + linha("finSof", "Finalizações sofridas", rxH.finSof, rxA.finSof) + linha("cantosSof", "Escanteios cedidos", rxH.cantosSof, rxA.cantosSof) + linha("defesas", "Defesas de goleiro", rxH.defesas, rxA.defesas))}
        ${grupo("Disciplina", linha("faltas", "Faltas cometidas", rxH.faltas, rxA.faltas) + linha("amarelos", "Cartões amarelos", rxH.amarelos, rxA.amarelos) + linha("vermelhos", "Cartões vermelhos", rxH.vermelhos, rxA.vermelhos, 2))}
        ${grupo("Controle", linha("posse", "Posse de bola", rxH.posse, rxA.posse, 0, "%") + linha("laterais", "Arremessos laterais", rxH.laterais, rxA.laterais) + linha("tiroMeta", "Tiros de meta", rxH.tiroMeta, rxA.tiroMeta))}
        ${(() => {
          // tendências da partida: varre TODOS os mercados, mostra só 70%+, mais fortes primeiro
          const tendRow = def => {
            const pH = tendPontos(fx.homeId, fx, def), pA = tendPontos(fx.awayId, fx, def);
            if (!pH.length || !pA.length) return null;
            const rH = { hit: pH.filter(p=>p.hit).length, n: pH.length };
            const rA = { hit: pA.filter(p=>p.hit).length, n: pA.length };
            const pct = Math.max(rH.hit/rH.n, rA.hit/rA.n);
            if (pct < 0.7) return null;
            return { def, rH, rA, pct, pH, pA };
          };
          const quentes = TEND_DEFS.map(tendRow).filter(Boolean).sort((a,b) => b.pct - a.pct);
          const MAXT = 12;
          const mostradas = quentes.slice(0, MAXT);
          if (!mostradas.length) return "";
          const painel = t => {
            const key = "tend:" + t.def.id;
            if (state.rxChart !== key) return "";
            const bloco = (pts, nome, cor) => {
              if (!pts.length) return "";
              const maxV = Math.max(...pts.map(p=>p.v), t.def.linha ?? 0, 0.001);
              const chartH = 105, rodape = 36;
              const yL = t.def.linha != null ? rodape + t.def.linha/maxV*chartH : null;
              return `<div style="margin:12px 0 2px; font-weight:800; font-size:12.5px; color:${cor}">${nome}</div>
                <div style="position:relative">
                  ${yL != null ? `<div style="position:absolute; left:0; right:0; bottom:${yL}px; border-top:1.5px dashed rgba(255,255,255,0.4); z-index:2; pointer-events:none"></div>
                  <div class="tnum" style="position:absolute; right:2px; bottom:${yL + 3}px; font-size:10px; color:var(--txt3); z-index:2; pointer-events:none">linha ${String(t.def.linha).replace(".",",")}</div>` : ""}
                  <div style="display:flex; align-items:flex-end; gap:5px; height:${chartH + rodape + 20}px">
                  ${pts.map(p => {
                    const h = Math.max(6, p.v/maxV*chartH);
                    return `<div style="flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%">
                      <div class="tnum" style="font-size:11px; font-weight:800; color:${p.hit ? cor : "var(--txt3)"}">${p.v}</div>
                      <div style="width:100%; max-width:40px; height:${h}px; border-radius:4px 4px 0 0; background:${p.hit ? cor : "rgba(255,255,255,0.10)"}; margin-top:2px"></div>
                      <div style="height:${rodape}px; display:flex; flex-direction:column; align-items:center; padding-top:4px; width:100%">
                        <span style="font-size:9px; color:var(--txt3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%">${p.adv}</span>
                        <span class="tnum" style="font-size:9px; color:var(--txt3)">${p.ts.slice(5).split("-").reverse().join("/")}</span>
                      </div></div>`;
                  }).join("")}
                  </div></div>`;
            };
            return `<div style="padding:2px 2px 14px; border-bottom:1px solid rgba(255,255,255,0.05)">
              ${bloco(t.pH, fx.home, "var(--acc)")}${bloco(t.pA, fx.away, "#FE2C55")}
              <div style="display:flex; gap:10px; margin-top:14px; flex-wrap:wrap">
                <button class="h2h-cardbtn" style="flex:1; min-width:180px; margin:0" onclick="abrirCardTendencia(${fi}, '${t.def.id}', 'grafico')">${svgIco("grafico")} Gerar card · gráfico</button>
                <button class="h2h-cardbtn" style="flex:1; min-width:180px; margin:0" onclick="abrirCardTendencia(${fi}, '${t.def.id}', 'numeros')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4M8 11l4 4 4-4M12 15V3"/></svg> Gerar card · números</button>
              </div>
            </div>`;
          };
          const rows = mostradas.map(t => {
            const key = "tend:" + t.def.id, aberto = state.rxChart === key;
            const hot = r => r.hit / r.n >= 0.7;
            const barra = (r, cls) => `<div class="rx-bar"><div class="rx-fill ${cls}" style="width:${r.hit/r.n*100}%"></div></div>`;
            return `<div class="rx-row rx-click ${aberto ? "rx-open" : ""}" title="Ver jogo a jogo" onclick="setRxChart('${key}')">
              <div class="rx-side"><span class="rx-val tnum" style="font-size:14px;${hot(t.rH) ? "" : "opacity:.5"}">${t.rH.hit}/${t.rH.n}</span>${barra(t.rH,"home")}</div>
              <div class="rx-label">${t.def.label} <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="opacity:.5; margin-left:5px; transform:rotate(${aberto ? 180 : 0}deg)"><path d="M6 9l6 6 6-6"/></svg></div>
              <div class="rx-side away">${barra(t.rA,"away")}<span class="rx-val tnum" style="font-size:14px;${hot(t.rA) ? "" : "opacity:.5"}">${t.rA.hit}/${t.rA.n}</span></div>
            </div>${painel(t)}`;
          }).join("");
          return `<div class="rx-group"><div class="rx-group-t">Tendências da partida</div>
            <div class="rx-sample" style="margin:2px 0 6px">todos os mercados varridos · só o que bateu 70%+ nos jogos recentes de pelo menos um time · ${quentes.length > MAXT ? `as ${MAXT} mais fortes de ${quentes.length} · ` : ""}toque numa linha pra ver o jogo a jogo</div>
            ${rows}</div>`;
        })()}`;
    } else {
      corpo = `<div class="empty-box" style="margin-top:6px">Um dos times ainda não tem jogos suficientes ${state.rxEscopo==="comp" ? (ehContinental ? "em copas continentais" : `no ${fx.competicao}`) : ""} pra calcular médias — em "Quais jogos?", troque pra "Todos os jogos".</div>`;
    }
    }
  }

  // faixa do árbitro (quando já designado) — SÓ na aba Números; nas outras é ruído
  const arb = (SEM.arbitros || {})[String(fx.id)];
  const numBR = v => v != null ? String(v).replace(".", ",") : null;
  const arbBar = tab === "stats" && arb && arb.nome ? `<button class="arb-bar click" onclick="state.arbJanela=10; state.arbEscopo='geral'; go('arbitro')">${svgIco("apito")} Árbitro: <b>${arb.nome}</b>${arb.amarelos != null ? ` · ${svgIco("cartaoAm")} ${numBR(arb.amarelos)} amarelos/jogo` : ""}${arb.faltas != null ? ` · ${numBR(arb.faltas)} faltas/jogo` : ""}${arb.jogos ? ` <span>(${arb.jogos} jogos na base)</span>` : ""}<span class="arb-go">ver perfil ›</span></button>` : "";

  const raioxBloco = `${tabsRow}${arbBar}${filtrosRow}<div class="rx-card" style="margin-top:14px">${teamsHead}${corpo}</div>`;

  // ----- Elencos: resumo (top 8) + expansor -----
  const elencoTable = (tid, nome, side) => {
    const lista = ELENCOS[String(tid)] || [];
    if (!lista.length) return "";
    const aberto = !!state.elencoAberto[side];
    const visiveis = aberto ? lista : lista.slice(0, 8);
    const rows = visiveis.map((j) => {
      const idx = lista.indexOf(j);
      return `
      <tr onclick="abrirJogador(${fi}, '${side}', ${idx})">
        <td class="left"><div class="pcell">
          <div class="avatar" style="width:30px;height:30px;border-radius:8px;font-size:11px;${avatarStyle(j.name.length*7)}">${fotoOuIniciais(j.name)}</div>
          <div><div class="nm" style="font-size:13px">${j.name}</div><div class="sm">${j.pos || "—"}</div></div>
        </div></td>
        <td class="tnum">${j.apps}</td>
        <td class="num amber tnum">${j.pos==="Goleiro" ? "—" : fmt(j.media)}</td>
        <td class="num acc tnum">${j.pos==="Goleiro" ? "—" : fmt(j.mediaOn)}</td>
        <td class="tnum">${j.faltasCom != null ? fmt(j.faltasCom) : "—"}</td>
        <td class="tnum">${j.faltasSof != null ? fmt(j.faltasSof) : "—"}</td>
      </tr>`;
    }).join("");
    return `<div class="section-h" style="margin-top:26px"><span class="lbl">Elenco · ${nome}</span><span class="count tnum">${lista.length} jogadores</span></div>
      <div class="tablewrap"><table style="min-width:600px">
        <thead><tr><th class="left">Jogador</th><th>Jogos</th><th>Finaliz./jogo</th><th>Chutes a gol</th><th>Faltas com.</th><th>Faltas sof.</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      ${lista.length > 8 ? `<button class="expand-btn" onclick="toggleElenco('${side}')">${aberto ? "Mostrar menos" : `Ver elenco completo (${lista.length})`}</button>` : ""}`;
  };
  // elencos só na aba Números (nas outras viram ruído)
  const elencos = (tab === "stats" && fx.homeId != null)
    ? elencoTable(fx.homeId, fx.home, "home") + elencoTable(fx.awayId, fx.away, "away")
    : "";

  el.innerHTML = `
    <button class="back" onclick="go('oportunidades')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg> Jogos da semana</button>
    <p class="eyebrow">${fx.competicao} · ${fmtHorario(fx.kickoff)}</p>
    <h1 class="page">${fx.home} x ${fx.away}</h1>
    ${raioxBloco}
    ${elencos}
    ${sourceNoteQI()}
  `;
}

/* ---------- AO VIVO — acompanhamento simulado (PRD v0.6 Tela 06 + v0.7 notificações) ---------- */
let sim = null;
function novaSimulacao(fi){
  const fx = FIXTURES[fi];
  return {
    fi, minute: 0, running: false, timer: null, events: [],
    players: fx.players.map((p, pi) => {
      const a = analisarJogador(p, fx.sedeNeutra);
      // sem odds: usa "linha provisória" derivada da projeção (floor(λ)+0.5)
      const line = a.destaque ? a.destaque.line : Math.floor(a.lambda) + 0.5;
      return { pi, name: p.name, team: p.team, lambda: a.lambda, line, price: a.destaque ? a.destaque.price : null, provisoria: !a.destaque, shots: 0, hit: false };
    }),
  };
}
function pausarSimulacao(){
  if (sim && sim.timer){ clearInterval(sim.timer); sim.timer = null; sim.running = false; }
}
function iniciarSimulacao(){
  if (!sim) sim = novaSimulacao(0);
  if (sim.running) return;
  if (sim.minute >= 90) sim = novaSimulacao(sim.fi);
  sim.running = true;
  sim.timer = setInterval(tickSimulacao, 650);
  renderAoVivo();
}
function reiniciarSimulacao(){
  pausarSimulacao();
  sim = novaSimulacao(sim ? sim.fi : 0);
  renderAoVivo();
}
function trocarJogoSimulado(fi){
  pausarSimulacao();
  sim = novaSimulacao(fi);
  renderAoVivo();
}
function tickSimulacao(){
  sim.minute++;
  sim.players.forEach(pl => {
    // processo de Poisson discretizado: prob. de finalizar neste minuto ≈ λ/90
    if (Math.random() < pl.lambda / 90){
      pl.shots++;
      const cruzouLinha = !pl.hit && pl.shots > pl.line;
      if (cruzouLinha) pl.hit = true;
      sim.events.unshift({
        min: sim.minute, milestone: cruzouLinha,
        text: cruzouLinha
          ? `${pl.name} finalizou. Total: ${pl.shots} — linha ${linhaMais(pl.line)} batida ✓`
          : `${pl.name} finalizou. Total: ${pl.shots} ${pl.shots===1?'finalização':'finalizações'}.`
      });
    }
  });
  if (sim.minute >= 90){
    pausarSimulacao();
    sim.events.unshift({ min: 90, milestone: true, text: "Fim de jogo. Resumo enviado aos usuários que acompanham." });
  }
  renderAoVivo();
}
function renderAoVivo(){
  if (state.view !== "aovivo") return;
  if (!sim) sim = novaSimulacao(0);
  const fx = FIXTURES[sim.fi];

  const seletor = FIXTURES.map((f, fi) =>
    `<button class="chip ${fi===sim.fi?'on':''}" onclick="trocarJogoSimulado(${fi})">${f.home} x ${f.away}</button>`).join("");

  const tracks = sim.players.map(pl => {
    const esperado = pl.lambda * sim.minute / 90;
    const pct = Math.min(pl.shots / (pl.line + 0.5) * 100, 100);
    const markPct = Math.min(pl.line / (pl.line + 0.5) * 100, 100);
    let status, cls;
    if (pl.hit){ status = "Linha batida ✓"; cls = "done"; }
    else if (sim.minute === 0){ status = "aguardando"; cls = ""; }
    else if (pl.shots >= esperado){ status = "no ritmo ↑"; cls = "ahead"; }
    else { status = "abaixo do ritmo ↓"; cls = "behind"; }
    return `<div class="track-card ${pl.hit?'hit':''}">
      <div class="track-top">
        <div class="avatar" style="width:34px;height:34px;border-radius:9px;font-size:12px;${avatarStyle(pl.name.length*7)}">${fotoOuIniciais(pl.name)}</div>
        <div class="nm">${pl.name}</div>
        <div class="status ${cls}">${status}</div>
      </div>
      <div class="track-line"><b>${linhaMais(pl.line)}</b> finalizações · ${pl.price ? fmt(pl.price,2) : "linha provisória"} · projeção ${fmt(pl.lambda,2)}</div>
      <div class="progress"><div class="mark" style="left:${markPct}%"></div><div class="fill" style="width:${pct}%"></div></div>
      <div class="track-nums"><span><b>${pl.shots}</b> finalizações</span><span>esperado até agora: ${fmt(esperado,1)}</span></div>
    </div>`;
  }).join("");

  const feed = sim.events.length
    ? sim.events.map(e => `<div class="feed-item ${e.milestone?'milestone':''}"><span class="min tnum">${e.min}'</span><span>${e.text}</span></div>`).join("")
    : `<div class="feed-empty">As notificações do jogo vão aparecer aqui — no app real, cada uma vira um push no celular do usuário.</div>`;

  el.innerHTML = `
    <p class="eyebrow">Acompanhamento · tempo real</p>
    <h1 class="page">Seus jogadores, lance a lance</h1>
    <p class="sub">Progresso de cada linha acompanhada durante o jogo, com notificação a cada finalização.</p>
    <div class="filters" style="margin-top:16px">${seletor}</div>
    <div class="live-head">
      <div class="live-clock tnum">${sim.minute}'</div>
      <div class="live-controls">
        ${sim.running
          ? `<button class="ctrl-btn" onclick="pausarSimulacao(); renderAoVivo()">Pausar</button>`
          : `<button class="ctrl-btn primary" onclick="iniciarSimulacao()">${sim.minute===0 ? "Iniciar simulação" : sim.minute>=90 ? "Simular de novo" : "Continuar"}</button>`}
        <button class="ctrl-btn" onclick="reiniciarSimulacao()">Reiniciar</button>
      </div>
      <span class="sim-badge">simulação — dados fictícios gerados pela projeção λ de cada jogador</span>
    </div>
    <div class="live-grid">
      <div>${tracks}</div>
      <div class="feed-panel">
        <div class="t"><span class="live"></span> Notificações</div>
        ${feed}
      </div>
    </div>
    ${sourceNoteQI()}
  `;
}

function render(){
  // telas de DETALHE escondem a barra de busca mobile — menos empilhamento no topo
  document.body.classList.toggle("tela-detalhe",
    ["jogo", "jogador", "arbitro", "time"].includes(state.view));
  if (state.view==="oportunidades") renderOportunidades();
  else if (state.view==="jogador") renderJogadorSimples();
  else if (state.view==="jogo") renderJogo();
  else if (state.view==="arbitro") renderArbitro();
  else if (state.view==="times") renderTimes();
  else if (state.view==="time") renderTime();
  else if (state.view==="search") renderSearch();
  else renderRanking();
}

/* ---------- theme ---------- */
function currentTheme(){
  const attr = document.documentElement.getAttribute("data-theme");
  if (attr) return attr;
  return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function setThemeIcon(){
  const dark = currentTheme()==="dark";
  document.getElementById("themeIcon").innerHTML = dark
    ? '<circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.2M12 19.8V22M2 12h2.2M19.8 12H22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M19.1 4.9l-1.6 1.6M6.5 17.5l-1.6 1.6"/>'
    : '<path d="M20 14.5A8 8 0 0 1 9.5 4 7 7 0 1 0 20 14.5z"/>';
}
function toggleTheme(){
  const next = currentTheme()==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  setThemeIcon();
}

function carregarGA(){
  if (window._gaOn) return; window._gaOn = true;
  const s = document.createElement("script");
  s.async = true; s.src = "https://www.googletagmanager.com/gtag/js?id=" + GA_ID;
  document.head.appendChild(s);
  window.dataLayer = window.dataLayer || [];
  window.gtag = function(){ dataLayer.push(arguments); };
  gtag("js", new Date());
  gtag("config", GA_ID);
}

function aceitarCookies(){ try{ localStorage.setItem("sc-cookies","sim"); }catch(e){} fecharCookieBanner(); carregarGA(); }
function recusarCookies(){ try{ localStorage.setItem("sc-cookies","nao"); }catch(e){} fecharCookieBanner(); }
function initCookies(){
  let escolha = null; try{ escolha = localStorage.getItem("sc-cookies"); }catch(e){}
  if (escolha === "sim") return carregarGA();
  if (escolha === "nao") return;
  const b = document.getElementById("cookieBanner"); if (b) b.style.display = "flex";
}

setThemeIcon();
go("oportunidades");
initCookies();
