  :root {
    /* neutrals carry a slight green bias — chosen, not defaulted */
    --bg: #080B09;
    --surface: #101613;
    --surface-2: #17211B;
    --surface-3: #1E2A23;
    --border: #26332C;
    --border-soft: #1E2922;
    --text: #EAF2EC;
    --text-dim: #93A399;
    --muted: #64756B;
    /* on-target green = the brand's "acerto" */
    --acc: #2FD08A;
    --acc-strong: #1FB374;
    --acc-soft: rgba(47,208,138,0.14);
    /* total shots = warm amber, second data hue distinct from accent */
    --amber: #F0B14A;
    --amber-soft: rgba(240,177,74,0.14);
    --danger: #F2585E;
    --track: #202B24;

    --shadow: 0 1px 0 rgba(255,255,255,0.03), 0 12px 32px -12px rgba(0,0,0,0.6);
    --radius: 14px;
    --radius-sm: 9px;

    --f-ui: "SF Pro Text", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --f-display: "Barlow Condensed", "SF Pro Display", system-ui, sans-serif;
    --f-mono: "SF Mono", "JetBrains Mono", "Roboto Mono", ui-monospace, "Menlo", monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #F1F5F2;
      --surface: #FFFFFF;
      --surface-2: #F5F9F6;
      --surface-3: #EAF1EC;
      --border: #DCE6DF;
      --border-soft: #E6EDE8;
      --text: #0C1512;
      --text-dim: #566259;
      --muted: #7B887F;
      --acc: #10A566;
      --acc-strong: #0C8E56;
      --acc-soft: rgba(16,165,102,0.12);
      --amber: #C9861A;
      --amber-soft: rgba(201,134,26,0.12);
      --track: #E6EDE8;
      --shadow: 0 1px 0 rgba(255,255,255,0.6), 0 14px 30px -16px rgba(20,40,30,0.24);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B0F0D; --surface: #111814; --surface-2: #17211B; --surface-3: #1E2A23;
    --border: #26332C; --border-soft: #1E2922; --text: #EAF2EC; --text-dim: #93A399;
    --muted: #64756B; --acc: #2FD08A; --acc-strong: #1FB374; --acc-soft: rgba(47,208,138,0.14);
    --amber: #F0B14A; --amber-soft: rgba(240,177,74,0.14); --track: #202B24;
    --shadow: 0 1px 0 rgba(255,255,255,0.03), 0 12px 32px -12px rgba(0,0,0,0.6);
  }
  :root[data-theme="light"] {
    --bg: #F1F5F2; --surface: #FFFFFF; --surface-2: #F5F9F6; --surface-3: #EAF1EC;
    --border: #DCE6DF; --border-soft: #E6EDE8; --text: #0C1512; --text-dim: #566259;
    --muted: #7B887F; --acc: #10A566; --acc-strong: #0C8E56; --acc-soft: rgba(16,165,102,0.12);
    --amber: #C9861A; --amber-soft: rgba(201,134,26,0.12); --track: #E6EDE8;
    --shadow: 0 1px 0 rgba(255,255,255,0.6), 0 14px 30px -16px rgba(20,40,30,0.24);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--f-ui);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    line-height: 1.45;
  }
  .tnum { font-variant-numeric: tabular-nums; }
  ::selection { background: var(--acc-soft); }

  /* ---------- direção de arte: tipografia de placar esportivo ---------- */
  h1.page, .hero h1, .brand .wordmark, .phead h1,
  .tile .big, .score-pill .n, .rx-val, .mv2-team .tn, .rx-team .tn,
  .opp-counter .n, .mv2-count .n, .rx-teams-head .tn {
    font-family: var(--f-display);
    font-weight: 700; letter-spacing: 0.01em;
  }
  h1.page, .hero h1, .phead h1 {
    text-transform: uppercase; font-weight: 800; letter-spacing: 0.005em; line-height: 0.98;
  }
  .tile .big, .score-pill .n, .rx-val, .opp-counter .n, .mv2-count .n {
    font-family: var(--f-display); font-weight: 700; letter-spacing: 0;
  }

  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }

  /* ---------- header ---------- */
  header {
    position: sticky; top: 0; z-index: 40;
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: saturate(1.4) blur(12px);
    border-bottom: 1px solid var(--border-soft);
  }
  .bar { display: flex; align-items: center; gap: 18px; height: 62px; }
  .brand { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
  .brand svg { display: block; }
  .brand .wordmark { font-size: 23px; text-transform: uppercase; letter-spacing: 0.02em; line-height: 1; }
  .brand .wordmark b { color: var(--acc); font-weight: 800; }
  .brand .tag {
    font-family: var(--f-mono); font-size: 9.5px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--muted); margin-top: 1px;
  }
  nav { display: flex; gap: 4px; margin-left: 6px; }
  .navbtn {
    appearance: none; border: 0; background: transparent; color: var(--text-dim);
    font-family: var(--f-display); font-size: 17px; font-weight: 700; cursor: pointer;
    text-transform: uppercase; letter-spacing: 0.03em;
    padding: 8px 13px; border-radius: 0; position: relative;
  }
  .navbtn:hover { color: var(--text); background: var(--surface-2); }
  .navbtn.active { color: var(--text); }
  .navbtn.active::after {
    content: ""; position: absolute; left: 13px; right: 13px; bottom: -1px; height: 2px;
    background: var(--acc); border-radius: 2px;
  }
  .spacer { flex: 1; }
  .icon-btn {
    appearance: none; width: 36px; height: 36px; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-dim);
    display: grid; place-items: center;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--muted); }

  main { padding: 30px 0 90px; }

  /* ---------- filter chips ---------- */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip {
    appearance: none; cursor: pointer; font-family: var(--f-ui); font-size: 12.5px; font-weight: 600;
    color: var(--text-dim); background: var(--surface); border: 1px solid var(--border);
    padding: 7px 13px; border-radius: 6px; white-space: nowrap; transition: none;
  }
  .chip:hover { color: var(--text); border-color: var(--muted); }
  .chip.on { color: #06130D; background: var(--acc); border-color: var(--acc); font-weight: 700; }
  :root[data-theme="light"] .chip.on, :root:not([data-theme]) .chip.on { color: #04140C; }
  .chip.locked { color: var(--muted); cursor: pointer; opacity: 0.9; }
  .chip.locked:hover { border-color: var(--amber); color: var(--text); }
  .chip .pro {
    font-family: var(--f-mono); font-size: 8.5px; letter-spacing: 0.1em; color: var(--amber);
    border: 1px solid var(--amber); border-radius: 4px; padding: 1px 4px; margin-left: 6px; vertical-align: 1px;
  }

  .eyebrow {
    font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 3px;
  }
  h1.page { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
  .sub { color: var(--text-dim); font-size: 14px; margin: 4px 0 0; }

  /* ---------- search ---------- */
  .searchbox { position: relative; margin: 22px 0 26px; max-width: 560px; }
  .searchbox svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .searchbox input {
    width: 100%; font-family: var(--f-ui); font-size: 16px; color: var(--text);
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px 14px 44px; outline: none;
  }
  .searchbox input::placeholder { color: var(--muted); }
  .searchbox input:focus { border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-soft); }

  .section-h { display: flex; align-items: baseline; justify-content: space-between; margin: 8px 0 14px; }
  .section-h .lbl { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
  .section-h .count { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 12px; }
  .card {
    text-align: left; cursor: pointer; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 15px; display: flex; flex-direction: column; gap: 12px;
    color: inherit; font-family: inherit;
  }
  .card:hover { border-color: var(--muted); transform: translateY(-2px); box-shadow: var(--shadow); }
  @media (prefers-reduced-motion: reduce) { .card:hover { transform: none; } }
  .card .top { display: flex; align-items: center; gap: 11px; }
  .avatar {
    width: 42px; height: 42px; border-radius: 11px; flex: none; display: grid; place-items: center;
    font-weight: 800; font-size: 15px; letter-spacing: -0.02em;
    background: var(--surface-3); color: var(--text); overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; display: block; }
  /* escudos/bandeiras: contain + respiro, pra imagem inteira caber na área */
  .crest img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .crest { overflow: hidden; padding: 7px; box-sizing: border-box; }
  .card .nm { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
  .card .meta { font-size: 12px; color: var(--text-dim); margin-top: 1px; display: flex; align-items: center; gap: 6px; }
  .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--muted); flex: none; }
  .card .stats { display: flex; gap: 0; border-top: 1px solid var(--border-soft); padding-top: 11px; }
  .card .stats > div { flex: 1; }
  .card .stats .k { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .card .stats .v { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; margin-top: 2px; }
  .v.amber { color: var(--amber); }
  .v.acc { color: var(--acc); }

  /* ---------- player profile ---------- */
  .back {
    appearance: none; background: transparent; border: 0; cursor: pointer; color: var(--text-dim);
    font-family: var(--f-ui); font-size: 13px; font-weight: 600; padding: 0; display: inline-flex;
    align-items: center; gap: 6px; margin-bottom: 18px;
  }
  .back:hover { color: var(--text); }

  .phead { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .phead .avatar { width: 66px; height: 66px; border-radius: 16px; font-size: 24px; }
  .phead h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.025em; margin: 0; }
  .phead .pmeta { display: flex; align-items: center; gap: 8px; color: var(--text-dim); font-size: 14px; margin-top: 3px; }
  .badge {
    font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-dim); border: 1px solid var(--border); border-radius: 6px; padding: 3px 7px;
  }

  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 24px 0; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 16px 15px; }
  .tile.hero-a { background: linear-gradient(180deg, var(--amber-soft), transparent 90%); }
  .tile.hero-b { background: linear-gradient(180deg, var(--acc-soft), transparent 90%); }
  .tile .k { font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); }
  .tile .big { font-size: 40px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; margin: 12px 0 6px; }
  .tile.hero-a .big { color: var(--amber); }
  .tile.hero-b .big { color: var(--acc); }
  .tile .foot { font-size: 12px; color: var(--muted); }
  .tile .foot b { color: var(--text-dim); font-weight: 700; }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 18px 20px; }
  .panel-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; flex-wrap: wrap; }
  .panel-h .t { font-weight: 700; font-size: 15px; }
  .panel-h .t small { color: var(--muted); font-weight: 600; font-size: 12px; margin-left: 6px; }
  .toggle { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; padding: 3px; gap: 2px; }
  .toggle button {
    appearance: none; border: 0; background: transparent; cursor: pointer; font-family: var(--f-ui);
    font-size: 12px; font-weight: 700; color: var(--text-dim); padding: 5px 11px; border-radius: 6px;
  }
  .toggle button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.15); }
  .toggle button.on.amber { color: var(--amber); }
  .toggle button.on.acc { color: var(--acc); }

  .chart { margin-top: 22px; }
  .bars { position: relative; display: flex; align-items: flex-end; gap: 10px; height: 190px; }
  .avgline { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--muted); opacity: 0.75; pointer-events: none; }
  .avgtag {
    position: absolute; right: 0; transform: translateY(-50%);
    font-family: var(--f-mono); font-size: 10px; color: var(--text-dim);
    background: var(--surface); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--border-soft);
  }
  .bar-col { position: relative; flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; min-width: 0; }
  .bar-num { font-family: var(--f-mono); font-size: 12px; font-weight: 700; color: var(--text-dim); margin-bottom: 6px; }
  .bar-stack {
    width: 100%; max-width: 40px; background: var(--track); border-radius: 6px 6px 3px 3px;
    display: flex; flex-direction: column; overflow: hidden;
    transition: height 0.55s cubic-bezier(0.22,1,0.36,1);
  }
  @media (prefers-reduced-motion: reduce) { .bar-stack { transition: none; } }
  .bar-on { width: 100%; background: var(--acc); }
  .bar-off { width: 100%; background: var(--amber); opacity: 0.92; }
  .xrow { display: flex; gap: 10px; margin-top: 9px; }
  .xrow > div { flex: 1; text-align: center; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .legend { display: flex; gap: 16px; margin-top: 16px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); }
  .swatch { width: 10px; height: 10px; border-radius: 3px; }

  /* ---------- ranking table ---------- */
  .tablewrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); }
  table { border-collapse: collapse; width: 100%; min-width: 640px; }
  thead th {
    text-align: right; font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--muted); font-weight: 600; padding: 13px 16px; border-bottom: 1px solid var(--border);
    white-space: nowrap; cursor: pointer; user-select: none;
  }
  thead th:first-child, thead th.left { text-align: left; }
  thead th.sortable:hover { color: var(--text); }
  thead th .arrow { color: var(--acc); margin-left: 3px; }
  tbody td { padding: 13px 16px; text-align: right; border-bottom: 1px solid var(--border-soft); font-size: 14px; }
  tbody td.left { text-align: left; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--surface-2); }
  tbody tr:last-child td { border-bottom: 0; }
  .rk { font-family: var(--f-mono); color: var(--muted); font-weight: 700; width: 34px; }
  .rk.top { color: var(--acc); }
  .pcell { display: flex; align-items: center; gap: 11px; }
  .pcell .avatar { width: 34px; height: 34px; border-radius: 9px; font-size: 12px; }
  .pcell .nm { font-weight: 700; font-size: 14px; }
  .pcell .sm { font-size: 11px; color: var(--text-dim); }
  .num { font-family: var(--f-ui); font-weight: 700; }
  .num.amber { color: var(--amber); }
  .num.acc { color: var(--acc); }
  .lg-pill { font-family: var(--f-mono); font-size: 10px; color: var(--text-dim); border: 1px solid var(--border); border-radius: 5px; padding: 3px 6px; }

  .empty { text-align: center; color: var(--muted); padding: 60px 20px; }
  .empty svg { opacity: 0.5; margin-bottom: 10px; }

  .foot-note {
    margin-top: 26px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-family: var(--f-mono); font-size: 11px; color: var(--muted); letter-spacing: 0.02em;
  }
  .foot-note .live { width: 7px; height: 7px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 0 3px var(--acc-soft); }

  /* ---------- Motor QI: pills, opportunity cards, market table ---------- */
  .score-pill {
    display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
    min-width: 46px; height: 46px; border-radius: 11px; font-family: var(--f-mono);
    background: var(--surface-2); border: 1px solid var(--border);
  }
  .score-pill .n { font-size: 15px; font-weight: 800; line-height: 1; }
  .score-pill .l { font-size: 8px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
  .score-pill.hi { border-color: color-mix(in srgb, var(--acc) 55%, var(--border)); background: var(--acc-soft); }
  .score-pill.hi .n { color: var(--acc); }
  .score-pill.md .n { color: var(--amber); }
  .score-pill.md { border-color: color-mix(in srgb, var(--amber) 45%, var(--border)); background: var(--amber-soft); }
  .score-pill.lo .n { color: var(--text-dim); }

  .neutral-badge {
    font-family: var(--f-mono); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); border: 1px dashed var(--border); border-radius: 5px; padding: 2px 6px;
  }

  .opp-card {
    display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px; cursor: pointer;
  }
  .opp-card:hover { border-color: var(--muted); }
  .opp-card .info { flex: 1; min-width: 0; }
  .opp-card .nm { font-weight: 700; font-size: 15px; }
  .opp-card .meta { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .opp-card .market { font-size: 12px; color: var(--text-dim); margin-top: 4px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .opp-card .market b { color: var(--text); font-weight: 700; }
  .opp-card .odd-chip {
    font-family: var(--f-mono); font-size: 11px; color: var(--text-dim); border: 1px solid var(--border);
    border-radius: 5px; padding: 1px 6px;
  }
  .opp-card .scores { display: flex; gap: 6px; flex: none; }

  .fixture-h {
    display: flex; align-items: center; gap: 10px; margin: 22px 0 12px;
    font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
  }
  .fixture-h .line { flex: 1; height: 1px; background: var(--border-soft); }

  .qi-hero { display: flex; gap: 12px; margin: 20px 0; }
  .qi-hero .score-pill { flex: 1; height: 74px; border-radius: var(--radius); }
  .qi-hero .score-pill .n { font-size: 26px; }
  .qi-hero .score-pill .l { font-size: 9.5px; margin-top: 5px; }

  .dna-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; margin: 18px 0; }
  .dna-panel .t { font-weight: 700; font-size: 14px; margin-bottom: 10px; }
  .dna-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--border-soft); font-size: 13px; }
  .dna-row:last-child { border-bottom: 0; }
  .dna-row .k { color: var(--text-dim); }
  .dna-row .v { font-family: var(--f-mono); font-weight: 700; }
  .dna-row .v.up { color: var(--acc); }
  .dna-row .v.down { color: var(--danger); }
  .dna-row .v.flat { color: var(--muted); }

  .mkt-table { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); margin: 18px 0; }
  .mkt-table table { border-collapse: collapse; width: 100%; min-width: 560px; }
  .mkt-table th {
    text-align: center; font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); padding: 11px 10px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  .mkt-table th:first-child { text-align: left; }
  .mkt-table td { text-align: center; padding: 10px; border-bottom: 1px solid var(--border-soft); font-size: 13px; }
  .mkt-table td:first-child { text-align: left; font-weight: 700; }
  .mkt-table tr:last-child td { border-bottom: 0; }
  .mkt-table tr.destaque { background: var(--acc-soft); }
  .book-tag { font-family: var(--f-mono); font-size: 10px; color: var(--muted); }

  /* ---------- Múltiplas ---------- */
  .target-row { display: flex; align-items: center; gap: 10px; margin: 18px 0 24px; flex-wrap: wrap; }
  .target-row label { font-size: 13px; color: var(--text-dim); }
  .target-input {
    width: 84px; font-family: var(--f-mono); font-size: 14px; color: var(--text); background: var(--surface);
    border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px; outline: none;
  }
  .target-input:focus { border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-soft); }
  .target-note { font-size: 12px; color: var(--text-dim); }
  .target-note b { color: var(--text); }

  .fixture-group { margin-bottom: 22px; }
  .fixture-group-h {
    display: flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: 11px;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
  }
  .leg-row {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--border);
    border-radius: var(--radius-sm); background: var(--surface); cursor: pointer; margin-bottom: 8px;
  }
  .leg-row:hover { border-color: var(--muted); }
  .leg-row.selected { border-color: color-mix(in srgb, var(--acc) 55%, var(--border)); background: var(--acc-soft); }
  .leg-check {
    width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--border); flex: none;
    display: grid; place-items: center; color: var(--acc);
  }
  .leg-row.selected .leg-check { border-color: var(--acc); background: var(--acc); color: #06130D; }
  .leg-info { flex: 1; min-width: 0; }
  .leg-info .nm { font-weight: 700; font-size: 14px; }
  .leg-info .mk { font-size: 12px; color: var(--text-dim); margin-top: 1px; }
  .leg-scores { display: flex; gap: 5px; flex: none; }
  .leg-scores .mini { font-family: var(--f-mono); font-size: 11px; padding: 3px 7px; border-radius: 6px; border: 1px solid var(--border); }

  .corr-warning {
    display: flex; align-items: center; gap: 8px; background: var(--amber-soft); border: 1px solid color-mix(in srgb, var(--amber) 45%, var(--border));
    border-radius: var(--radius-sm); padding: 10px 14px; font-size: 13px; color: var(--text); margin-bottom: 16px;
  }

  .mult-summary {
    position: sticky; bottom: 16px; margin-top: 22px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow);
  }
  .mult-summary-top { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .mult-odd { flex: 1; min-width: 140px; }
  .mult-odd .k { font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .mult-odd .v { font-size: 32px; font-weight: 800; color: var(--acc); letter-spacing: -0.02em; }
  .mult-scores { display: flex; gap: 8px; }
  .use-btn {
    appearance: none; border: 0; cursor: pointer; background: var(--acc); color: #06130D; font-weight: 800;
    font-size: 14px; padding: 12px 20px; border-radius: 10px; font-family: var(--f-ui);
  }
  .use-btn:hover { background: var(--acc-strong); }
  .use-btn:disabled { opacity: 0.4; cursor: not-allowed; background: var(--muted); }
  .use-confirm {
    margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border-soft); font-size: 12px; color: var(--acc);
    display: flex; align-items: center; gap: 6px;
  }

  /* ---------- Jogos ---------- */
  .match-card {
    display: flex; align-items: center; gap: 16px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 20px; cursor: pointer; margin-bottom: 12px;
  }
  .match-card:hover { border-color: var(--muted); }
  .match-card .teams { flex: 1; min-width: 0; }
  .match-card .teams .t { font-weight: 800; font-size: 17px; letter-spacing: -0.01em; }
  .match-card .teams .meta { font-size: 12px; color: var(--text-dim); margin-top: 3px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .match-card .best { text-align: right; flex: none; }
  .match-card .best .k { font-family: var(--f-mono); font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .match-card .best .v { font-weight: 700; font-size: 14px; margin-top: 2px; }

  /* ---------- Ao vivo ---------- */
  .live-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 18px 0; }
  .live-clock {
    font-family: var(--f-mono); font-size: 26px; font-weight: 800; color: var(--acc);
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 8px 16px; min-width: 76px; text-align: center;
  }
  .live-controls { display: flex; gap: 8px; }
  .ctrl-btn {
    appearance: none; cursor: pointer; font-family: var(--f-ui); font-weight: 700; font-size: 13px;
    color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 9px 15px;
  }
  .ctrl-btn:hover { border-color: var(--muted); }
  .ctrl-btn.primary { background: var(--acc); border-color: var(--acc); color: #06130D; }
  .ctrl-btn.primary:hover { background: var(--acc-strong); }
  .sim-badge {
    font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--amber); border: 1px dashed color-mix(in srgb, var(--amber) 55%, var(--border)); border-radius: 6px; padding: 4px 8px;
  }
  .live-grid { display: grid; grid-template-columns: 1fr 340px; gap: 16px; align-items: start; }
  @media (max-width: 860px) { .live-grid { grid-template-columns: 1fr; } }

  .track-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
  .track-card.hit { border-color: color-mix(in srgb, var(--acc) 60%, var(--border)); background: var(--acc-soft); }
  .track-top { display: flex; align-items: center; gap: 11px; }
  .track-top .nm { font-weight: 700; font-size: 14px; flex: 1; }
  .track-top .status { font-family: var(--f-mono); font-size: 11px; font-weight: 700; }
  .status.ahead { color: var(--acc); }
  .status.behind { color: var(--danger); }
  .status.done { color: var(--acc); }
  .track-line { font-size: 12px; color: var(--text-dim); margin: 3px 0 10px; }
  .track-line b { color: var(--text); }
  .progress { height: 8px; border-radius: 4px; background: var(--track); overflow: hidden; position: relative; }
  .progress .fill { height: 100%; background: var(--acc); border-radius: 4px; transition: width 0.4s ease; }
  .progress .mark { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--amber); }
  .track-nums { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 11px; color: var(--muted); margin-top: 6px; }
  .track-nums b { color: var(--text); }

  .feed-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; max-height: 520px; overflow-y: auto; }
  .feed-panel .t { font-weight: 700; font-size: 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .feed-item {
    display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border-soft);
    font-size: 13px; line-height: 1.4; animation: feedin 0.35s ease;
  }
  .feed-item:last-child { border-bottom: 0; }
  .feed-item .min { font-family: var(--f-mono); font-weight: 800; color: var(--acc); flex: none; width: 34px; }
  .feed-item.milestone .min { color: var(--amber); }
  .feed-empty { color: var(--muted); font-size: 13px; padding: 12px 0; }
  @keyframes feedin { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .feed-item { animation: none; } .progress .fill { transition: none; } }

  /* ---------- Home "Hoje" (v2, match-centric) ---------- */
  .hero {
    /* faixa "cabeçalho de transmissão": borda-esquerda de acento + tarja escura */
    background: linear-gradient(100deg, #0A0F0C, #0B120E 60%, #0A0F0C);
    border: 1px solid var(--border-soft); border-left: 4px solid var(--acc);
    border-radius: 4px; padding: 30px 28px; margin-top: 4px; color: #EAF2EC;
    position: relative; overflow: hidden;
  }
  .hero h1 { font-size: 52px; margin: 0 0 8px; color: #fff; }
  .hero .sub2 { font-size: 15px; color: #93A399; margin: 0; max-width: 380px; line-height: 1.5; }
  .hero .sub2 b { color: var(--acc); font-weight: 700; }
  .hero-row { display: flex; gap: 24px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .opp-counter {
    display: flex; align-items: center; gap: 16px; background: rgba(47,208,138,0.06);
    border: 1px solid color-mix(in srgb, var(--acc) 30%, transparent);
    border-radius: 4px; padding: 16px 22px; min-width: 210px;
  }
  .opp-counter svg { flex: none; }
  .opp-counter .n { font-size: 46px; color: var(--acc); line-height: 0.9; }
  .opp-counter .l { font-size: 12px; color: #93A399; line-height: 1.3; margin-top: 3px; text-transform: uppercase; letter-spacing: 0.04em; }

  /* ---------- agenda por dia ---------- */
  .day-block { margin-bottom: 30px; }
  .day-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
  .day-lbl { font-family: var(--f-display); font-weight: 800; text-transform: uppercase; font-size: 26px; letter-spacing: 0.01em; color: var(--text); }
  .day-date { font-family: var(--f-mono); font-size: 12px; color: var(--acc); text-transform: uppercase; letter-spacing: 0.04em; }
  .day-line { flex: 1; height: 1px; background: var(--border); }
  .day-count { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }

  /* ---------- rodada estilo tabela de transmissão ---------- */
  .comp-block { margin-bottom: 18px; }
  .comp-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    padding: 0 2px 8px; border-bottom: 2px solid var(--acc); margin-bottom: 2px;
  }
  .comp-name {
    font-family: var(--f-display); font-weight: 800; text-transform: uppercase;
    font-size: 20px; letter-spacing: 0.03em; color: var(--text);
  }
  .comp-count { font-family: var(--f-mono); font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }
  .fx-list { display: flex; flex-direction: column; }
  .fx-row {
    appearance: none; cursor: pointer; text-align: left; width: 100%;
    display: grid; grid-template-columns: 56px 1fr auto 1fr 22px; align-items: center; gap: 12px;
    background: transparent; border: 0; border-bottom: 1px solid var(--border-soft);
    padding: 15px 6px; color: inherit; font-family: inherit; transition: background 0.12s;
  }
  .fx-row:hover { background: var(--surface-2); }
  .fx-time {
    font-family: var(--f-mono); font-size: 13px; font-weight: 700; color: var(--acc);
    border-right: 1px solid var(--border); padding-right: 12px;
  }
  .fx-team { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .fx-team.home { justify-content: flex-end; }
  .fx-team.away { justify-content: flex-start; }
  .fx-name { font-family: var(--f-display); font-weight: 700; font-size: 19px; letter-spacing: 0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fx-team .crest { width: 34px; height: 34px; border-radius: 8px; flex: none; display: grid; place-items: center; font-size: 12px; overflow: hidden; background: var(--surface-3); }
  .fx-x { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
  .fx-go { color: var(--muted); display: grid; place-items: center; }
  .fx-row:hover .fx-go { color: var(--acc); }
  @media (max-width: 560px) {
    .fx-row { grid-template-columns: 46px 1fr auto 1fr 18px; gap: 8px; padding: 13px 4px; }
    .fx-name { font-size: 16px; }
    .fx-team .crest { width: 28px; height: 28px; }
  }

  .mv2 { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-top: 14px; }
  .mv2-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .mv2-league { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); display: flex; align-items: center; gap: 7px; }
  .mv2-time { font-family: var(--f-mono); font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .mv2-body { display: flex; gap: 22px; align-items: stretch; flex-wrap: wrap; }
  .mv2-teams { display: flex; align-items: center; gap: 16px; flex: 1; min-width: 220px; }
  .mv2-team { text-align: center; width: 96px; }
  .mv2-team .crest {
    width: 58px; height: 58px; border-radius: 15px; margin: 0 auto 8px; display: grid; place-items: center;
    font-weight: 800; font-size: 17px; letter-spacing: -0.02em; background: var(--surface-3);
  }
  .mv2-team .tn { font-weight: 700; font-size: 14px; }
  .mv2-x { color: var(--muted); font-weight: 600; font-size: 15px; }
  .mv2-right { flex: 1.2; min-width: 250px; display: flex; flex-direction: column; gap: 10px; }
  .mv2-count { display: flex; align-items: baseline; gap: 8px; }
  .mv2-count .n { font-size: 28px; font-weight: 800; color: var(--acc); line-height: 1; }
  .mv2-count .n.zero { color: var(--muted); }
  .mv2-count .l { font-size: 13.5px; color: var(--text-dim); line-height: 1.25; }
  .best-box { background: var(--acc-soft); border: 1px solid color-mix(in srgb, var(--acc) 35%, var(--border)); border-radius: var(--radius-sm); padding: 11px 14px; }
  .best-box .k { font-size: 12px; color: var(--acc-strong); font-weight: 700; margin-bottom: 3px; }
  .best-box .p { font-weight: 800; font-size: 15px; }
  .best-box .o { font-size: 13px; color: var(--text-dim); margin-top: 3px; display: flex; align-items: center; gap: 8px; }
  .tag-valor { font-family: var(--f-mono); font-size: 10px; font-weight: 700; letter-spacing: 0.08em; color: var(--acc-strong); }
  .empty-box { background: var(--surface-2); border: 1px solid var(--border-soft); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 13px; color: var(--text-dim); }
  .ver-btn {
    appearance: none; border: 0; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--acc-strong); color: #fff; font-family: var(--f-ui); font-weight: 800; font-size: 14.5px;
    padding: 12px 16px; border-radius: 10px;
  }
  .ver-btn:hover { background: var(--acc); color: #06130D; }

  /* ---------- raio-x comparativo ---------- */
  .rx-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 20px 14px; margin-top: 20px; }
  .rx-teams-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .rx-team { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 15px; }
  .rx-team .crest { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; font-size: 13px; }
  .rx-vs { font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .rx-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .rx-dot.home { background: var(--acc); }
  .rx-dot.away { background: var(--amber); }
  .rx-sample { text-align: center; font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); margin-bottom: 6px; }
  .rx-group { margin-top: 14px; }
  .rx-group-t {
    font-family: var(--f-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--acc-strong); padding-bottom: 6px; border-bottom: 1px solid var(--border-soft); margin-bottom: 4px;
  }
  .expand-btn {
    appearance: none; border: 1px solid var(--border); background: var(--surface); color: var(--text-dim);
    cursor: pointer; font-family: var(--f-ui); font-weight: 600; font-size: 13px;
    width: 100%; padding: 10px; border-radius: 10px; margin-top: 8px;
  }
  .expand-btn:hover { color: var(--text); border-color: var(--muted); }

  /* ---------- caixinhas estilo bet365 (últimos jogos do jogador) ---------- */
  .bx { min-width: 26px; height: 26px; padding: 0 4px; display: inline-grid; place-items: center;
    background: var(--surface-2); border: 1px solid var(--border-soft); border-radius: 6px;
    font-family: var(--f-mono); font-size: 12.5px; font-weight: 700; color: var(--muted);
    position: relative; cursor: default; }
  /* tooltip: contra quem foi aquele jogo */
  .bx[data-tip]:hover::after {
    content: attr(data-tip);
    position: absolute; bottom: calc(100% + 7px); left: 50%; transform: translateX(-50%);
    background: var(--surface); color: var(--text); border: 1px solid var(--border);
    font-family: var(--f-ui); font-size: 12px; font-weight: 600; white-space: nowrap;
    padding: 5px 9px; border-radius: 7px; box-shadow: 0 4px 14px rgba(0,0,0,.45);
    z-index: 50; pointer-events: none;
  }
  .bx[data-tip]:hover::before {
    content: ""; position: absolute; bottom: calc(100% + 2px); left: 50%; transform: translateX(-50%) rotate(45deg);
    width: 9px; height: 9px; background: var(--surface); border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
    z-index: 51; pointer-events: none;
  }
  .bx.hit { color: var(--amber); background: color-mix(in srgb, var(--amber) 12%, transparent); border-color: color-mix(in srgb, var(--amber) 30%, var(--border-soft)); }
  .bx.last { border-width: 2px; border-color: var(--amber); font-weight: 800; }
  .b365 { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-top: 22px; }
  .b365-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .b365-t { font-weight: 800; font-size: 15px; }
  .b365-sel { appearance: none; background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    font-family: var(--f-ui); font-weight: 700; font-size: 13.5px; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
  .b365-sub { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); margin-left: auto; }
  .b365-row { appearance: none; border: 0; background: transparent; cursor: pointer; width: 100%;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 6px; border-bottom: 1px solid var(--border-soft); border-radius: 8px; }
  .b365-row:hover { background: var(--surface-2); }
  .b365-row:last-child { border-bottom: 0; }
  .b365-nome { font-family: var(--f-ui); font-weight: 700; font-size: 14px; color: var(--text); text-align: left;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .b365-bxs { display: flex; gap: 5px; flex: none; }

  /* faixas de caixinhas + extrato do perfil do jogador */
  .jg-strip { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  .jg-strip-l { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); width: 110px; flex: none; }
  .jg-strip-bxs { display: flex; gap: 5px; flex-wrap: wrap; }
  .jg-list { margin-top: 6px; }
  .jg-game { display: grid; grid-template-columns: 66px 1fr auto auto; gap: 12px; align-items: center;
    padding: 10px 4px; border-bottom: 1px solid var(--border-soft); font-size: 13px; }
  .jg-game:last-child { border-bottom: 0; }
  .jg-date { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
  .jg-adv { color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .jg-min { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
  .jg-vals { font-size: 12.5px; color: var(--text-dim); white-space: nowrap; }
  .jg-vals b { font-weight: 800; }
  .jg-vals .amber { color: var(--amber); } .jg-vals .acc { color: var(--acc); }

  /* ---------- escalações (campinho estilo broadcast) ---------- */
  .esc-pitch {
    position: relative; margin-top: 12px; min-height: 430px;
    display: flex; flex-direction: column; justify-content: space-between; gap: 8px;
    background:
      radial-gradient(circle at 50% 118%, rgba(255,255,255,0.05) 0 11%, transparent 11.5%),
      repeating-linear-gradient(180deg, rgba(47,208,138,0.10) 0 54px, rgba(47,208,138,0.05) 54px 108px),
      linear-gradient(180deg, #0D1A12, #0B1710);
    border: 1px solid color-mix(in srgb, var(--acc) 30%, var(--border-soft));
    border-radius: 12px; padding: 22px 4px 16px;
    overflow: hidden;
  }
  /* linhas do campo: contorno + meia-lua superior + grande área embaixo */
  .esc-marks, .esc-marks::before, .esc-marks::after { position: absolute; pointer-events: none; border: 1.5px solid rgba(255,255,255,0.10); }
  .esc-marks { inset: 9px; border-radius: 8px; }
  .esc-marks::before { content: ""; left: 50%; top: -1.5px; transform: translateX(-50%);
    width: 34%; height: 13%; border-top: 0; border-radius: 0 0 999px 999px; }
  .esc-marks::after { content: ""; left: 50%; bottom: -1.5px; transform: translateX(-50%);
    width: 52%; height: 15%; border-bottom: 0; border-radius: 6px 6px 0 0; }
  .esc-row { display: flex; justify-content: space-evenly; position: relative; z-index: 1; }
  .esc-p { appearance: none; border: 0; background: transparent; padding: 0; font: inherit;
    width: 68px; min-width: 0; text-align: center; position: relative; }
  .esc-p.click { cursor: pointer; }
  .esc-p.click:hover .esc-dot { transform: scale(1.12); box-shadow: 0 4px 14px rgba(0,0,0,.5); }
  .esc-dot { width: 46px; height: 46px; border-radius: 50%; margin: 0 auto; overflow: hidden; position: relative;
    background: var(--surface); border: 2px solid var(--acc); transition: transform .12s ease;
    display: grid; place-items: center; font-family: var(--f-mono); font-weight: 800; font-size: 14px; color: var(--acc); }
  .esc-dot img { width: 100%; height: 100%; object-fit: cover; }
  .esc-nm { font-family: var(--f-ui); font-size: 10px; font-weight: 600; line-height: 1.25; margin: 5px auto 0;
    max-width: 66px; padding: 2px 6px; border-radius: 5px;
    background: rgba(5,10,7,0.62); color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .esc-nm b { font-family: var(--f-mono); font-size: 9.5px; color: var(--muted); font-weight: 800; }
  .esc-pitch.away .esc-dot { border-color: var(--amber); color: var(--amber); }
  /* desfalque confirmado */
  .esc-p.out .esc-dot { border-color: #E05A4E; filter: grayscale(.85); opacity: .8; }
  .esc-p.out .esc-nm { text-decoration: line-through; color: var(--muted); }
  .esc-x { position: absolute; inset: 0; display: grid; place-items: center;
    background: rgba(224,90,78,0.30); color: #FF8A7E; font-weight: 800; font-size: 18px; }
  .esc-desf { margin-top: 10px; font-size: 12.5px; color: var(--text-dim); background: color-mix(in srgb, #E05A4E 10%, transparent);
    border: 1px solid color-mix(in srgb, #E05A4E 30%, var(--border-soft)); border-radius: 8px; padding: 9px 12px; }
  .esc-desf span { color: var(--muted); }

  /* ---------- abas da tela do jogo (Números / Confronto / Quentes) ---------- */
  .jogo-tabs { display: flex; margin: 18px 0 4px; border-bottom: 1px solid var(--border-soft); }
  .jogo-tab {
    appearance: none; border: 0; background: transparent; cursor: pointer; flex: 1;
    font-family: var(--f-ui); font-weight: 700; font-size: 14px; color: var(--muted);
    padding: 11px 6px; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
  }
  .jogo-tab:hover { color: var(--text-dim); }
  .jogo-tab.on { color: var(--acc); border-bottom-color: var(--acc); }
  @media (max-width: 520px){ .jogo-tab { font-size: 12.5px; padding: 10px 2px; } }
  /* ---------- sidebar de ligas (desktop) ---------- */
  .home-grid { display: flex; gap: 24px; align-items: flex-start; }
  .home-main { flex: 1; min-width: 0; }
  .liga-side { display: none; }
  @media (min-width: 1150px){
    .liga-side { display: block; width: 236px; flex: none; position: sticky; top: 78px;
      max-height: calc(100vh - 100px); overflow-y: auto; padding: 4px 6px 20px 0;
      scrollbar-width: thin; }
    .filtros-mobile { display: none !important; }  /* no desktop, o sidebar assume */
  }
  .ls-h { font-family: var(--f-mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); margin: 18px 0 6px 8px; }
  .ls-h:first-child { margin-top: 4px; }
  .ls-item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    appearance: none; background: transparent; border: 0; cursor: pointer;
    padding: 8px 8px; border-radius: 8px; color: var(--text-dim);
    font-family: var(--f-ui); font-size: 13px; font-weight: 600; }
  .ls-item:hover { background: var(--surface); color: var(--text); }
  .ls-item.on { background: var(--acc-soft); color: var(--acc); }
  .ls-nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ls-item .n { margin-left: auto; font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); flex: none; }
  .ls-pin { flex: none; color: var(--muted); font-size: 13px; padding: 0 2px; opacity: 0; transition: opacity .12s; }
  .ls-item:hover .ls-pin { opacity: 1; }
  .ls-pin.on { color: var(--amber); opacity: 1; }

  /* seletor de competições na home (fileira rolável) */
  .comp-scroll { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; padding-bottom: 6px;
    -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .comp-scroll::-webkit-scrollbar { display: none; }
  .comp-scroll .chip { flex: none; white-space: nowrap; }
  .chip-n { display: inline-block; margin-left: 5px; padding: 0 6px; border-radius: 999px;
    background: rgba(0,0,0,0.25); font-family: var(--f-mono); font-size: 10.5px; font-weight: 800; }
  .chip:not(.on) .chip-n { background: var(--surface-2); color: var(--muted); }

  /* faixa do árbitro na tela do jogo */
  .arb-bar { margin-top: 10px; padding: 9px 13px; font-size: 13px; color: var(--text-dim);
    background: var(--surface-2); border: 1px solid var(--border-soft); border-radius: 9px;
    width: 100%; text-align: left; font-family: var(--f-ui); display: block; }
  .arb-bar.click { cursor: pointer; appearance: none; }
  .arb-bar.click:hover { border-color: var(--acc); background: var(--acc-soft); }
  .arb-bar b { color: var(--text); }
  .arb-bar span { color: var(--muted); font-size: 12px; }
  .arb-go { float: right; color: var(--acc); font-weight: 700; font-size: 12px !important; }

  /* rótulo-pergunta dos grupos de filtro */
  .jogo-filtros { margin-top: 10px; }
  .qlabel { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 12px 0 7px; }
  .jogo-filtros .qlabel:first-child { margin-top: 2px; }

  /* ---------- confronto direto (H2H) ---------- */
  .h2h-tally { display: flex; align-items: stretch; text-align: center; gap: 8px; margin: 6px 0 12px; }
  .h2h-col { flex: 1; background: var(--surface-2); border: 1px solid var(--border-soft); border-radius: var(--radius-sm); padding: 12px 6px; }
  .h2h-col .n { font-family: var(--f-mono); font-size: 30px; font-weight: 800; line-height: 1; }
  .h2h-col.home .n { color: var(--acc); }
  .h2h-col.away .n { color: var(--amber); }
  .h2h-col .l { font-size: 11px; color: var(--text-dim); line-height: 1.25; margin-top: 6px; text-transform: uppercase; letter-spacing: 0.03em; }
  .h2h-list { margin-top: 6px; }
  .h2h-row { display: grid; grid-template-columns: 58px 1fr auto; align-items: center; gap: 10px;
    padding: 9px 4px; border-bottom: 1px solid var(--border-soft); }
  .h2h-row:last-child { border-bottom: 0; }

/* =========================================================================
   MOTOR QI — engine (espelha PRD_MASTER_Sem_Chutes_v0.2.1_Motor_QI_Formulas.md)
   Dados de odds abaixo são REAIS, puxados da The Odds API em 2026-07-10
   (Copa do Mundo, Noruega x Inglaterra / Argentina x Suíça). Médias de
   temporada e fatores de contexto são ILUSTRATIVOS até a chave da
   API-Football ser conectada — marcados com "aprox:" nos comentários.
   ========================================================================= */

function mediaBase(jogosAtual, mediaAtual, mediaAnterior){
  const N_FULL = 10;
  const pesoAtual = Math.min(jogosAtual / N_FULL, 1.0);
  return pesoAtual * mediaAtual + (1 - pesoAtual) * mediaAnterior;
}
function multMinutos(minProjetados, minMediosTitular){
  return Math.min(minProjetados / minMediosTitular, 1.0);
}
function multMando(isHome, sedeNeutra){
  if (sedeNeutra) return 1.0;
  return isHome ? 1.12 : 0.93;
}
function multForma(mediaUltimos5, mediaTemporada){
  const PESO_RECENTE = 0.2;
  return (1 - PESO_RECENTE) * 1.0 + PESO_RECENTE * (mediaUltimos5 / mediaTemporada);
}
function multConfronto(mediaVsAdversario, mediaGeral, nJogos){
  const K = 8;
  const peso = nJogos / (nJogos + K);
  const fatorBruto = mediaVsAdversario / mediaGeral;
  return 1.0 + peso * (fatorBruto - 1.0);
}
function calcularLambda(p){
  const base = mediaBase(p.jogosTemporadaAtual, p.mediaTemporadaAtual, p.mediaTemporadaAnterior);
  return base
    * multMinutos(p.minutosProjetados, p.minutosMediosTitular)
    * p.multAdversario
    * multMando(p.isHome, p.sedeNeutra)
    * multForma(p.mediaUltimos5, p.mediaTemporadaAtual)
    * multConfronto(p.mediaVsAdversario, p.mediaTemporadaAtual, p.nJogosConfrontoDireto);
}
function fatorial(n){ let r=1; for(let i=2;i<=n;i++) r*=i; return r; }
function poissonPMF(k, lambda){ return Math.exp(-lambda) * Math.pow(lambda,k) / fatorial(k); }
function poissonSF(k, lambda){ // P(X > k)
  let cdf = 0;
  for (let i=0;i<=k;i++) cdf += poissonPMF(i, lambda);
  return 1 - cdf;
}
function probOver(linha, lambda){ return poissonSF(Math.floor(linha), lambda); }

function calcularQI(lambda, linha, desvioPadrao){
  const z = (lambda - linha) / desvioPadrao;
  const coefVariacao = desvioPadrao / lambda;
  const consistencia = 1 / (1 + coefVariacao);
  const qiBruto = z * consistencia;
  return Math.round((100 / (1 + Math.exp(-1.5 * qiBruto))) * 10) / 10;
}
function calcularConfianca(p){
  let score = 0;
  score += p.escalacaoConfirmada ? 40 : 10;
  score += Math.min(p.nJogosHistorico / 20, 1.0) * 30;
  score += p.estabilidadeLinha * 20;
  score += p.dadosConflitantes ? 0 : 10;
  return Math.round(score * 10) / 10;
}
function calcularValor(probModelo, oddDecimal){
  const probImplicita = 1 / oddDecimal;
  const edge = probModelo - probImplicita;
  const valor = 50 + (edge / 0.15) * 50;
  return Math.round(Math.max(0, Math.min(100, valor)) * 10) / 10;
}
function scoreClass(v){ return v >= 70 ? "hi" : v >= 45 ? "md" : "lo"; }

/* ============================================================================
   JOGOS DA SEMANA (Brasileirão, Série B, Copa do Brasil, Sul-Americana) —
   dados reais da API-Football (agregado temporada 2026, coleta 2026-07-28):
   top 3 finalizadores por time + defesa do adversário (cedidas últimos 6 jogos).
   Sem odds ainda: linhas de prop abrem ~1 dia antes do jogo — até lá o app
   mostra projeção λ + Confiança, e o Valor "acende" quando a linha abrir.
   Aproximações desta camada (até o History Service): desvio ≈ √λ (Poisson),
   forma recente e confronto direto neutros, temporada anterior = atual.
   ============================================================================ */
const SEM = window.SC_SEMANA || { fixtures: [] };
/* Elenco completo por time (todos com 30+ min em 2026) — pro detalhe do jogo */
const ELENCOS = SEM.elencos || {};
/* Confronto direto: últimos jogos entre as duas equipes, por fixture id */
const H2H = SEM.h2h || {};
/* Histórico jogo a jogo por jogador: { teamId: { nome: [{t,l,a,m,f,o,g,fc,fs,am,vm}] } } */
const JOG_HIST = SEM.jogHist || {};
/* v2b — catálogo de ligas: o app lê FLAGS (tipo/grupo), não IDs fixos.
   Fallback legado (71/72 liga · 11/13 continental) pra dados antigos. */
const LIGAS_CAT = SEM.ligas || {};
function ligaInfo(lid){ return LIGAS_CAT[String(lid)] || {}; }
function ehLigaRegular(lid){ const t = ligaInfo(lid).tipo; return t ? t === "liga" : (lid === 71 || lid === 72); }
function ehContinentalLiga(lid){ const t = ligaInfo(lid).tipo; return t ? t === "continental" : (lid === 11 || lid === 13); }
function ligasIrmas(lid){
  const g = ligaInfo(lid).grupo;
  if (g) return Object.keys(LIGAS_CAT).filter(k => LIGAS_CAT[k].tipo === "continental" && LIGAS_CAT[k].grupo === g).map(Number);
  return [11, 13];
}
function regiaoDe(lid){
  // filtro por COMPETIÇÃO (não por nacionalidade dos times):
  // Brasil = só competições brasileiras; Liberta/Sula ficam em Américas
  const g = ligaInfo(lid).grupo;
  if (g === "eu" || g === "uefa") return "eu";
  if (g === "am" || g === "concacaf" || g === "conmebol") return "am";
  return "br";
}
/* bandeira do país de cada competição (🏆 = continental) */
const BANDEIRA_LIGA = {
  648: "🇧🇷", 651: "🇧🇷", 657: "🇧🇷", 654: "🇧🇷",
  1122: "🏆", 1116: "🏆", 2: "🏆", 5: "🏆", 2286: "🏆", 1328: "🏆", 1479: "🏆", 1251: "🏆",

function bandeiraDe(lid){
  return BANDEIRA_LIGA[lid] || { br: "🇧🇷", eu: "🇪🇺", am: "🌎" }[regiaoDe(lid)] || "⚽";
}
function getHistJogador(tid, nome, janela, escopo, ligaId){
  let jogos = [...(((JOG_HIST[String(tid)] || {})[nome]) || [])];
  if (escopo === "comp" && ligaId){
    const CONT = [11, 13];
    jogos = CONT.includes(ligaId) ? jogos.filter(j => CONT.includes(j.l)) : jogos.filter(j => j.l === ligaId);
  }
  jogos.sort((a, b) => b.t.localeCompare(a.t)); // mais recente primeiro
  return janela ? jogos.slice(0, janela) : jogos;
}
const FIXTURES_SEMANA = SEM.fixtures.map(fx => ({
  id: String(fx.id), competicao: fx.competicao, sedeNeutra: false,
  home: fx.home, away: fx.away, kickoff: fx.kickoff,

  players: fx.players.map(p => ({
    name: p.name, team: p.team, pos: p.pos || "", isHome: p.isHome,
    mediaOn: p.mediaOn ?? null, gols: p.gols ?? null,
    mediaTemporadaAtual: p.media, jogosTemporadaAtual: p.apps, mediaTemporadaAnterior: p.media,
    minutosProjetados: p.minutosMedios, minutosMediosTitular: p.minutosMedios,

    bookmaker: null, odds: [],
  })),
})).sort((a,b) => new Date(a.kickoff) - new Date(b.kickoff));
/* Conceito simplificado (2026-07-28): o app é um buscador de estatística.
   Jogos-exemplo com odds saíram da navegação; Motor QI vira detalhe discreto. */
const FIXTURES = [...FIXTURES_SEMANA];
const RAIOX = SEM.raiox || {};
/* v2: estatísticas jogo a jogo (últimos 15) — médias calculadas no app
   conforme o filtro do usuário (janela de jogos + competição/geral). */
const RAIOX_RAW = SEM.raioxRaw || {};
function getJogosRx(tid, ligaId, janela, escopo){
  const reg = RAIOX_RAW[String(tid)];
  if (!reg) return [];
  // v3: histórico geral e por competição são listas separadas — "últimos 10 na
  // competição" busca nos jogos daquela liga, por mais antigos que sejam.
  // Copas continentais (decisão do Pedro, 2026-07-28): Sul-Americana e
  // Libertadores contam JUNTAS — times caem de uma pra outra no meio do ano.
  let jogos;
  if (escopo === "comp" && ligaId){
    jogos = ehContinentalLiga(ligaId)
      ? ligasIrmas(ligaId).flatMap(l => reg.liga?.[String(l)] || [])
      : [...(reg.liga?.[String(ligaId)] || [])];
  } else {
    jogos = [...(reg.geral || [])];
  }
  // ordena explicitamente do mais recente pro mais antigo (nunca confiar na ordem de chegada)
  if (jogos.length && jogos[0].ts) jogos.sort((a,b) => b.ts.localeCompare(a.ts));
  return jogos.slice(0, janela);
}
/* seletor do valor por jogo de cada estatística (usado no extrato do card) */
const STAT_SEL = {
  gols: j=>j.gols, golsSof: j=>j.golsSof,
  fin: j=>j.own.fin, finSof: j=>j.adv.fin,
  chutesGol: j=>j.own.chutesGol, chutesGolSof: j=>j.adv.chutesGol,
  cantos: j=>j.own.cantos, cantosSof: j=>j.adv.cantos,
  faltas: j=>j.own.faltas, faltasSof: j=>j.adv.faltas,
  amarelos: j=>j.own.amarelos, vermelhos: j=>j.own.vermelhos,
  posse: j=>j.own.posse, defesas: j=>j.own.defesas,
};
function computeRx(tid, ligaId, janela, escopo){
  const jogos = getJogosRx(tid, ligaId, janela, escopo);
  if (!jogos.length) return null;
  const inclui2025 = jogos.some(j => j.ts && j.ts < "2026");
  const med = sel => {
    const vals = jogos.map(sel).filter(v => v != null);
    return vals.length ? vals.reduce((a,b)=>a+b,0) / vals.length : null;
  };
  return {
    jogos: jogos.length, inclui2025,
    gols: med(j=>j.gols), golsSof: med(j=>j.golsSof),
    fin: med(j=>j.own.fin), finSof: med(j=>j.adv.fin),
    chutesGol: med(j=>j.own.chutesGol), chutesGolSof: med(j=>j.adv.chutesGol),
    cantos: med(j=>j.own.cantos), cantosSof: med(j=>j.adv.cantos),
    faltas: med(j=>j.own.faltas), faltasSof: med(j=>j.adv.faltas),
    amarelos: med(j=>j.own.amarelos), vermelhos: med(j=>j.own.vermelhos),
    posse: med(j=>j.own.posse), defesas: med(j=>j.own.defesas),
  };
}

/* Índice de jogadores reais pro Buscar/Ranking — 1 entrada por jogador,
   apontando pro próximo jogo dele (FIXTURES já ordenado por horário).
   Jogos-exemplo (Copa do Mundo com odds de 11/07) ficam FORA destas telas. */
const JOGADORES_REAIS = (() => {
  const seen = new Map();
  FIXTURES.forEach((fx, fi) => {
    [["home", fx.homeId, fx.home], ["away", fx.awayId, fx.away]].forEach(([side, tid, tname]) => {
      (ELENCOS[String(tid)] || []).forEach((j, idx) => {

        if (!seen.has(key)) seen.set(key, {
          name: j.name, team: tname, comp: fx.competicao, pos: j.pos, fi, side, idx,
          media: j.media, apps: j.apps, mediaOn: j.mediaOn ?? null,
          faltasCom: j.faltasCom ?? null, faltasSof: j.faltasSof ?? null,
        });
      });
    });
  });

const COMPETICOES = [...new Set(JOGADORES_REAIS.map(j => j.comp))];

/* pré-computa lambda e escolhe a "linha principal" por jogador.
   Correção do usuário (2026-07-11): a linha principal do mercado NÃO é a que
   maximiza QI+Valor (isso empurrava pra linhas óbvias tipo Over 0.5 com odd
   1.02 — "sem valor nenhum", nas palavras dele). O mercado real trata como
   "a linha" aquela com odd mais próxima de um equilíbrio (~1.85), perto de
   uma probabilidade implícita de ~54% — validado contra o dado real (Kane
   e Haaland → 3.5, Bellingham → 2.5, todos batendo com o que o usuário
   apontou de cabeça, sem eu falar o número antes). */
const ODD_LINHA_PRINCIPAL = 1.85;
function analisarJogador(p, sedeNeutra){
  const lambda = calcularLambda({...p, sedeNeutra});
  const analises = (p.odds || []).map(o => {
    const probModelo = probOver(o.line, lambda);
    const qi = calcularQI(lambda, o.line, p.desvioPadrao);
    const valor = calcularValor(probModelo, o.price);
    const confianca = calcularConfianca(p);
    return { ...o, probModelo, qi, valor, confianca };
  });
  // Sem odds ainda (linhas de prop abrem ~1 dia antes do jogo): destaque nulo,
  // o app mostra a projeção λ e a Confiança, e o Valor "acende" quando a linha abrir.
  const destaque = analises.length
    ? analises.reduce((best, cur) =>
        Math.abs(cur.price - ODD_LINHA_PRINCIPAL) < Math.abs(best.price - ODD_LINHA_PRINCIPAL) ? cur : best)
    : null;
  return { lambda, analises, destaque, confianca: calcularConfianca(p) };
}

function b365Bloco(){
  // times disponíveis (id → nome), na ordem da agenda
  const times = [];
  FIXTURES.forEach(fx => {
    [[fx.homeId, fx.home], [fx.awayId, fx.away]].forEach(([tid, nome]) => {
      if (tid != null && JOG_HIST[String(tid)] && !times.some(t => t.tid === tid)) times.push({ tid, nome });
    });
  });
  if (!times.length) return "";
  times.sort((a, b) => a.nome.localeCompare(b.nome));
  const tid = state.b365Team != null && times.some(t => String(t.tid) === String(state.b365Team))
    ? Number(state.b365Team) : times[0].tid;
  const stat = state.b365Stat || "f";
  const sel = stat === "o" ? (g => g.o) : (g => g.f);

  // jogadores do time com histórico, ordenados pela média no período
  const porNome = JOG_HIST[String(tid)] || {};
  const nav = new Map(JOGADORES_REAIS.filter(j => (j.side === "home" ? FIXTURES[j.fi].homeId : FIXTURES[j.fi].awayId) === tid).map(j => [j.name, j]));
  let jogadores = Object.entries(porNome).map(([nome, jogos]) => {
    const ult = [...jogos].sort((a,b)=>b.t.localeCompare(a.t)).slice(0, 5);
    return { nome, ult, media: ult.length ? ult.reduce((a,g)=>a+sel(g),0)/ult.length : 0, nav: nav.get(nome) };
  }).filter(j => j.ult.length >= 2);
  jogadores.sort((a, b) => b.media - a.media);
  const total = jogadores.length;
  const aberto = !!state.b365Todos;
  if (!aberto) jogadores = jogadores.slice(0, 10);

  const optT = times.map(t => `<option value="${t.tid}" ${t.tid===tid?"selected":""}>${t.nome}</option>`).join("");
  const dataBR = t => { const [y,m,d] = t.split("-"); return `${d}/${m}`; };
  const rows = jogadores.map(j => {
    const boxes = [...j.ult].reverse().map((g, i, arr) =>
      `<span class="bx ${i===arr.length-1?"last":""} ${sel(g)>0?"hit":""}" data-tip="× ${g.a} · ${dataBR(g.t)}">${sel(g)}</span>`).join("");
    const click = j.nav ? `onclick="abrirJogador(${j.nav.fi}, '${j.nav.side}', ${j.nav.idx})"` : "";
    return `<button class="b365-row" ${click}>
      <span class="b365-nome">${j.nome}</span>
      <span class="b365-bxs">${boxes}</span>
    </button>`;
  }).join("");

  return `
    <div class="b365">
      <div class="b365-head">
        <span class="b365-t">Jogador ·</span>
        <select class="b365-sel" onchange="setB365Stat(this.value)">
          <option value="f" ${stat==="f"?"selected":""}>Finalizações</option>
          <option value="o" ${stat==="o"?"selected":""}>Chutes a gol</option>
        </select>
        <select class="b365-sel" onchange="setB365Team(this.value)">${optT}</select>
        <span class="b365-sub">últimos 5 jogos · mais recente à direita</span>
      </div>
      <div class="b365-list">${rows || '<div class="empty-box">Sem jogadores com histórico neste time.</div>'}</div>
      ${total > 10 ? `<button class="expand-btn" onclick="toggleB365Todos()">${aberto ? "Mostrar menos" : `Ver todos (${total})`}</button>` : ""}
    </div>`;
}

  // dias disponíveis no calendário (ordenados)
  const diasDisponiveis = [...new Set(FIXTURES.map(f => diaBRT(f.kickoff)))].sort();

  // aplica o filtro por dia (nunca mostra jogos que já passaram)
  let visiveis = FIXTURES.map((fx, fi) => ({ fx, fi }))
    .filter(({ fx }) => diasDe(diaBRT(fx.kickoff)) >= 0);
  // mapa completo de competições (pro sidebar — antes do filtro de região)
  const porCompAll = new Map();
  visiveis.forEach(({ fx }) => {
    const c = porCompAll.get(fx.ligaId) || { nome: fx.competicao, n: 0, regiao: regiaoDe(fx.ligaId) };
    c.n++; porCompAll.set(fx.ligaId, c);
  });
  // filtro por região (v2b — só aparece quando a agenda é multirregião)
  const regioes = new Set(visiveis.map(({ fx }) => regiaoDe(fx.ligaId)));
  const regiao = state.regiaoFiltro || "todos";
  if (regiao !== "todos") visiveis = visiveis.filter(({ fx }) => regiaoDe(fx.ligaId) === regiao);
  // seletor de competição (dentro da região ativa)
  const porComp = new Map();
  visiveis.forEach(({ fx }) => {
    const c = porComp.get(fx.ligaId) || { nome: fx.competicao, n: 0 };
    c.n++; porComp.set(fx.ligaId, c);
  });
  const comps = [...porComp.entries()].sort((a, b) => b[1].n - a[1].n);
  if (state.compFiltro != null && porComp.has(state.compFiltro))
    visiveis = visiveis.filter(({ fx }) => fx.ligaId === state.compFiltro);
  else state.compFiltro = null;
  const alvo = { hoje: 0, amanha: 1, depois: 2 }[filtro];
  if (alvo != null) visiveis = visiveis.filter(({ fx }) => diasDe(diaBRT(fx.kickoff)) === alvo);

  // agrupa por DIA → dentro do dia por COMPETIÇÃO
  const porDia = [];
  visiveis.forEach(item => {
    const dia = diaBRT(item.fx.kickoff);
    let d = porDia.find(x => x.dia === dia);
    if (!d) { d = { dia, comps: [] }; porDia.push(d); }
    let c = d.comps.find(x => x.comp === item.fx.competicao);
    if (!c) { c = { comp: item.fx.competicao, ligaId: item.fx.ligaId, jogos: [] }; d.comps.push(c); }
    c.jogos.push(item);
  });
  porDia.sort((a, b) => a.dia.localeCompare(b.dia));

  const rowsDoComp = jogos => jogos.map(({ fx, fi }) => `
      <button class="fx-row" onclick="go('jogo', null, null, null, ${fi})">
        <span class="fx-time tnum">${fmtHora(fx.kickoff)}</span>
        <span class="fx-team home"><span class="fx-name">${fx.home}</span>${teamCrest(fx.home)}</span>
        <span class="fx-x">×</span>
        <span class="fx-team away">${teamCrest(fx.away)}<span class="fx-name">${fx.away}</span></span>
        <span class="fx-go"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></span>
      </button>`).join("");

  const conteudo = porDia.length ? porDia.map(d => {
    const total = d.comps.reduce((a, c) => a + c.jogos.length, 0);
    const blocos = d.comps.map(c => `
      <div class="comp-block">
        <div class="comp-head"><span class="comp-name">${bandeiraDe(c.ligaId)} ${c.comp}</span><span class="comp-count">${c.jogos.length} jogo${c.jogos.length===1?"":"s"}</span></div>
        <div class="fx-list">${rowsDoComp(c.jogos)}</div>
      </div>`).join("");
    return `<div class="day-block">
      <div class="day-head"><span class="day-lbl">${rotuloDia(d.dia)}</span><span class="day-date">${dataCurta(d.dia)}</span><span class="day-line"></span><span class="day-count tnum">${total} jogo${total===1?"":"s"}</span></div>
      ${blocos}
    </div>`;
  }).join("") : `<div class="empty-box" style="margin-top:24px">Nenhum jogo ${rotulosFiltro[filtro] || "nesse dia"}. Veja a semana toda.</div>`;

  // ----- sidebar de competições (desktop): fixadas primeiro, depois por região -----
  const favs = getFavLigas();
  const bandeira = { br: "🇧🇷", eu: "🇪🇺", am: "🌎" };
  const lsItem = (lid, c) => `
    <button class="ls-item ${state.compFiltro===lid?'on':''}" onclick="setCompSide(${lid})">
      <span>${bandeiraDe(lid)}</span><span class="ls-nm">${c.nome}</span>
      <span class="n tnum">${c.n}</span>
      <span class="ls-pin ${favs.includes(lid)?'on':''}" onclick="toggleFavLiga(event, ${lid})" title="${favs.includes(lid)?'Desafixar':'Fixar no topo'}">${favs.includes(lid)?'★':'☆'}</span>
    </button>`;
  const compsAll = [...porCompAll.entries()];
  const fixadas = compsAll.filter(([lid]) => favs.includes(lid));
  let sideHTML = "";
  if (compsAll.length > 1){
    const blocos = [];
    if (fixadas.length)
      blocos.push(`<div class="ls-h">📌 Ligas fixadas</div>` + fixadas.map(([lid, c]) => lsItem(lid, c)).join(""));
    for (const [reg, titulo] of [["br","🇧🇷 Brasil"],["am","🌎 Américas"],["eu","🇪🇺 Europa"]]){
      const doReg = compsAll.filter(([lid, c]) => c.regiao === reg && !favs.includes(lid))
                            .sort((a, b) => b[1].n - a[1].n);
      if (doReg.length)
        blocos.push(`<div class="ls-h">${titulo}</div>` + doReg.map(([lid, c]) => lsItem(lid, c)).join(""));
    }
    sideHTML = `<aside class="liga-side">${blocos.join("")}</aside>`;
  }

  const chipD = (k, txt) => `<button class="chip ${filtro===k?'on':''}" onclick="setDiaFiltro('${k}')">${txt}</button>`;

  el.innerHTML = `
  <div class="home-grid">
    ${sideHTML}
    <div class="home-main">
    <div class="hero">
      <div class="hero-row">
        <div>
          <div class="eyebrow" style="color:var(--acc); margin-bottom:8px">Estatística de futebol · sem garimpo</div>
          <h1>Agenda de<br>jogos</h1>
          <p class="sub2">Toque num jogo e veja o <b>raio-x completo</b> — médias dos times e de cada jogador, o que hoje você caça jogo por jogo em vários sites.</p>
        </div>
        <div class="opp-counter">
          <div><div class="n tnum">${visiveis.length}</div><div class="l">jogos<br>${filtro==='semana'?'na semana':'no filtro'}</div></div>
        </div>
      </div>
    </div>
    <div class="filters" style="margin-top:20px">
      ${chipD("hoje", "Hoje")}${chipD("amanha", "Amanhã")}${chipD("depois", "Depois de amanhã")}${chipD("semana", "Semana toda")}
    </div>
    ${regioes.size > 1 ? `<div class="filters filtros-mobile" style="margin-top:8px">
      ${[["todos","🌍 Tudo"],["br","🇧🇷 Brasil"],["eu","🇪🇺 Europa"],["am","🌎 Américas"]].map(([k, txt]) =>
        `<button class="chip ${regiao===k?'on':''}" onclick="setRegiao('${k}')">${txt}</button>`).join("")}
    </div>` : ""}
    ${comps.length > 1 ? `<div class="comp-scroll filtros-mobile">
      <button class="chip ${state.compFiltro==null?'on':''}" onclick="setCompFiltro(null)">Todas as competições</button>
      ${comps.map(([lid, c]) =>
        `<button class="chip ${state.compFiltro===lid?'on':''}" onclick="setCompFiltro(${lid})">${bandeiraDe(lid)} ${c.nome} <span class="chip-n">${c.n}</span></button>`).join("")}
    </div>` : ""}
    <div class="lead-banner">
      <div class="lb-txt">
        <div class="t">Raio-x dos jogos do dia</div>

      <button class="lb-btn" onclick="abrirLead('jogos')">Quero receber</button>
    </div>
    <div style="margin-top:18px">${conteudo}</div>
    ${sourceNoteQI()}
    </div>
  </div>
  `;
}

function abrirCard(fi, key, label, a, b, dec, sufixo){
  const fx = FIXTURES[fi];
  const rxH = computeRx(fx.homeId, fx.ligaId, state.rxJanela, state.rxEscopo);
  const rxA = computeRx(fx.awayId, fx.ligaId, state.rxJanela, state.rxEscopo);
  const ehContinental = ehContinentalLiga(fx.ligaId);
  let contexto = `média dos últimos ${Math.max(rxH?.jogos||0, rxA?.jogos||0)} jogos`;
  if (state.rxEscopo === "comp") contexto += ehContinental ? " · copas continentais" : ` · ${fx.competicao}`;
  if (rxH?.inclui2025 || rxA?.inclui2025) contexto += " · inclui temporada 2025";
  // extrato jogo a jogo da estatística clicada (pro card detalhado)
  const sel = STAT_SEL[key];
  const extrato = tid => sel
    ? getJogosRx(tid, fx.ligaId, state.rxJanela, state.rxEscopo)
        .map(j => ({ v: sel(j), adv: j.advNome || j.ts?.slice(5).split("-").reverse().join("/") || "?" }))
        .filter(e => e.v != null)
    : [];
  state.card = { fx, key, label, a, b, dec, sufixo, contexto,
    extratoH: extrato(fx.homeId), extratoA: extrato(fx.awayId), formato: "sticker" };
  montarCardModal();
}

const H2H_STAT_SEL = {
  gols: { a: j=>j.golsA, b: j=>j.golsB },
  fin: { a: j=>j.statsA.fin ?? null, b: j=>j.statsB.fin ?? null },
  chutesGol: { a: j=>j.statsA.chutesGol ?? null, b: j=>j.statsB.chutesGol ?? null },
  cantos: { a: j=>j.statsA.cantos ?? null, b: j=>j.statsB.cantos ?? null },
  defesas: { a: j=>j.statsA.defesas ?? null, b: j=>j.statsB.defesas ?? null },
  faltas: { a: j=>j.statsA.faltas ?? null, b: j=>j.statsB.faltas ?? null },
  amarelos: { a: j=>j.statsA.amarelos ?? null, b: j=>j.statsB.amarelos ?? null },
  vermelhos: { a: j=>j.statsA.vermelhos ?? null, b: j=>j.statsB.vermelhos ?? null },
  posse: { a: j=>j.statsA.posse ?? null, b: j=>j.statsB.posse ?? null },
};
function abrirCardH2HStat(fi, key, label, a, b, dec, sufixo){
  const fx = FIXTURES[fi];
  const v = h2hView(fx, state.rxEscopo, state.h2hSub || "ult");
  const sel = H2H_STAT_SEL[key];
  const dataBR = ts => { const [y,m,d] = ts.split("-"); return `${d}/${m}/${y.slice(2)}`; };
  // "(fora)" é relativo a cada time: quando A jogou fora, B jogou em casa
  const extrato = (s, foiCasa) => sel
    ? v.jogos.map(j => ({ v: s(j), adv: dataBR(j.ts) + (foiCasa(j) ? "" : " (fora)") })).filter(e => e.v != null)
    : [];
  state.card = { fx, key, label, a, b, dec, sufixo, formato: "sticker",
    contexto: `confronto direto · ${v.contexto}`,
    extratoH: extrato(sel.a, j => j.mandoA), extratoA: extrato(sel.b, j => !j.mandoA) };
  montarCardModal();
}

function carregaImg(src){
  return new Promise(res => {
    if (!src) return res(null);
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = () => res(null);
    img.src = src;
  });
}
async function desenharCard(){
  const c = state.card;
  if (c.tipo === "h2h") return desenharH2H();
  if (c.tipo === "quentes") return desenharQuentes();
  if (c.tipo === "jogador") return desenharJogador();
  if (c.tipo === "arbitro") return desenharArbitro();
  if (c.formato === "sticker") return desenharSticker();
  const W = 1080, H = c.formato === "story" ? 1920 : 1350;
  const cv = document.getElementById("cardCanvas");
  if (!cv) return;
  cv.width = W; cv.height = H;
  const x = cv.getContext("2d");

  // fundo
  const g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, "#0D1712"); g.addColorStop(0.5, "#0A0F0C"); g.addColorStop(1, "#07100B");
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  const glow = x.createRadialGradient(W/2, H*0.42, 60, W/2, H*0.42, W*0.75);
  glow.addColorStop(0, "rgba(47,208,138,0.14)"); glow.addColorStop(1, "rgba(47,208,138,0)");
  x.fillStyle = glow; x.fillRect(0, 0, W, H);

  const cx = W / 2;
  const UI = "-apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif";
  const MONO = "'SF Mono', 'Roboto Mono', Menlo, monospace";

  // topo: marca
  const yTopo = H * 0.075;
  x.textAlign = "center"; x.textBaseline = "middle";
  x.font = `800 64px ${UI}`;
  const wAp = x.measureText("APITOU").width, wEx = x.measureText("!").width;
  x.fillStyle = "#FFFFFF"; x.fillText("APITOU", cx - wEx/2, yTopo);
  x.fillStyle = "#2FD08A"; x.fillText("!", cx + wAp/2, yTopo);
  x.font = `500 26px ${MONO}`; x.fillStyle = "#93A399";
  x.fillText("OS NÚMEROS FALAM", cx, yTopo + 58);

  // competição + horário
  x.font = `600 30px ${MONO}`; x.fillStyle = "#64756B";
  x.fillText(`${c.fx.competicao.toUpperCase()} · ${fmtHorario(c.fx.kickoff)}`, cx, H * 0.155);

  // escudos + nomes
  const yTimes = H * 0.27;
  const tam = 190, off = W * 0.235;
  const [imH, imA] = await Promise.all([
    carregaImg(SC_ASSETS.escudos?.[c.fx.home]),
    carregaImg(SC_ASSETS.escudos?.[c.fx.away]),
  ]);
  const desenhaTime = (img, nome, cxT) => {
    x.save();
    const r = 34;
    x.beginPath(); x.roundRect(cxT - tam/2, yTimes - tam/2, tam, tam, r); x.clip();
    if (img){ x.drawImage(img, cxT - tam/2, yTimes - tam/2, tam, tam); }
    else { x.fillStyle = "#1E2A23"; x.fillRect(cxT - tam/2, yTimes - tam/2, tam, tam);
           x.fillStyle = "#EAF2EC"; x.font = `800 64px ${UI}`; x.fillText(initials(nome), cxT, yTimes); }
    x.restore();
    x.strokeStyle = "rgba(255,255,255,0.12)"; x.lineWidth = 3;
    x.beginPath(); x.roundRect(cxT - tam/2, yTimes - tam/2, tam, tam, 34); x.stroke();
    x.font = `700 40px ${UI}`; x.fillStyle = "#EAF2EC";
    x.fillText(nome, cxT, yTimes + tam/2 + 52);
  };
  desenhaTime(imH, c.fx.home, cx - off);
  desenhaTime(imA, c.fx.away, cx + off);

  x.fillStyle = "#F0B14A";
