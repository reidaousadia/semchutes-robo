/* Sticker compacto pra sobrepor em vídeo — fundo transparente fora do painel.
   Com extrato jogo a jogo da estatística (pedido do Pedro: "quantas finalizações
   foram contra cada time"). */
async function desenharSticker(){
  const c = state.card;
  const MAXROWS = 15; // mostra todos os jogos do filtro (últimos 5/10/15), sem cortar
  const nRows = Math.min(Math.max(c.extratoH?.length || 0, c.extratoA?.length || 0), MAXROWS);
  const W = 1080, H = 640 + (nRows ? nRows * 44 + 40 : 0);
  const cv = document.getElementById("cardCanvas");
  if (!cv) return;
  cv.width = W; cv.height = H;
  const x = cv.getContext("2d");
  x.clearRect(0, 0, W, H);

  const UI = "-apple-system, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif";
  const MONO = "'SF Mono', 'Roboto Mono', Menlo, monospace";
  const cx = W / 2;

  // painel arredondado semi-transparente
  const px = 24, py = 24, pw = W - 48, ph = H - 48, rad = 44;
  x.fillStyle = "rgba(8,13,10,0.92)";
  x.beginPath(); x.roundRect(px, py, pw, ph, rad); x.fill();
  x.strokeStyle = "rgba(47,208,138,0.4)"; x.lineWidth = 3;
  x.beginPath(); x.roundRect(px, py, pw, ph, rad); x.stroke();

  x.textAlign = "center"; x.textBaseline = "middle";

  // linha 1: escudos + nomes
  const yT = py + 88;
  const [imH, imA] = await Promise.all([
    carregaImg(SC_ASSETS.escudos?.[c.fx.home]),
    carregaImg(SC_ASSETS.escudos?.[c.fx.away]),
  ]);
  x.font = `800 42px ${UI}`;
  const nomeHW = x.measureText(c.fx.home).width, nomeAW = x.measureText(c.fx.away).width;
  const crest = 76, gap = 16, meio = 70;
  const total = crest + gap + nomeHW + meio + nomeAW + gap + crest;
  let cur = cx - total / 2;
  const desenhaCrest = (img, nome, cxc) => {
    x.save();
    x.beginPath(); x.roundRect(cxc, yT - crest/2, crest, crest, 18); x.clip();
    if (img) x.drawImage(img, cxc, yT - crest/2, crest, crest);
    else { x.fillStyle = "#1E2A23"; x.fillRect(cxc, yT - crest/2, crest, crest);
           x.fillStyle = "#EAF2EC"; x.font = `800 30px ${UI}`; x.fillText(initials(nome), cxc + crest/2, yT); }
    x.restore();
  };
  desenhaCrest(imH, c.fx.home, cur); cur += crest + gap;
  x.font = `800 42px ${UI}`; x.fillStyle = "#EAF2EC"; x.textAlign = "left";
  x.fillText(c.fx.home, cur, yT); cur += nomeHW;
  x.textAlign = "center"; x.fillStyle = "#64756B"; x.font = `600 36px ${UI}`;
  x.fillText("×", cur + meio/2, yT); cur += meio;
  x.textAlign = "left"; x.fillStyle = "#EAF2EC"; x.font = `800 42px ${UI}`;
  x.fillText(c.fx.away, cur, yT); cur += nomeAW + gap;
  desenhaCrest(imA, c.fx.away, cur);
  x.textAlign = "center";

  // linha 2: título da estatística
  x.font = `700 30px ${MONO}`; x.fillStyle = "#2FD08A";
  x.fillText(c.label.toUpperCase() + " · POR JOGO", cx, yT + 88);

  // linha 3: números + barras
  const yNum = yT + 210, off = 240;
  const valH = fmt(c.a, c.dec) + c.sufixo, valA = fmt(c.b, c.dec) + c.sufixo;
  x.font = `800 128px ${UI}`;
  x.fillStyle = c.a >= c.b ? "#2FD08A" : "#EAF2EC"; x.fillText(valH, cx - off, yNum);
  x.fillStyle = c.b > c.a ? "#F0B14A" : "#EAF2EC"; x.fillText(valA, cx + off, yNum);
  const barW = 280, barH = 14, yBar = yNum + 92, max = Math.max(c.a, c.b, 0.001);
  x.fillStyle = "rgba(255,255,255,0.10)";
  x.beginPath(); x.roundRect(cx - off - barW/2, yBar, barW, barH, 7); x.fill();
  x.beginPath(); x.roundRect(cx + off - barW/2, yBar, barW, barH, 7); x.fill();
  x.fillStyle = "#2FD08A";
  x.beginPath(); x.roundRect(cx - off - barW/2, yBar, barW * (c.a/max), barH, 7); x.fill();
  x.fillStyle = "#F0B14A";
  x.beginPath(); x.roundRect(cx + off - barW/2, yBar, barW * (c.b/max), barH, 7); x.fill();

  // extrato jogo a jogo ("quantas foram contra cada time")
  if (nRows){
    const yEx0 = yBar + 74;
    const trunca = (s, n=17) => s.length > n ? s.slice(0, n-1) + "…" : s;
    // linha divisória sutil
    x.strokeStyle = "rgba(255,255,255,0.08)"; x.lineWidth = 2;
    x.beginPath(); x.moveTo(px + 60, yEx0 - 36); x.lineTo(px + pw - 60, yEx0 - 36); x.stroke();
    const fmtV = v => (Number.isInteger(v) ? String(v) : fmt(v, c.dec)) + c.sufixo;
    const NUMF = `800 30px ${UI}`, NOMEF = `500 26px ${UI}`, gapNN = 12;
    // cada linha "N × Adversário" é centralizada embaixo do número grande da coluna
    const desenhaLinha = (e, colCx, cor, y) => {
      const numTxt = fmtV(e.v), nomeTxt = "× " + trunca(e.adv);
      x.font = NUMF; const wNum = x.measureText(numTxt).width;
      x.font = NOMEF; const wNome = x.measureText(nomeTxt).width;
      const x0 = colCx - (wNum + gapNN + wNome) / 2;
      x.textAlign = "left";
      x.font = NUMF; x.fillStyle = cor; x.fillText(numTxt, x0, y);
      x.font = NOMEF; x.fillStyle = "#93A399"; x.fillText(nomeTxt, x0 + wNum + gapNN, y);
    };
    for (let i = 0; i < nRows; i++){
      const y = yEx0 + i * 44;
      const eH = c.extratoH[i], eA = c.extratoA[i];
      if (eH) desenhaLinha(eH, cx - off, "#2FD08A", y);
      if (eA) desenhaLinha(eA, cx + off, "#F0B14A", y);
    }
    x.textAlign = "center";
    const sobraH = (c.extratoH?.length || 0) - nRows, sobraA = (c.extratoA?.length || 0) - nRows;
    if (sobraH > 0 || sobraA > 0){
      x.font = `500 22px ${MONO}`; x.fillStyle = "#64756B";
      x.fillText(`+ ${Math.max(sobraH, sobraA)} jogos na amostra`, cx, yEx0 + nRows * 44 + 6);
    }
  }

  // rodapé: contexto à esquerda, marca à direita
  const yRod = py + ph - 44;
  x.textAlign = "left"; x.font = `500 22px ${MONO}`; x.fillStyle = "#93A399";
  x.fillText(c.contexto, px + 36, yRod);
  x.textAlign = "right"; x.font = `800 26px ${UI}`;
  const wEx = x.measureText("!").width;
  x.fillStyle = "#2FD08A"; x.fillText("!", px + pw - 36, yRod);
  x.fillStyle = "#FFFFFF"; x.fillText("APITOU", px + pw - 36 - wEx, yRod);
  x.textAlign = "center";
}

  // últimos confrontos (escudo + placar)

    x.textAlign = "left"; x.font = `700 22px ${MONO}`; x.fillStyle = "#93A399";
    x.fillText("ÚLTIMOS CONFRONTOS", px+60, Y(oResTitle));
    const dataBR = ts => { const [yy,m,d] = ts.split("-"); return `${d}/${m}/${yy.slice(2)}`; };
    for (let i = 0; i < nRes; i++){
      const r = c.results[i], y = Y(resRow0 + i*resStep);
      const hostImg = r.hostEhA ? imH : imA, visImg = r.hostEhA ? imA : imH;
      const hostNm = r.hostEhA ? c.fx.home : c.fx.away, visNm = r.hostEhA ? c.fx.away : c.fx.home;
      x.textAlign = "left"; x.font = `500 22px ${MONO}`; x.fillStyle = "#64756B"; x.fillText(dataBR(r.ts), px+60, y);
      const sc = 34, scoreTxt = `${r.hostGols}   ×   ${r.visGols}`;

      const wNum = x.measureText(scoreTxt).width;
      const winCol = r.hostGols > r.visGols ? (r.hostEhA ? "#2FD08A" : "#F0B14A")
                   : r.visGols > r.hostGols ? (r.hostEhA ? "#F0B14A" : "#2FD08A") : "#EAF2EC";
      drawCrest(hostImg, hostNm, cx - wNum/2 - 18 - sc, y, sc);
      x.textAlign = "center"; x.font = `800 34px ${MONO}`; x.fillStyle = winCol; x.fillText(scoreTxt, cx, y);
      drawCrest(visImg, visNm, cx + wNum/2 + 18, y, sc);
    }
    x.textAlign = "center";
  }

  // rodapé
  const yRod = Y(oFooter);
  x.textAlign = "right"; x.font = `800 26px ${UI}`;
  const wEx = x.measureText("!").width;
  x.fillStyle = "#2FD08A"; x.fillText("!", px+pw-40, yRod);
  x.fillStyle = "#FFFFFF"; x.fillText("APITOU", px+pw-40-wEx, yRod);
  x.textAlign = "left"; x.font = `500 22px ${MONO}`; x.fillStyle = "#93A399";
  x.fillText("os números falam · estatística real", px+40, yRod);
  x.textAlign = "center";
}

  // divisória vertical entre as colunas
  x.strokeStyle = "rgba(255,255,255,0.08)"; x.lineWidth = 2;
  x.beginPath(); x.moveTo(cx, Y(oColName) - 24); x.lineTo(cx, Y(oFooter) - 40); x.stroke();

  // uma coluna por time
  const desenhaColuna = (f, nome, colCx, x0, x1, cor) => {
    // nome do time
    x.textAlign = "center"; x.font = `800 30px ${UI}`; x.fillStyle = cor;
    let nm = nome; x.font = `800 30px ${UI}`;
    while (x.measureText(nm).width > (x1 - x0) && nm.length > 4) nm = nm.slice(0, -1);
    x.fillText(nm === nome ? nm : nm + "…", colCx, Y(oColName));
    if (!f){
      x.font = `500 24px ${MONO}`; x.fillStyle = "#64756B";
      x.fillText("sem jogos no filtro", colCx, Y(oBoxes));
      return;
    }
    // caixinhas V/E/D (mais antigo → mais recente)
    const seq = [...f.res].reverse();
    const bs = 34, bg = 8, totalW = seq.length * bs + (seq.length - 1) * bg;
    let bx = colCx - totalW / 2;
    seq.forEach(r => {
      x.fillStyle = r === "v" ? "rgba(47,208,138,0.18)" : r === "d" ? "rgba(224,90,78,0.18)" : "rgba(255,255,255,0.06)";
      x.beginPath(); x.roundRect(bx, Y(oBoxes) - bs/2, bs, bs, 8); x.fill();
      x.font = `800 17px ${MONO}`;
      x.fillStyle = r === "v" ? "#2FD08A" : r === "d" ? "#E05A4E" : "#93A399";
      x.fillText(r.toUpperCase(), bx + bs/2, Y(oBoxes) + 1);
      bx += bs + bg;
    });
    // frases de sequência
    x.textAlign = "left";
    f.seqs.forEach((s, i) => {
      const y = Y(seq0 + i * seqStep);
      x.font = `700 26px ${UI}`; x.fillStyle = "#EAF2EC";
      x.fillText(`${s.icon} ${s.txt}`, x0, y);
    });
    // tendências (70%+ em verde)
    f.tend.forEach((t, i) => {
      const y = Y(tend0 + i * tendStep);
      const hot = t.pct >= 70;
      x.textAlign = "left"; x.font = `${hot ? 700 : 500} 24px ${UI}`; x.fillStyle = hot ? "#EAF2EC" : "#93A399";
      let tt = t.txt.replace(" na partida", ""); // no card o contexto já é a partida
      x.font = `${hot ? 700 : 500} 24px ${UI}`;
      while (x.measureText(tt).width > (x1 - x0 - 92) && tt.length > 6) tt = tt.slice(0, -1);
      x.fillText(tt === t.txt ? tt : tt + "…", x0, y);
      x.textAlign = "right"; x.font = `800 24px ${MONO}`; x.fillStyle = hot ? "#2FD08A" : "#64756B";
      x.fillText(`${t.hit}/${t.n}`, x1, y);
    });
    x.textAlign = "center";
  };
  desenhaColuna(fH, c.fx.home, cx - 264, px + 46, cx - 34, "#2FD08A");
  desenhaColuna(fA, c.fx.away, cx + 264, cx + 34, px + pw - 46, "#F0B14A");

  // rodapé
  const yRod = Y(oFooter);
  x.textAlign = "right"; x.font = `800 26px ${UI}`;
  const wEx = x.measureText("!").width;
  x.fillStyle = "#2FD08A"; x.fillText("!", px+pw-40, yRod);
  x.fillStyle = "#FFFFFF"; x.fillText("APITOU", px+pw-40-wEx, yRod);
  x.textAlign = "left"; x.font = `500 22px ${MONO}`; x.fillStyle = "#93A399";
  x.fillText("os números falam · estatística real", px+40, yRod);
  x.textAlign = "center";
}

async function desenharJogador(){

  x.fillText("FORMA RECENTE · POR JOGO", cx, Y(oSub));

  // extrato: valor × adversário · data
  const dataBR = t => { const [y,m,d] = t.split("-"); return `${d}/${m}/${y.slice(2)}`; };
  c.hist.forEach((g, i) => {

  // rodapé
  const yRod = Y(oFooter);
  x.textAlign = "right"; x.font = `800 26px ${UI}`;
  const wEx = x.measureText("!").width;
  x.fillStyle = "#2FD08A"; x.fillText("!", px+pw-40, yRod);
  x.fillStyle = "#FFFFFF"; x.fillText("APITOU", px+pw-40-wEx, yRod);
  x.textAlign = "left"; x.font = `500 22px ${MONO}`; x.fillStyle = "#93A399";

function baixarCard(){
  const cv = document.getElementById("cardCanvas");
  const c = state.card;
  const nome = ((c.tipo === "jogador" || c.tipo === "arbitro")
    ? `apitou-${c.nome}-${c.label}`
    : `apitou-${c.fx.home}-x-${c.fx.away}-${c.label}`).toLowerCase().replace(/[^a-z0-9]+/g, "-");
  cv.toBlob(blob => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `${nome}.png`;
    a.click();
    URL.revokeObjectURL(a.href);
  }, "image/png");
}

/* ---------- JOGADOR — perfil de estatística (conceito simplificado) ---------- */
function abrirJogador(fi, side, idx){
  state.j2 = { fi, side, idx };
  state.jgJanela = 10; state.jgEscopo = "geral"; // forma do jogador: padrão últimos 10, todos os jogos
  go('jogador');
}
function setJgJanela(n){ state.jgJanela = n; render(); }
function setJgEscopo(e){ state.jgEscopo = e; render(); }
function renderJogadorSimples(){
  const { fi, side, idx } = state.j2 || {};
  const fx = FIXTURES[fi];
  if (!fx) { go('oportunidades'); return; }
  const tid = side === "home" ? fx.homeId : fx.awayId;
  const tname = side === "home" ? fx.home : fx.away;
  const adv = side === "home" ? fx.away : fx.home;
  const j = (ELENCOS[String(tid)] || [])[idx];
  if (!j) { go('jogo', null, null, null, fi); return; }

  // projeção discreta: média × defesa do adversário × mando (sem linguagem de aposta)
  const ref = fx.players.find(p => p.isHome === (side === "home"));
  const multAdv = ref ? ref.multAdversario : 1;
  const lambda = j.media * multAdv * (side === "home" ? 1.12 : 0.93);
  const goleiro = (j.pos === "Goleiro");

  const tile = (k, v, cls="") => `<div class="tile ${cls}"><div class="k">${k}</div><div class="big tnum" style="font-size:32px">${v}</div></div>`;

  // ----- histórico jogo a jogo sob o filtro ativo -----
  const janela = state.jgJanela || 10, escopo = state.jgEscopo || "geral";
  const hist = goleiro ? [] : getHistJogador(tid, j.name, janela, escopo, fx.ligaId);
  const ehContinental = ehContinentalLiga(fx.ligaId);
  const labelComp = ehContinental ? "Só continentais" : `Só ${fx.competicao}`;
  const chipJg = n => `<button class="chip ${janela===n?'on':''}" onclick="setJgJanela(${n})">Últimos ${n}</button>`;
  const chipEs = (e, label) => `<button class="chip ${escopo===e?'on':''}" onclick="setJgEscopo('${e}')">${label}</button>`;
  const filtros = goleiro ? "" : `
    <div class="jogo-filtros" style="margin-top:18px">
      <div class="qlabel">Quantos jogos contar?</div>
      <div class="filters">${chipJg(5)}${chipJg(10)}</div>
      <div class="qlabel">Quais jogos?</div>
      <div class="filters">${chipEs("comp", labelComp)}${chipEs("geral", "Todos os jogos")}</div>
    </div>`;

  let corpo = "";
  if (hist.length){
    const med = sel => hist.reduce((a, g) => a + sel(g), 0) / hist.length;
    const dataBR = t => { const [y,m,d] = t.split("-"); return `${d}/${m}/${y.slice(2)}`; };

    // caixinhas estilo bet365 (mais antigo → mais recente; último em destaque; hover = adversário)
    const boxes = sel => [...hist].reverse().map((g, i, arr) =>
      `<span class="bx ${i === arr.length-1 ? "last" : ""} ${sel(g) > 0 ? "hit" : ""}" data-tip="× ${g.a} · ${dataBR(g.t)}">${sel(g)}</span>`).join("");

    // tendências no formato do apostador (linha X+ · acertos/N) — 70%+ em verde
    const ladder = (sel, linhas, label) => linhas.map(L => {
      const hit = hist.filter(g => sel(g) >= L).length;
      const pct = Math.round(hit / hist.length * 100);
      return `<div class="tend-row ${pct >= 70 ? "hot" : ""}">
        <span class="tend-ico">${label.icon}</span>
        <span class="tend-txt">${L}+ ${label.txt}</span>
        <span class="tend-bar"><span style="width:${pct}%"></span></span>
        <span class="tend-hit">${hit} de ${hist.length}</span>
      </div>`;
    }).join("");
    const tendencias =
      ladder(g => g.f, [1, 2, 3], { icon: "🎯", txt: "finalizações" }) +
      ladder(g => g.o, [1, 2], { icon: "⚽", txt: "chutes a gol" }) +
      ladder(g => g.fs, [2], { icon: "🤕", txt: "faltas sofridas" }) +
      ladder(g => g.m, [60], { icon: "⏱️", txt: "minutos em campo" });

    const extrato = hist.map(g => `
      <div class="jg-game">
        <span class="jg-date">${dataBR(g.t)}</span>
        <span class="jg-adv">× ${g.a}</span>
        <span class="jg-min tnum">${g.m}'</span>
        <span class="jg-vals"><b class="amber tnum">${g.f}</b> fin · <b class="acc tnum">${g.o}</b> a gol${g.g ? ` · <b class="tnum">${g.g}</b> gol${g.g>1?"s":""} ⚽` : ""}</span>
      </div>`).join("");

    corpo = `
      <div class="tiles" style="margin-top:16px">
        ${tile("Finalizações / jogo", fmt(med(g=>g.f)), "hero-a")}
        ${tile("Chutes a gol / jogo", fmt(med(g=>g.o)), "hero-b")}
        ${tile("Minutos / jogo", Math.round(med(g=>g.m)))}

function abrirCardJogador(){
  const { fi, side, idx } = state.j2 || {};

/* ---------- MÚLTIPLAS — montagem de aposta combinada + link de afiliado ---------- */
function todasAsPernas(){
  // Múltiplas só trabalham com jogadores que já têm linha aberta (odds).
  const pernas = [];
  FIXTURES.forEach((fx, fi) => {
    fx.players.forEach((p, pi) => {
      const analise = analisarJogador(p, fx.sedeNeutra);
      if (analise.destaque) pernas.push({ fi, pi, fx, p, ...analise });
    });
  });
  return pernas;
}
function defaultLegs(){
  // Sugestão automática: melhor Valor de cada jogo com odds, evitando correlação por padrão.
  const pernas = todasAsPernas();
  const fis = [...new Set(pernas.map(l => l.fi))];
  return fis.map(fi => {
    const doJogo = pernas.filter(l => l.fi === fi).sort((a,b) => b.destaque.valor - a.destaque.valor);
    return { fi, pi: doJogo[0].pi };
  });
}
function toggleLeg(fi, pi){
  if (!state.multiplaLegs) state.multiplaLegs = defaultLegs();
  const idx = state.multiplaLegs.findIndex(l => l.fi===fi && l.pi===pi);
  if (idx >= 0) state.multiplaLegs.splice(idx, 1);
  else state.multiplaLegs.push({ fi, pi });
  render();
}
function setOddAlvo(v){
  state.oddAlvo = v;
  render();
}
function usarMultipla(){
  state.multiplaUsada = true;
  render();
}
function renderMultiplas(){
  if (!state.multiplaLegs) state.multiplaLegs = defaultLegs();
  const pernas = todasAsPernas();
  const selecionadas = state.multiplaLegs
    .map(l => pernas.find(p => p.fi===l.fi && p.pi===l.pi))
    .filter(Boolean);

  const oddCombinada = selecionadas.reduce((acc, l) => acc * l.destaque.price, 1);
  const valorMedio = selecionadas.length ? selecionadas.reduce((a,l)=>a+l.destaque.valor,0)/selecionadas.length : 0;
  const confMinima = selecionadas.length ? Math.min(...selecionadas.map(l=>l.destaque.confianca)) : 0;

  const fixturesComDuplicidade = {};
  selecionadas.forEach(l => { fixturesComDuplicidade[l.fi] = (fixturesComDuplicidade[l.fi]||0) + 1; });
  const temCorrelacao = Object.values(fixturesComDuplicidade).some(n => n > 1);

  const oddAlvo = state.oddAlvo;
  let targetNote = "";
  if (oddAlvo && oddAlvo > 0){
    if (oddCombinada >= oddAlvo) targetNote = `<span class="target-note">Sua múltipla já paga <b>${fmt(oddCombinada,2)}</b> — bateu a odd alvo de ${fmt(oddAlvo,2)}.</span>`;

  }

  const grupos = FIXTURES.map((fx, fi) => {
    const linhas = fx.players.map((p, pi) => {
      const l = pernas.find(x => x.fi===fi && x.pi===pi);
      if (!l) return "";  // jogador ainda sem linha aberta não entra em múltipla
      const sel = state.multiplaLegs.some(x => x.fi===fi && x.pi===pi);
      return `
        <div class="leg-row ${sel?'selected':''}" onclick="toggleLeg(${fi},${pi})">
          <div class="leg-check">${sel ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>' : ''}</div>
          <div class="avatar" style="width:34px;height:34px;border-radius:9px;font-size:12px;${avatarStyle(p.name.length*7)}">${fotoOuIniciais(p.name)}</div>
          <div class="leg-info">
            <div class="nm">${p.name}</div>
            <div class="mk">${linhaMais(l.destaque.line)} finalizações <span class="book-tag">${p.bookmaker} · ${fmt(l.destaque.price,2)}</span></div>
          </div>
          <div class="leg-scores">
            <span class="mini" style="color:${l.destaque.qi>=70?'var(--acc)':l.destaque.qi>=45?'var(--amber)':'var(--text-dim)'}">QI ${Math.round(l.destaque.qi)}</span>
            <span class="mini" style="color:${l.destaque.valor>=70?'var(--acc)':l.destaque.valor>=45?'var(--amber)':'var(--text-dim)'}">V ${Math.round(l.destaque.valor)}</span>
          </div>
        </div>`;
    }).join("");
    if (!linhas) return "";  // jogo inteiro sem odds ainda: fora da tela de múltiplas
    return `<div class="fixture-group">
      <div class="fixture-group-h">${fx.home} x ${fx.away} · ${fx.competicao}</div>
      ${linhas}
    </div>`;
  }).join("");

  el.innerHTML = `
    <p class="eyebrow">Múltiplas · sugestão automática</p>
    <h1 class="page">Monte sua combinada</h1>
    <p class="sub">O Motor QI já sugeriu a melhor seleção de cada jogo. Marque ou desmarque jogadores pra ajustar.</p>

    <div class="target-row">
      <label>Odd alvo (opcional)</label>
      <input class="target-input tnum" type="number" step="0.1" min="1" placeholder="ex: 5.0" value="${oddAlvo||''}" oninput="setOddAlvo(parseFloat(this.value)||null)">
      ${targetNote}
    </div>

    ${temCorrelacao ? `<div class="corr-warning">⚠ Duas seleções do mesmo jogo — os resultados são correlacionados, o risco real é maior do que a odd multiplicada sugere.</div>` : ""}

    ${grupos}

    <div class="mult-summary">
      <div class="mult-summary-top">
        <div class="mult-odd">
          <div class="k">Odd estimada da múltipla</div>
          <div class="v tnum">${selecionadas.length ? fmt(oddCombinada,2) : "—"}</div>
        </div>
        <div class="mult-scores">
          <div class="score-pill ${scoreClass(valorMedio)}"><div class="n tnum">${Math.round(valorMedio)}</div><div class="l">Valor médio</div></div>
          <div class="score-pill ${scoreClass(confMinima)}"><div class="n tnum">${Math.round(confMinima)}</div><div class="l">Confiança mín.</div></div>
        </div>
        <button class="use-btn" ${selecionadas.length===0?'disabled':''} onclick="usarMultipla()">Usar essa múltipla</button>
      </div>
      ${state.multiplaUsada ? `<div class="use-confirm"><span class="live"></span> Protótipo — em produção isso abriria a aposta direto na casa parceira, via link de afiliado rastreado.</div>` : ""}
    </div>

  `;
}

/* Confronto direto: retrospecto + lista, orientados ao jogo atual (mandante à esquerda).
   Respeita o escopo: "comp" filtra os confrontos que foram na mesma competição. */
function confrontosDoJogo(fx, escopo){
  let lista = H2H[String(fx.id)] || [];
  if (escopo === "comp"){
    const ehContinental = ehContinentalLiga(fx.ligaId);
    const alvos = ehContinental
      ? ligasIrmas(fx.ligaId).map(l => ligaInfo(l).nome || (l === 11 ? "Sul-Americana" : "Libertadores"))
      : [fx.competicao];
    lista = lista.filter(c => alvos.includes(c.comp));
  }
  return lista;
}
function computaH2H(fx, escopo){
  const lista = confrontosDoJogo(fx, escopo);
  const jogos = lista.map(c => {
    const mandoA = c.idH === fx.homeId;          // o mandante atual (A = fx.home) foi o anfitrião?
    const golsA = mandoA ? c.gH : c.gA;          // gols do time A neste confronto
    const golsB = mandoA ? c.gA : c.gH;          // gols do time B
    const res = golsA > golsB ? "v" : golsA < golsB ? "d" : "e";
    return {
      ts: c.ts, comp: c.comp, mandoA, res, golsA, golsB,
      hostNome: mandoA ? fx.home : fx.away, visNome: mandoA ? fx.away : fx.home,
      hostGols: c.gH, visGols: c.gA, hostEhA: mandoA,
      totGols: c.gH + c.gA, ambas: c.gH > 0 && c.gA > 0, ca: c.ca, ct: c.ct, df: c.df,
      statsA: (mandoA ? c.sH : c.sA) || {},   // estatística do time A (fx.home) neste confronto
      statsB: (mandoA ? c.sA : c.sH) || {},
    };
  });
  return { jogos, n: jogos.length };
}
/* linhas de mercado do resumo de confronto (fácil de ajustar) */
const H2H_LINHAS = { gols: 2.5, cartoes: 3.5, escanteios: 8.5, defesas: 5.5 };
function setH2hSub(s){ state.h2hSub = s; render(); }
/* Dados de uma visão do confronto direto (sub-aba + escopo) — usado na tela e no card */
function h2hView(fx, escopo, sub){
  const { jogos: todos } = computaH2H(fx, escopo);
  const jogos = sub === "casaA" ? todos.filter(j => j.mandoA)
              : sub === "casaB" ? todos.filter(j => !j.mandoA)
              : todos;
  let vA = 0, e = 0, vB = 0, gA = 0, gB = 0;
  jogos.forEach(j => { gA += j.golsA; gB += j.golsB; if (j.res === "v") vA++; else if (j.res === "d") vB++; else e++; });
  // tendência de linha (mais/menos de X) — direção dominante
  const mk = (getter, linha, label, icon) => {
    const vals = jogos.map(getter).filter(x => x != null);
    if (!vals.length) return null;
    const over = vals.filter(x => x > linha).length, under = vals.length - over;
    const mais = over >= under, hit = mais ? over : under;
    return { icon, txt: `${mais?"Mais":"Menos"} de ${String(linha).replace(".",",")} ${label}`, hit, n: vals.length, pct: Math.round(hit / vals.length * 100) };
  };
  // tendência sim/não (ex.: ambas marcam) — direção dominante
  const mkBool = (pred, txtSim, txtNao, icon) => {
    const vals = jogos.filter(j => pred(j) != null);
    if (!vals.length) return null;
    const sim = vals.filter(pred).length, nao = vals.length - sim;
    const ehSim = sim >= nao, hit = ehSim ? sim : nao;
    return { icon, txt: ehSim ? txtSim : txtNao, hit, n: vals.length, pct: Math.round(hit / vals.length * 100) };
  };
  const tend = [
    mk(j => j.totGols, H2H_LINHAS.gols, "gols", "⚽"),
    mkBool(j => j.ambas, "Ambas marcam", "Ambas NÃO marcam", "🤝"),
    mk(j => j.ct, H2H_LINHAS.cartoes, "cartões", "🟨"),
    mk(j => j.ca, H2H_LINHAS.escanteios, "escanteios", "🚩"),
    mk(j => j.df, H2H_LINHAS.defesas, "defesas de goleiro", "🧤"),
  ].filter(Boolean);
  const ehContinental = ehContinentalLiga(fx.ligaId);
  const escLabel = escopo === "comp" ? (ehContinental ? "copas continentais" : fx.competicao) : "todas as competições";
  const subLabel = sub === "casaA" ? "Casa do " + fx.home : sub === "casaB" ? "Casa do " + fx.away : `últimos ${jogos.length}`;
  return { jogos, vA, e, vB, gA, gB, tend, contexto: `${subLabel} · ${escLabel}` };
}
/* Miolo do confronto direto (sem wrapper: entra no rx-card compartilhado com o raio-x) */
function h2hCorpo(fx, escopo, fi){
  const { jogos: todos } = computaH2H(fx, escopo);
  const ehContinental = ehContinentalLiga(fx.ligaId);
  if (!todos.length){
    const msg = escopo === "comp"
      ? `Sem confronto direto ${ehContinental ? "em copas continentais" : `no ${fx.competicao}`} na base — em "Quais jogos?", troque pra "Todos os jogos".`
      : `Estas duas equipes não têm confronto direto registrado na base — costuma acontecer quando nunca se enfrentaram (ex.: adversário estrangeiro de estreia).`;
    return `<div class="empty-box" style="margin-top:6px">${msg}</div>`;
  }
  const sub = state.h2hSub || "ult";
  const v = h2hView(fx, escopo, sub);
  const jogos = v.jogos;

  const subBtn = (k, txt) => `<button class="h2h-subtab ${sub===k?'on':''}" onclick="setH2hSub('${k}')">${txt}</button>`;
  const subtabs = `<div class="h2h-subtabs">${subBtn("ult","Últimos jogos")}${subBtn("casaA","Casa do "+fx.home)}${subBtn("casaB","Casa do "+fx.away)}</div>`;

  // médias comparadas (estilo aba Números), calculadas SÓ sobre estes confrontos
  const med = sel => { const vals = jogos.map(sel).filter(x => x != null); return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null; };
  const linhaH = (key, label, a, b, dec=1, sufixo="") => {
    if (a == null || b == null) return "";
    const max = Math.max(a, b, 0.001);
    return `<div class="rx-row rx-click" title="Gerar card pra postar" onclick="abrirCardH2HStat(${fi}, '${key}', '${escapeHtml(label)}', ${a}, ${b}, ${dec}, '${sufixo}')">
      <div class="rx-side"><span class="rx-val tnum">${fmt(a,dec)}${sufixo}</span><div class="rx-bar"><div class="rx-fill home" style="width:${a/max*100}%"></div></div></div>
      <div class="rx-label">${label} <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:.55; vertical-align:-1px"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v13"/></svg></div>
      <div class="rx-side away"><div class="rx-bar"><div class="rx-fill away" style="width:${b/max*100}%"></div></div><span class="rx-val tnum">${fmt(b,dec)}${sufixo}</span></div>
    </div>`;
  };
  const linhasMedias =
    linhaH("gols", "Gols marcados", med(j=>j.golsA), med(j=>j.golsB)) +
    linhaH("fin", "Finalizações", med(j=>j.statsA.fin ?? null), med(j=>j.statsB.fin ?? null)) +
    linhaH("chutesGol", "Chutes a gol", med(j=>j.statsA.chutesGol ?? null), med(j=>j.statsB.chutesGol ?? null)) +
    linhaH("cantos", "Escanteios", med(j=>j.statsA.cantos ?? null), med(j=>j.statsB.cantos ?? null)) +
    linhaH("defesas", "Defesas de goleiro", med(j=>j.statsA.defesas ?? null), med(j=>j.statsB.defesas ?? null)) +
    linhaH("faltas", "Faltas cometidas", med(j=>j.statsA.faltas ?? null), med(j=>j.statsB.faltas ?? null)) +
    linhaH("amarelos", "Cartões amarelos", med(j=>j.statsA.amarelos ?? null), med(j=>j.statsB.amarelos ?? null)) +
    linhaH("vermelhos", "Cartões vermelhos", med(j=>j.statsA.vermelhos ?? null), med(j=>j.statsB.vermelhos ?? null), 2) +
    linhaH("posse", "Posse de bola", med(j=>j.statsA.posse ?? null), med(j=>j.statsB.posse ?? null), 0, "%");
  const mediasBloco = linhasMedias.trim()
    ? `<div class="rx-group" style="margin-bottom:16px"><div class="rx-group-t">Médias por jogo · só nestes confrontos</div>${linhasMedias}</div>`
    : "";

  const tendHTML = v.tend.map(t => `<div class="tend-row">
      <span class="tend-ico">${t.icon}</span>
      <span class="tend-txt">${t.txt}</span>
      <span class="tend-bar"><span style="width:${t.pct}%"></span></span>
      <span class="tend-hit">${t.hit} de ${t.n}</span>
    </div>`).join("");
  const tendBloco = tendHTML ? `<div class="tend-box">${tendHTML}</div>` : "";

  const dataBR = ts => { const [y,m,d] = ts.split("-"); return `${d}/${m}/${y.slice(2)}`; };
  const crest = nome => `<span class="h2h-crest">${escudoOuIniciais(nome)}</span>`;
  const rows = jogos.map(j => {
    const hostWin = j.hostGols > j.visGols, visWin = j.visGols > j.hostGols;
    const hostCor = j.hostEhA ? "a" : "b", visCor = j.hostEhA ? "b" : "a";
    return `<div class="h2h-game">
      <div class="h2h-when">${dataBR(j.ts)} · ${j.comp}</div>
      <div class="h2h-vs">
        <span class="h2h-team ${hostWin?"win "+hostCor:""}">${crest(j.hostNome)}<span class="nm">${j.hostNome}</span></span>
        <span class="h2h-pts"><b class="${hostWin?hostCor:""}">${j.hostGols}</b><i>×</i><b class="${visWin?visCor:""}">${j.visGols}</b></span>
        <span class="h2h-team right ${visWin?"win "+visCor:""}"><span class="nm">${j.visNome}</span>${crest(j.visNome)}</span>
      </div>
    </div>`;
  }).join("");

  const mediaGols = ((v.gA + v.gB) / jogos.length).toFixed(1).replace(".", ",");
  return `
      <div class="h2h-tally">
        <div class="h2h-col home"><div class="n">${v.vA}</div><div class="l">vitórias<br>${fx.home}</div></div>
        <div class="h2h-col"><div class="n">${v.e}</div><div class="l">empates</div></div>
        <div class="h2h-col away"><div class="n">${v.vB}</div><div class="l">vitórias<br>${fx.away}</div></div>
      </div>
      <div class="rx-sample">${jogos.length} confronto${jogos.length===1?"":"s"} · ${v.gA}–${v.gB} no placar agregado · ${mediaGols} gols por jogo</div>

        Gerar card
      </button>
      <div class="h2h-list">${rows}</div>`;
}

/* ---------- QUENTES: forma recente de cada time (últimos 10, escopo do filtro) ---------- */
const QT_JANELA = 10;
function formaTime(tid, ligaId, escopo){
  const jogos = getJogosRx(tid, ligaId, QT_JANELA, escopo); // mais recente primeiro
  if (!jogos.length) return null;
  const res = jogos.map(j => j.gols > j.golsSof ? "v" : j.gols < j.golsSof ? "d" : "e");
  // sequências (a partir do jogo mais recente)
  let sV = 0; while (sV < res.length && res[sV] === "v") sV++;
  let sInv = 0; while (sInv < res.length && res[sInv] !== "d") sInv++;
  let sSemV = 0; while (sSemV < res.length && res[sSemV] !== "v") sSemV++;
  let sMarca = 0; while (sMarca < jogos.length && jogos[sMarca].gols > 0) sMarca++;
  const seqs = [];
  if (sV >= 2) seqs.push({ icon: "🔥", txt: `Venceu os últimos ${sV}` });
  else if (sInv >= 3) seqs.push({ icon: "🛡️", txt: `Não perde há ${sInv} jogos` });
  else if (sSemV >= 3) seqs.push({ icon: "🥶", txt: `Não vence há ${sSemV} jogos` });
  if (sMarca >= 3) seqs.push({ icon: "⚽", txt: `Marcou gol nos últimos ${sMarca}` });
  // tendências (direção dominante, com aproveitamento)
  const mk = (getter, linha, label) => {
    const vals = jogos.map(getter).filter(x => x != null);
    if (!vals.length) return null;
    const over = vals.filter(x => x > linha).length, under = vals.length - over;
    const mais = over >= under, hit = mais ? over : under;
    return { txt: `${mais?"Mais":"Menos"} de ${String(linha).replace(".",",")} ${label}`, hit, n: vals.length, pct: Math.round(hit/vals.length*100) };
  };
  const mkBool = (pred, txtSim, txtNao) => {
    const sim = jogos.filter(pred).length, nao = jogos.length - sim;
    const ehSim = sim >= nao, hit = ehSim ? sim : nao;
    return { txt: ehSim ? txtSim : txtNao, hit, n: jogos.length, pct: Math.round(hit/jogos.length*100) };
  };
  const tend = [
    mk(j => j.gols + j.golsSof, H2H_LINHAS.gols, "gols na partida"),
    mkBool(j => j.gols > 0 && j.golsSof > 0, "Ambas marcam", "Ambas NÃO marcam"),
    mkBool(j => j.golsSof === 0, "Não sofreu gol", "Sofreu gol"),
    mk(j => (j.own.cantos ?? null) != null && (j.adv.cantos ?? null) != null ? j.own.cantos + j.adv.cantos : null, H2H_LINHAS.escanteios, "escanteios na partida"),
    mk(j => (j.own.amarelos ?? null) != null && (j.adv.amarelos ?? null) != null ? (j.own.amarelos||0)+(j.own.vermelhos||0)+(j.adv.amarelos||0)+(j.adv.vermelhos||0) : null, H2H_LINHAS.cartoes, "cartões na partida"),
  ].filter(Boolean);
  return { n: jogos.length, res, seqs, tend };
}
function quentesCorpo(fx, escopo, fi){
  const fH = formaTime(fx.homeId, fx.ligaId, escopo);
  const fA = formaTime(fx.awayId, fx.ligaId, escopo);
  if (!fH && !fA) return `<div class="empty-box" style="margin-top:6px">Sem jogos registrados pra calcular a forma — em "Quais jogos?", troque pra "Todos os jogos".</div>`;
  const painel = (f, nome, side) => {
    if (!f) return `<div class="qt-panel"><div class="qt-head">${teamCrest(nome)}<span class="nm">${nome}</span></div><div class="empty-box">Sem jogos no filtro atual.</div></div>`;
    // sequência V/E/D: mais antigo → mais recente (padrão de leitura)
    const boxes = [...f.res].reverse().map(r => `<span class="qt-box ${r}">${r==="v"?"V":r==="d"?"D":"E"}</span>`).join("");
    const seqHTML = f.seqs.map(s => `<div class="qt-seqline"><span class="ico">${s.icon}</span>${s.txt}</div>`).join("");
    const tendHTML = f.tend.map(t => `<div class="qt-row ${t.pct>=70?"hot":""}">
        <span class="txt">${t.txt}</span><span class="hit">${t.hit}/${t.n}</span>
      </div>`).join("");
    return `<div class="qt-panel ${side}">
      <div class="qt-head">${teamCrest(nome)}<span class="nm">${nome}</span></div>
      <div class="qt-sub">últimos ${f.n} jogos</div>
      <div class="qt-seq">${boxes}</div>
      ${seqHTML}
      <div class="qt-list">${tendHTML}</div>
    </div>`;
  };
  return `
    <div class="rx-sample" style="margin:2px 0 12px">forma recente · sequências e tendências que ajudam na leitura do jogo · 70%+ marcadas em verde</div>
    <button class="h2h-cardbtn" onclick="abrirCardQuentes(${fi})">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4M8 11l4 4 4-4M12 15V3"/></svg>
      Gerar card
    </button>
    <div class="qt-grid">
      ${painel(fH, fx.home, "home")}
      ${painel(fA, fx.away, "away")}
    </div>`;
}

/* ---------- ESCALAÇÕES: campinho (provável = último XI + desfalques oficiais) ---------- */
function normNome(s){ return (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim(); }
function escalacoesCorpo(fx, fi){
  const dataBR = ts => { const [y,m,d] = (ts||"").split("-"); return d ? `${d}/${m}/${y.slice(2)}` : ""; };
  const desfalques = (SEM.escalacoes?.desfalques || {})[String(fx.id)] || [];

  const painel = (tid, nome, side) => {
    const e = (SEM.escalacoes?.ultimas || {})[String(tid)];
    const desfTime = desfalques.filter(x => x.tid === tid);
    const desfNorm = desfTime.map(x => normNome(x.nome));
    if (!e || !e.xi?.length) return `<div class="qt-panel ${side}">
      <div class="qt-head">${teamCrest(nome)}<span class="nm">${nome}</span></div>
      <div class="empty-box" style="margin-top:10px">Sem escalação registrada do último jogo deste time.</div></div>`;

    // liga o nome da escalação ao elenco (pra abrir o perfil ao clicar)
    const elenco = ELENCOS[String(tid)] || [];
    const achaIdx = nomeEsc => {
      const n = normNome(nomeEsc);
      let i = elenco.findIndex(j => normNome(j.name) === n);
      if (i >= 0) return i;
      // "M. Cassierra" → inicial + sobrenome
      const m = n.match(/^(\w)\.\s*(.+)$/);
      if (m){
        const cands = elenco.map((j, k) => [j, k]).filter(([j]) => {
          const nj = normNome(j.name);
          return nj.endsWith(m[2]) && nj.startsWith(m[1]);
        });
        if (cands.length === 1) return cands[0][1];
      }
      // sobrenome único
      const sobren = n.split(" ").pop();
      const c2 = elenco.map((j, k) => [j, k]).filter(([j]) => normNome(j.name).split(" ").includes(sobren));
      return c2.length === 1 ? c2[0][1] : -1;
    };

    const temGrid = e.xi.some(p => p.grid);
    const linhas = {};
    e.xi.forEach(p => {
      const r = temGrid
        ? (parseInt((p.grid || "0:0").split(":")[0]) || 0)
        : ({ G: 1, D: 2, M: 3, F: 4 }[p.pos] ?? 3);
      (linhas[r] = linhas[r] || []).push(p);
    });
    const ordens = Object.keys(linhas).map(Number).sort((a, b) => b - a); // ataque no topo, goleiro embaixo
    const rowsHTML = ordens.map(r => `<div class="esc-row">${linhas[r]
      .sort((a, b) => (parseInt((a.grid||"0:0").split(":")[1])||0) - (parseInt((b.grid||"0:0").split(":")[1])||0))
      .map(p => {
        const foto = window.SC_ASSETS?.fotos?.[p.nome];
        const idx = achaIdx(p.nome);
        const fora = desfNorm.some(dn => dn === normNome(p.nome) || (normNome(p.nome).match(/^\w\./) && dn.endsWith(normNome(p.nome).split(" ").pop())));
        const clique = idx >= 0 ? `onclick="abrirJogador(${fi}, '${side}', ${idx})"` : "";
        const sobrenome = p.nome.split(" ").length > 1 && p.nome.length > 13 ? p.nome.split(" ").slice(-1)[0] : p.nome;
        return `<button class="esc-p ${idx>=0?"click":""} ${fora?"out":""}" ${clique} title="${p.nome}${fora?" · FORA":""}">
          <div class="esc-dot">${foto ? `<img src="${foto}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'${p.num ?? ""}'}))">` : `<span>${p.num ?? ""}</span>`}${fora?'<span class="esc-x">✕</span>':""}</div>
          <div class="esc-nm"><b>${p.num ?? ""}</b> ${sobrenome}</div>
        </button>`;
      }).join("")}</div>`).join("");

    const desfHTML = desfTime.length ? `<div class="esc-desf">🚫 <b>Fora:</b> ${desfTime.map(x => `${x.nome} <span>(${x.motivo})</span>`).join(" · ")}</div>` : "";
    return `<div class="qt-panel ${side}">
      <div class="qt-head">${teamCrest(nome)}<span class="nm">${nome}</span></div>
      <div class="qt-sub">${e.formacao || "formação —"}${e.tecnico ? ` · téc. ${e.tecnico}` : ""} · base: × ${e.adv} (${dataBR(e.ts)})</div>
      <div class="esc-pitch ${side}"><div class="esc-marks"></div>${rowsHTML}</div>
      ${desfHTML}
    </div>`;
  };

  const notaDesf = desfalques.length
    ? `desfalques oficiais marcados com ✕`
    : `sem dados de desfalque pra este jogo (a fonte não cobre todas as competições)`;
  return `
    <div class="rx-sample" style="margin:2px 0 12px">escalação <b>provável</b> — base: último jogo · ${notaDesf} · confirmada sai ~1h antes no <a href="https://t.me/apitoualertas" target="_blank" rel="noopener" style="color:var(--acc); font-weight:700">t.me/apitoualertas</a> 🔔</div>
    <div class="qt-grid">
      ${painel(fx.homeId, fx.home, "home")}
      ${painel(fx.awayId, fx.away, "away")}
    </div>`;
}

/* ---------- PERFIL DO ÁRBITRO (mercado de cartões) ---------- */
function setArbJanela(n){ state.arbJanela = n; render(); }
function setArbEscopo(e){ state.arbEscopo = e; render(); }
/* métricas do árbitro sob ESCOPO (geral/casa/fora/confronto) + JANELA (5/10/15/30/base) */
function arbView(arb, fx){
  const jan = state.arbJanela ?? 10;
  const esc = state.arbEscopo || "geral";
  const todos = arb.ultimos || [];
  const filtro = esc === "casa" ? (g => g.jogo.includes(fx.home))
               : esc === "fora" ? (g => g.jogo.includes(fx.away))
               : esc === "confronto" ? (g => g.jogo.includes(fx.home) && g.jogo.includes(fx.away))
               : (() => true);
  const escLabel = esc === "casa" ? `com o ${fx.home}` : esc === "fora" ? `com o ${fx.away}`
                 : esc === "confronto" ? `no confronto ${fx.home} x ${fx.away}` : "geral";
  const subset = todos.filter(filtro);

  // GERAL + base completa = agregado de carreira (tem pênaltis/VAR)
  if (esc === "geral" && jan === "base"){
    return { esc, escLabel, janela: `base completa (${arb.jogos || "?"} jogos)`, n: arb.jogos,
             jogos: todos.slice(0, 10), vazio: false,
             amarelos: arb.amarelos, faltas: arb.faltas, vermelhos: arb.vermelhos,
             amarelosCasa: arb.amarelosCasa, amarelosFora: arb.amarelosFora,
             penaltis: arb.penaltis, varm: arb.var };
  }
  const jogos = jan === "base" ? subset : subset.slice(0, jan);
  if (!jogos.length){
    return { esc, escLabel, janela: "sem jogos", n: 0, jogos: [], vazio: true };
  }
  const med = sel => Math.round(jogos.reduce((a, g) => a + sel(g), 0) / jogos.length * 100) / 100;
  const janLabel = jan === "base" ? `todos os ${jogos.length} da base recente` : `últimos ${jogos.length}`;
  return { esc, escLabel, janela: `${janLabel} · ${escLabel}`, n: jogos.length, jogos, vazio: false,
           amarelos: med(g => g.am), faltas: med(g => g.faltas), vermelhos: med(g => g.vm),
           amarelosCasa: med(g => g.amC), amarelosFora: med(g => g.amF),
           penaltis: null, varm: null };
}
function renderArbitro(){
  const fi = state.jogoAberto ?? 0;
  const fx = FIXTURES[fi];

  const v = arbView(arb, fx);
  const nb = x => x != null ? String(x).replace(".", ",") : "—";
  const tile = (k, val, cls="") => `<div class="tile ${cls}"><div class="k">${k}</div><div class="big tnum" style="font-size:34px">${val}</div></div>`;
  const jan = state.arbJanela ?? 10;
  const esc = state.arbEscopo || "geral";
  const temUlt = (arb.ultimos || []).length >= 3;

  // ----- FILTRO 1: escopo (Geral · mandante · visitante · Confronto) -----
  const chipE = (e, txt) => `<button class="chip ${esc===e?'on':''}" onclick="setArbEscopo('${e}')">${txt}</button>`;
  const chipJ = (n, txt) => `<button class="chip ${jan===n?'on':''}" onclick="setArbJanela(${typeof n==='string'?`'${n}'`:n})">${txt}</button>`;
  const filtros = temUlt ? `
    <div class="jogo-filtros" style="margin-top:16px">

      <div class="qlabel">Quantos jogos contar?</div>
      <div class="filters">${chipJ(5,"Últimos 5")}${chipJ(10,"Últimos 10")}${chipJ(15,"Últimos 15")}${chipJ(30,"Últimos 30")}${chipJ("base","Base completa")}</div>
    </div>` : "";

  // ----- corpo (tudo reage a escopo + janela) -----
  let corpo;
  if (v.vazio){
    corpo = `<div class="empty-box" style="margin-top:16px">Sem jogos do ${arb.nome.split(" ")[0]} ${v.escLabel} nos últimos 12 meses da base — troque o filtro acima (ex.: "Geral").</div>`;
  } else {
    let splitHTML = "";
    if (v.amarelosCasa != null && v.amarelosFora != null){
      const c = v.amarelosCasa, f = v.amarelosFora, max = Math.max(c, f, 0.001);
      const vies = f > c * 1.15 ? "tende a dar MAIS cartão pro visitante" : c > f * 1.15 ? "tende a dar MAIS cartão pro mandante" : "equilibrado entre mandante e visitante";
      splitHTML = `
        <div class="rx-card" style="margin-top:18px">
          <div class="rx-group-t">Amarelos por jogo · mandante × visitante</div>
          <div class="rx-row">
            <div class="rx-side"><span class="rx-val tnum">${nb(c)}</span><div class="rx-bar"><div class="rx-fill home" style="width:${c/max*100}%"></div></div></div>
            <div class="rx-label">🟨 amarelos</div>
            <div class="rx-side away"><div class="rx-bar"><div class="rx-fill away" style="width:${f/max*100}%"></div></div><span class="rx-val tnum">${nb(f)}</span></div>
          </div>
          <div class="rx-sample" style="margin-top:8px">esquerda = pro time da CASA · direita = pro VISITANTE · leitura: ${vies}</div>
        </div>`;
    }
    const dataBR = ts => { const [y,m,d] = ts.split("-"); return `${d}/${m}/${y.slice(2)}`; };
    const extrato = v.jogos.length ? `
      <div class="section-h" style="margin-top:24px"><span class="lbl">Jogo a jogo · ${v.escLabel}</span><span class="count tnum">${v.jogos.length} jogos</span></div>
      <div class="jg-list">${v.jogos.map(g => `
        <div class="jg-game" style="grid-template-columns:66px 1fr auto">
          <span class="jg-date">${dataBR(g.ts)}</span>
          <span class="jg-adv">${g.jogo}</span>
          <span class="jg-vals"><b class="amber tnum">${g.am}</b> 🟨${g.vm ? ` · <b class="tnum" style="color:#E05A4E">${g.vm}</b> 🟥` : ""} · <b class="tnum">${g.faltas}</b> faltas</span>
        </div>`).join("")}</div>` : "";
    corpo = `
      <div class="tiles" style="margin-top:16px">
        ${tile("🟨 Amarelos / jogo", nb(v.amarelos), "hero-a")}
        ${tile("Faltas / jogo", nb(v.faltas), "hero-b")}
        ${tile("🟥 Vermelhos / jogo", nb(v.vermelhos))}
        ${v.penaltis != null ? tile("Pênaltis / jogo", nb(v.penaltis)) : tile("Jogos na amostra", v.n ?? "—")}
      </div>
      ${splitHTML}
      <button class="h2h-cardbtn" onclick="abrirCardArbitro()" style="margin-top:16px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4M8 11l4 4 4-4M12 15V3"/></svg>
        Gerar card
      </button>
      ${extrato}
      <div class="dna-panel">
        ${v.varm != null ? `<div class="dna-row"><span class="k">Intervenções de VAR por jogo</span><span class="v flat tnum">${nb(v.varm)}</span></div>` : ""}
        <div class="dna-row"><span class="k">Amostra ativa: ${v.janela}</span><span class="v flat tnum">⚖️</span></div>
      </div>`;
  }

  el.innerHTML = `
    <button class="back" onclick="go('jogo', null, null, null, ${fi})"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg> ${fx.home} x ${fx.away}</button>
    <div class="phead">
      <div class="avatar" style="${avatarStyle(arb.nome.length*7)}; font-size:26px">👨‍⚖️</div>
      <div style="flex:1; min-width:200px">
        <h1>${arb.nome}</h1>
        <div class="pmeta">Árbitro <span class="dot"></span> <span class="badge">apita ${fx.home} x ${fx.away}</span></div>
      </div>
    </div>
    ${filtros}
    ${corpo}
    ${sourceNoteQI()}
  `;
}

function renderJogo(){
  const fi = state.jogoAberto ?? 0;
  const fx = FIXTURES[fi];

  const ehLiga = ehLigaRegular(fx.ligaId);  // liga regular: janela de até 30 jogos
  const ehContinental = ehContinentalLiga(fx.ligaId);
  const tab = state.jogoTab || "stats";

  const tabBtn = (k, txt) => `<button class="jogo-tab ${tab===k?'on':''}" onclick="setJogoTab('${k}')">${txt}</button>`;

  const labelComp = ehContinental ? "Só continentais" : `Só ${fx.competicao}`;
  const chipJ = n => `<button class="chip ${state.rxJanela===n?'on':''}" onclick="setRxJanela(${n})">Últimos ${n}</button>`;
  const chipE = (e, label) => `<button class="chip ${state.rxEscopo===e?'on':''}" onclick="setRxEscopo('${e}')">${label}</button>`;
  const grupoJanela = `<div class="qlabel">Quantos jogos contar?</div>
    <div class="filters">${chipJ(5)}${chipJ(10)}${chipJ(15)}${ehLiga ? chipJ(30) : ""}</div>`;
  const grupoEscopo = `<div class="qlabel">Quais jogos?</div>
    <div class="filters">${chipE("comp", labelComp)}${chipE("geral", "Todos os jogos")}</div>`;
  const filtrosRow = tab === "esc" ? "" : `<div class="jogo-filtros">${tab === "stats" ? grupoJanela : ""}${grupoEscopo}</div>`;

  const teamsHead = `
    <div class="rx-teams-head">
      <div class="rx-team">${teamCrest(fx.home)}<span class="tn">${fx.home}</span><span class="rx-dot home"></span></div>
      <span class="rx-vs">${tab === "h2h" ? "confronto direto" : tab === "quentes" ? "forma recente" : tab === "esc" ? "escalações" : "média por jogo"}</span>
      <div class="rx-team away"><span class="rx-dot away"></span><span class="tn">${fx.away}</span>${teamCrest(fx.away)}</div>
    </div>`;

  // ----- Corpo do card: confronto direto OU quentes OU escalações OU médias -----
  let corpo;
  if (tab === "h2h"){
    corpo = h2hCorpo(fx, state.rxEscopo, fi);
  } else if (tab === "quentes"){
    corpo = quentesCorpo(fx, state.rxEscopo, fi);
  } else if (tab === "esc"){
    corpo = escalacoesCorpo(fx, fi);
  } else {
    const rxH = computeRx(fx.homeId, fx.ligaId, state.rxJanela, state.rxEscopo);
    const rxA = computeRx(fx.awayId, fx.ligaId, state.rxJanela, state.rxEscopo);
    if (rxH && rxA){
      const linha = (key, label, a, b, dec=1, sufixo="") => {
        if (a == null || b == null) return "";
        const max = Math.max(a, b, 0.001);
        return `<div class="rx-row rx-click" title="Gerar card pra postar" onclick="abrirCard(${fi}, '${key}', '${escapeHtml(label)}', ${a}, ${b}, ${dec}, '${sufixo}')">
          <div class="rx-side"><span class="rx-val tnum">${fmt(a,dec)}${sufixo}</span><div class="rx-bar"><div class="rx-fill home" style="width:${a/max*100}%"></div></div></div>
          <div class="rx-label">${label} <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:.55; vertical-align:-1px"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v13"/></svg></div>
          <div class="rx-side away"><div class="rx-bar"><div class="rx-fill away" style="width:${b/max*100}%"></div></div><span class="rx-val tnum">${fmt(b,dec)}${sufixo}</span></div>
        </div>`;
      };
      const grupo = (titulo, linhas) => linhas.trim() ? `<div class="rx-group"><div class="rx-group-t">${titulo}</div>${linhas}</div>` : "";
      corpo = `
        <div class="rx-sample">amostra: ${rxH.jogos} jogo${rxH.jogos===1?"":"s"} do ${fx.home} · ${rxA.jogos} jogo${rxA.jogos===1?"":"s"} do ${fx.away}${state.rxEscopo==="comp" ? (ehContinental ? " em copas continentais" : ` (só ${fx.competicao})`) : ""}${(rxH.jogos < state.rxJanela || rxA.jogos < state.rxJanela) ? " (todos os disponíveis)" : ""}${(rxH.inclui2025 || rxA.inclui2025) ? " · inclui temporada 2025" : ""}</div>
        ${grupo("Ataque", linha("gols", "Gols marcados", rxH.gols, rxA.gols) + linha("fin", "Finalizações", rxH.fin, rxA.fin) + linha("chutesGol", "Chutes a gol", rxH.chutesGol, rxA.chutesGol) + linha("cantos", "Escanteios", rxH.cantos, rxA.cantos))}
        ${grupo("Defesa", linha("golsSof", "Gols sofridos", rxH.golsSof, rxA.golsSof) + linha("finSof", "Finalizações sofridas", rxH.finSof, rxA.finSof) + linha("cantosSof", "Escanteios cedidos", rxH.cantosSof, rxA.cantosSof) + linha("defesas", "Defesas de goleiro", rxH.defesas, rxA.defesas))}
        ${grupo("Disciplina", linha("faltas", "Faltas cometidas", rxH.faltas, rxA.faltas) + linha("amarelos", "Cartões amarelos", rxH.amarelos, rxA.amarelos) + linha("vermelhos", "Cartões vermelhos", rxH.vermelhos, rxA.vermelhos, 2))}
        ${grupo("Controle", linha("posse", "Posse de bola", rxH.posse, rxA.posse, 0, "%"))}`;
    } else {
      corpo = `<div class="empty-box" style="margin-top:6px">Um dos times ainda não tem jogos suficientes ${state.rxEscopo==="comp" ? (ehContinental ? "em copas continentais" : `no ${fx.competicao}`) : ""} pra calcular médias — em "Quais jogos?", troque pra "Todos os jogos".</div>`;
    }
  }

  // faixa do árbitro (quando já designado) — clicável → perfil completo
  const arb = (SEM.arbitros || {})[String(fx.id)];
  const numBR = v => v != null ? String(v).replace(".", ",") : null;
  const arbBar = arb && arb.nome ? `<button class="arb-bar click" onclick="state.arbJanela=10; state.arbEscopo='geral'; go('arbitro')">👨‍⚖️ Árbitro: <b>${arb.nome}</b>${arb.amarelos != null ? ` · 🟨 ${numBR(arb.amarelos)} amarelos/jogo` : ""}${arb.faltas != null ? ` · ${numBR(arb.faltas)} faltas/jogo` : ""}${arb.jogos ? ` <span>(${arb.jogos} jogos na base)</span>` : ""}<span class="arb-go">ver perfil ›</span></button>` : "";

  const raioxBloco = `${tabsRow}${arbBar}${filtrosRow}<div class="rx-card" style="margin-top:14px">${teamsHead}${corpo}</div>`;

  // ----- Elencos: resumo (top 8) + expansor -----
  const elencoTable = (tid, nome, side) => {
    const lista = ELENCOS[String(tid)] || [];
    if (!lista.length) return "";
    const aberto = !!state.elencoAberto[side];
    const visiveis = aberto ? lista : lista.slice(0, 8);
    const rows = visiveis.map((j) => {
      const idx = lista.indexOf(j);
      return `
      <tr onclick="abrirJogador(${fi}, '${side}', ${idx})">
        <td class="left"><div class="pcell">
          <div class="avatar" style="width:30px;height:30px;border-radius:8px;font-size:11px;${avatarStyle(j.name.length*7)}">${fotoOuIniciais(j.name)}</div>
          <div><div class="nm" style="font-size:13px">${j.name}</div><div class="sm">${j.pos || "—"}</div></div>
        </div></td>
        <td class="tnum">${j.apps}</td>
        <td class="num amber tnum">${j.pos==="Goleiro" ? "—" : fmt(j.media)}</td>
        <td class="num acc tnum">${j.pos==="Goleiro" ? "—" : fmt(j.mediaOn)}</td>
        <td class="tnum">${j.faltasCom != null ? fmt(j.faltasCom) : "—"}</td>
        <td class="tnum">${j.faltasSof != null ? fmt(j.faltasSof) : "—"}</td>
      </tr>`;
    }).join("");
    return `<div class="section-h" style="margin-top:26px"><span class="lbl">Elenco · ${nome}</span><span class="count tnum">${lista.length} jogadores</span></div>
      <div class="tablewrap"><table style="min-width:600px">
        <thead><tr><th class="left">Jogador</th><th>Jogos</th><th>Finaliz./jogo</th><th>Chutes a gol</th><th>Faltas com.</th><th>Faltas sof.</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      ${lista.length > 8 ? `<button class="expand-btn" onclick="toggleElenco('${side}')">${aberto ? "Mostrar menos" : `Ver elenco completo (${lista.length})`}</button>` : ""}`;
  };
  // elencos só na aba Números (nas outras viram ruído)
  const elencos = (tab === "stats" && fx.homeId != null)
    ? elencoTable(fx.homeId, fx.home, "home") + elencoTable(fx.awayId, fx.away, "away")
    : "";

  el.innerHTML = `
    <button class="back" onclick="go('oportunidades')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg> Jogos da semana</button>
    <p class="eyebrow">${fx.competicao} · ${fmtHorario(fx.kickoff)}</p>
    <h1 class="page">${fx.home} x ${fx.away}</h1>
    <p class="sub">O raio-x completo da partida: médias dos times e de cada jogador. Clique num jogador pra ver o perfil.</p>
    ${raioxBloco}
    ${elencos}
    ${sourceNoteQI()}
  `;
}

/* ---------- AO VIVO — acompanhamento simulado (PRD v0.6 Tela 06 + v0.7 notificações) ---------- */
let sim = null;
function novaSimulacao(fi){
  const fx = FIXTURES[fi];
  return {
    fi, minute: 0, running: false, timer: null, events: [],
    players: fx.players.map((p, pi) => {
      const a = analisarJogador(p, fx.sedeNeutra);
      // sem odds: usa "linha provisória" derivada da projeção (floor(λ)+0.5)
      const line = a.destaque ? a.destaque.line : Math.floor(a.lambda) + 0.5;
      return { pi, name: p.name, team: p.team, lambda: a.lambda, line, price: a.destaque ? a.destaque.price : null, provisoria: !a.destaque, shots: 0, hit: false };
    }),
  };
}
function pausarSimulacao(){
  if (sim && sim.timer){ clearInterval(sim.timer); sim.timer = null; sim.running = false; }
}
function iniciarSimulacao(){
  if (!sim) sim = novaSimulacao(0);
  if (sim.running) return;
  if (sim.minute >= 90) sim = novaSimulacao(sim.fi);
  sim.running = true;
  sim.timer = setInterval(tickSimulacao, 650);
  renderAoVivo();
}
function reiniciarSimulacao(){
  pausarSimulacao();
  sim = novaSimulacao(sim ? sim.fi : 0);
  renderAoVivo();
}
function trocarJogoSimulado(fi){
  pausarSimulacao();
  sim = novaSimulacao(fi);
  renderAoVivo();
}
function tickSimulacao(){
  sim.minute++;
  sim.players.forEach(pl => {
    // processo de Poisson discretizado: prob. de finalizar neste minuto ≈ λ/90
    if (Math.random() < pl.lambda / 90){
      pl.shots++;
      const cruzouLinha = !pl.hit && pl.shots > pl.line;
      if (cruzouLinha) pl.hit = true;
      sim.events.unshift({
        min: sim.minute, milestone: cruzouLinha,
        text: cruzouLinha
          ? `${pl.name} finalizou. Total: ${pl.shots} — linha ${linhaMais(pl.line)} batida ✓`
          : `${pl.name} finalizou. Total: ${pl.shots} ${pl.shots===1?'finalização':'finalizações'}.`
      });
    }
  });
  if (sim.minute >= 90){
    pausarSimulacao();
    sim.events.unshift({ min: 90, milestone: true, text: "Fim de jogo. Resumo enviado aos usuários que acompanham." });
  }
  renderAoVivo();
}
function renderAoVivo(){
  if (state.view !== "aovivo") return;
  if (!sim) sim = novaSimulacao(0);
  const fx = FIXTURES[sim.fi];

  const seletor = FIXTURES.map((f, fi) =>
    `<button class="chip ${fi===sim.fi?'on':''}" onclick="trocarJogoSimulado(${fi})">${f.home} x ${f.away}</button>`).join("");

  const tracks = sim.players.map(pl => {
    const esperado = pl.lambda * sim.minute / 90;
    const pct = Math.min(pl.shots / (pl.line + 0.5) * 100, 100);
    const markPct = Math.min(pl.line / (pl.line + 0.5) * 100, 100);
    let status, cls;
    if (pl.hit){ status = "Linha batida ✓"; cls = "done"; }
    else if (sim.minute === 0){ status = "aguardando"; cls = ""; }
    else if (pl.shots >= esperado){ status = "no ritmo ↑"; cls = "ahead"; }
    else { status = "abaixo do ritmo ↓"; cls = "behind"; }
    return `<div class="track-card ${pl.hit?'hit':''}">
      <div class="track-top">
        <div class="avatar" style="width:34px;height:34px;border-radius:9px;font-size:12px;${avatarStyle(pl.name.length*7)}">${fotoOuIniciais(pl.name)}</div>
        <div class="nm">${pl.name}</div>
        <div class="status ${cls}">${status}</div>
      </div>
      <div class="track-line"><b>${linhaMais(pl.line)}</b> finalizações · ${pl.price ? fmt(pl.price,2) : "linha provisória"} · projeção ${fmt(pl.lambda,2)}</div>
      <div class="progress"><div class="mark" style="left:${markPct}%"></div><div class="fill" style="width:${pct}%"></div></div>
      <div class="track-nums"><span><b>${pl.shots}</b> finalizações</span><span>esperado até agora: ${fmt(esperado,1)}</span></div>
    </div>`;
  }).join("");

  const feed = sim.events.length
    ? sim.events.map(e => `<div class="feed-item ${e.milestone?'milestone':''}"><span class="min tnum">${e.min}'</span><span>${e.text}</span></div>`).join("")
    : `<div class="feed-empty">As notificações do jogo vão aparecer aqui — no app real, cada uma vira um push no celular do usuário.</div>`;

  el.innerHTML = `
    <p class="eyebrow">Acompanhamento · tempo real</p>
    <h1 class="page">Seus jogadores, lance a lance</h1>
    <p class="sub">Progresso de cada linha acompanhada durante o jogo, com notificação a cada finalização.</p>
    <div class="filters" style="margin-top:16px">${seletor}</div>
    <div class="live-head">
      <div class="live-clock tnum">${sim.minute}'</div>
      <div class="live-controls">
        ${sim.running
          ? `<button class="ctrl-btn" onclick="pausarSimulacao(); renderAoVivo()">Pausar</button>`
          : `<button class="ctrl-btn primary" onclick="iniciarSimulacao()">${sim.minute===0 ? "Iniciar simulação" : sim.minute>=90 ? "Simular de novo" : "Continuar"}</button>`}
        <button class="ctrl-btn" onclick="reiniciarSimulacao()">Reiniciar</button>
      </div>
      <span class="sim-badge">simulação — dados fictícios gerados pela projeção λ de cada jogador</span>
    </div>
    <div class="live-grid">
      <div>${tracks}</div>
      <div class="feed-panel">
        <div class="t"><span class="live"></span> Notificações</div>
        ${feed}
      </div>
    </div>
    ${sourceNoteQI()}
  `;
}

function render(){
  if (state.view==="oportunidades") renderOportunidades();
  else if (state.view==="jogador") renderJogadorSimples();
  else if (state.view==="jogo") renderJogo();
  else if (state.view==="arbitro") renderArbitro();
  else if (state.view==="search") renderSearch();
  else renderRanking();
}

/* ---------- theme ---------- */
function currentTheme(){
  const attr = document.documentElement.getAttribute("data-theme");
  if (attr) return attr;
  return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function setThemeIcon(){
  const dark = currentTheme()==="dark";
  document.getElementById("themeIcon").innerHTML = dark
    ? '<circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.2M12 19.8V22M2 12h2.2M19.8 12H22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M19.1 4.9l-1.6 1.6M6.5 17.5l-1.6 1.6"/>'
    : '<path d="M20 14.5A8 8 0 0 1 9.5 4 7 7 0 1 0 20 14.5z"/>';
}
function toggleTheme(){
  const next = currentTheme()==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  setThemeIcon();
}

const GA_ID = "G-45165SE3JL";
function carregarGA(){
  if (window._gaOn) return; window._gaOn = true;
  const s = document.createElement("script");
  s.async = true; s.src = "https://www.googletagmanager.com/gtag/js?id=" + GA_ID;
  document.head.appendChild(s);
  window.dataLayer = window.dataLayer || [];
  window.gtag = function(){ dataLayer.push(arguments); };
  gtag("js", new Date());
  gtag("config", GA_ID);
}
function fecharCookieBanner(){ const b = document.getElementById("cookieBanner"); if (b) b.style.display = "none"; }
function aceitarCookies(){ try{ localStorage.setItem("sc-cookies","sim"); }catch(e){} fecharCookieBanner(); carregarGA(); }
function recusarCookies(){ try{ localStorage.setItem("sc-cookies","nao"); }catch(e){} fecharCookieBanner(); }
function initCookies(){
  let escolha = null; try{ escolha = localStorage.getItem("sc-cookies"); }catch(e){}
  if (escolha === "sim") return carregarGA();
  if (escolha === "nao") return;
  const b = document.getElementById("cookieBanner"); if (b) b.style.display = "flex";
}

/* ---------- boot ---------- */
setThemeIcon();
go("oportunidades");
initCookies();
</script>
