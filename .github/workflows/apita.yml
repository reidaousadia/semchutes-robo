name: apita
on:
  schedule:
    - cron: '*/10 * * * *'   # a cada 10 min
  workflow_dispatch: {}
concurrency:
  group: apita
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  vigiar:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vigia escalações
        env:
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python3 robo/apita.py
      - name: Salva estado (quem já foi alertado)
        run: |
          git config user.name "apitou-bot"
          git config user.email "apitou@users.noreply.github.com"
          git add robo/estado.json
          git diff --cached --quiet || (git commit -m "estado: alertas enviados" && git push)
